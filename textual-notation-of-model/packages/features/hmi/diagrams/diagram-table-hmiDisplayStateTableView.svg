<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="472" height="774" viewBox="0 0 472 774" role="img" aria-labelledby="title description">
  <title id="title">HMI display states</title>
  <desc id="description">The states of each element of the HMI display and of the collision warning, and the functions whose behavior differs in each.</desc>
  <!-- Generated from SysIDE grid CSV; SysML remains authoritative. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="0" y="0" width="472" height="54" fill="#172033"/>
  <text x="12" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">HMI display states</text>
  <rect x="0" y="54" width="112" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">State</tspan>
  </text>
  <rect x="112" y="54" width="360" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="124" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="124" dy="0">DependentFunctions</tspan>
  </text>
  <rect x="0" y="94" width="112" height="180" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">outdated</tspan>
  </text>
  <rect x="112" y="94" width="360" height="180" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="124" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="124" dy="0">The element shows no current value: its</tspan>
    <tspan x="124" dy="20">value came late or never, no value of its</tspan>
    <tspan x="124" dy="20">input has reached the display yet, or, for</tspan>
    <tspan x="124" dy="20">the scene, the drawing of the scene or the</tspan>
    <tspan x="124" dy="20">environment that hosts it is out and the</tspan>
    <tspan x="124" dy="20">scene shown is no longer current.</tspan>
    <tspan x="124" dy="20">showContent shows the element as outdated</tspan>
    <tspan x="124" dy="20">(REQ-HMI-006).</tspan>
  </text>
  <rect x="0" y="274" width="112" height="100" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="298" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">current</tspan>
  </text>
  <rect x="112" y="274" width="360" height="100" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="124" y="298" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="124" dy="0">The element shows a current value:</tspan>
    <tspan x="124" dy="20">showContent shows the scene as drawn and</tspan>
    <tspan x="124" dy="20">the vehicle speed to the whole km/h (REQ-</tspan>
    <tspan x="124" dy="20">HMI-001, REQ-HMI-003).</tspan>
  </text>
  <rect x="0" y="374" width="112" height="140" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="398" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">unavailable</tspan>
  </text>
  <rect x="112" y="374" width="360" height="140" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="124" y="398" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="124" dy="0">The warning request is outdated:</tspan>
    <tspan x="124" dy="20">giveWarning gives no collision warning,</tspan>
    <tspan x="124" dy="20">and showContent shows that the warning is</tspan>
    <tspan x="124" dy="20">unavailable (REQ-HMI-007), through each</tspan>
    <tspan x="124" dy="20">outage of the drawing of the scene as well</tspan>
    <tspan x="124" dy="20">(REQ-HMI-008).</tspan>
  </text>
  <rect x="0" y="514" width="112" height="80" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="538" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">notAsking</tspan>
  </text>
  <rect x="112" y="514" width="360" height="80" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="124" y="538" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="124" dy="0">The warning request is current and asks</tspan>
    <tspan x="124" dy="20">for no collision warning: giveWarning</tspan>
    <tspan x="124" dy="20">gives none.</tspan>
  </text>
  <rect x="0" y="594" width="112" height="180" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="618" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">asking</tspan>
  </text>
  <rect x="112" y="594" width="360" height="180" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="124" y="618" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="124" dy="0">The warning request asks: giveWarning</tspan>
    <tspan x="124" dy="20">gives the collision warning on the display</tspan>
    <tspan x="124" dy="20">and as a sound, each mode starting within</tspan>
    <tspan x="124" dy="20">0.1 s of wall-clock time after the start</tspan>
    <tspan x="124" dy="20">of a request reaches the display (REQ-</tspan>
    <tspan x="124" dy="20">HMI-004, REQ-HMI-005), through each outage</tspan>
    <tspan x="124" dy="20">of the drawing of the scene as well (REQ-</tspan>
    <tspan x="124" dy="20">HMI-008).</tspan>
  </text>
</svg>
