    <tspan x="628" dy="0">Statement</tspan>
  </text>
  <rect x="0" y="94" width="256" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">needLiveVisualizationOnAAOS</tspan>
  </text>
  <rect x="256" y="94" width="360" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="268" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="268" dy="0">VisualizationEngineeringNeed,</tspan>
    <tspan x="268" dy="20">StakeholderNeedCandidate,</tspan>
    <tspan x="268" dy="20">RequirementsManagementAttributeBase</tspan>
  </text>
  <rect x="616" y="94" width="360" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="628" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="628" dy="0">Systems engineers and reviewers need live</tspan>
    <tspan x="628" dy="20">AEBS threat and intervention state visible</tspan>
    <tspan x="628" dy="20">on an actual AAOS SDV display so that</tspan>
    <tspan x="628" dy="20">stakeholder-visible AEBS behavior can be</tspan>
    <tspan x="628" dy="20">reviewed without a host-side substitute.</tspan>
  </text>
  <rect x="0" y="214" width="256" height="160" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="238" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">needPreservedSourceProvenance</tspan>
  </text>
  <rect x="256" y="214" width="360" height="160" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="268" y="238" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="268" dy="0">VisualizationEngineeringNeed,</tspan>
    <tspan x="268" dy="20">StakeholderNeedCandidate,</tspan>
    <tspan x="268" dy="20">RequirementsManagementAttributeBase</tspan>
  </text>
  <rect x="616" y="214" width="360" height="160" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="628" y="238" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="628" dy="0">Systems engineers need source provenance,</tspan>
    <tspan x="628" dy="20">units, coordinate frame, timestamps, rate</tspan>
    <tspan x="628" dy="20">and freshness, validity, and bounded</tspan>
    <tspan x="628" dy="20">displayed cardinality preserved between</tspan>
    <tspan x="628" dy="20">native Autoware output, DE4SDV AEBS</tspan>
    <tspan x="628" dy="20">coordination state, and display-derived</tspan>
    <tspan x="628" dy="20">presentation.</tspan>
  </text>
  <rect x="0" y="374" width="256" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="398" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">needFailClosedDegradation</tspan>
  </text>
  <rect x="256" y="374" width="360" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="268" y="398" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="268" dy="0">VisualizationEngineeringNeed,</tspan>
    <tspan x="268" dy="20">StakeholderNeedCandidate,</tspan>
    <tspan x="268" dy="20">RequirementsManagementAttributeBase</tspan>
  </text>
  <rect x="616" y="374" width="360" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="628" y="398" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="628" dy="0">Systems engineers and maintainers need</tspan>
    <tspan x="628" dy="20">stale, unavailable, invalid, and restored</tspan>
    <tspan x="628" dy="20">display behavior so that a lost or invalid</tspan>
    <tspan x="628" dy="20">source cannot be misread as current AEBS</tspan>
    <tspan x="628" dy="20">state.</tspan>
  </text>
  <rect x="0" y="494" width="256" height="100" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="518" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">needCorrelatableEvidence</tspan>
  </text>
  <rect x="256" y="494" width="360" height="100" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="268" y="518" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="268" dy="0">VisualizationEngineeringNeed,</tspan>
    <tspan x="268" dy="20">StakeholderNeedCandidate,</tspan>
    <tspan x="268" dy="20">RequirementsManagementAttributeBase</tspan>
  </text>
  <rect x="616" y="494" width="360" height="100" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="628" y="518" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="628" dy="0">Verification engineers need source-to-</tspan>
    <tspan x="628" dy="20">screen correlation and replayable evidence</tspan>
    <tspan x="628" dy="20">so that displayed states can be traced to</tspan>
    <tspan x="628" dy="20">observed source events.</tspan>
  </text>
  <rect x="0" y="594" width="256" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="618" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">needNonInterference</tspan>
  </text>
  <rect x="256" y="594" width="360" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="268" y="618" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="268" dy="0">VisualizationEngineeringNeed,</tspan>
    <tspan x="268" dy="20">StakeholderNeedCandidate,</tspan>
    <tspan x="268" dy="20">RequirementsManagementAttributeBase</tspan>
  </text>
  <rect x="616" y="594" width="360" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="628" y="618" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="628" dy="0">Maintainers and verification engineers</tspan>
    <tspan x="628" dy="20">need assurance that visualization</tspan>
    <tspan x="628" dy="20">instrumentation cannot command or modify</tspan>
    <tspan x="628" dy="20">AEBS detection, warning, intervention, or</tspan>
    <tspan x="628" dy="20">release behavior.</tspan>
  </text>
