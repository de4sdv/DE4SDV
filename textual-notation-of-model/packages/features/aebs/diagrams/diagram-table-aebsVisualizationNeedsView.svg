<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="976" height="754" viewBox="0 0 976 754" role="img" aria-labelledby="title description">
  <title id="title">table-aebsVisualizationNeedsView</title>
  <desc id="description">table-aebsVisualizationNeedsView. Generated from SysIDE grid CSV.</desc>
  <!-- Generated from SysIDE grid CSV; SysML remains authoritative. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="0" y="0" width="976" height="54" fill="#172033"/>
  <text x="12" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">table-aebsVisualizationNeedsView</text>
  <rect x="0" y="54" width="256" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">ID</tspan>
  </text>
