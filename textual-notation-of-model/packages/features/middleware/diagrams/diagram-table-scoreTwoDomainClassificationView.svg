    <tspan x="580" dy="0">CLS-MW-004: an AAOS SDV HMI guest next to</tspan>
    <tspan x="580" dy="20">the Linux host distinguishes the two</tspan>
    <tspan x="580" dy="20">integrated members from the standalone</tspan>
    <tspan x="580" dy="20">member. Its counterpart is both integrated</tspan>
    <tspan x="580" dy="20">alternatives, AAOS Integrated and S-CORE</tspan>
    <tspan x="580" dy="20">Integrated (owner decision of 2026-11-21).</tspan>
    <tspan x="580" dy="20">Since ADR 0026 both integrated members</tspan>
    <tspan x="580" dy="20">hold the HMI display in their AAOS SDV</tspan>
    <tspan x="580" dy="20">guest. Structural consequence: per-domain</tspan>
    <tspan x="580" dy="20">platform selection.</tspan>
