<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="992" height="1154" viewBox="0 0 992 1154" role="img" aria-labelledby="title description">
  <title id="title">Middleware product-line classification</title>
  <desc id="description">Classifies middleware characteristics and attaches each rationale to its element.</desc>
  <!-- Generated from SysIDE grid CSV; SysML remains authoritative. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="0" y="0" width="992" height="54" fill="#172033"/>
  <text x="12" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Middleware product-line classification</text>
  <rect x="0" y="54" width="272" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">ID</tspan>
  </text>
  <rect x="272" y="54" width="360" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="284" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="284" dy="0">Classification</tspan>
  </text>
  <rect x="632" y="54" width="360" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="644" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="644" dy="0">Rationale</tspan>
  </text>
  <rect x="0" y="94" width="272" height="280" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">adapterLayer</tspan>
  </text>
  <rect x="272" y="94" width="360" height="280" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="284" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="284" dy="0">CommonProductLineCapability,</tspan>
    <tspan x="284" dy="20">ProductLineCharacteristic</tspan>
  </text>
  <rect x="632" y="94" width="360" height="280" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="644" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="644" dy="0">The application-middleware adapter layer</tspan>
    <tspan x="644" dy="20">is a common capability. Every</tspan>
    <tspan x="644" dy="20">(application, middleware) pair requires an</tspan>
    <tspan x="644" dy="20">adapter to translate between incompatible</tspan>
    <tspan x="644" dy="20">communication paradigms (ROS 2/DDS vs</tspan>
    <tspan x="644" dy="20">VSIDL/LoLa/SOME/IP). The adapter does not</tspan>
    <tspan x="644" dy="20">distinguish member products — it is</tspan>
    <tspan x="644" dy="20">present whenever middleware is not "none"</tspan>
    <tspan x="644" dy="20">and absent when it is. The specific</tspan>
    <tspan x="644" dy="20">adapter variant follows from the</tspan>
    <tspan x="644" dy="20">(application, middleware) feature pair —</tspan>
    <tspan x="644" dy="20">see the adapter variation in</tspan>
    <tspan x="644" dy="20">DE4SDV_SDVPlatformStack.</tspan>
  </text>
  <rect x="0" y="374" width="272" height="140" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="398" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">signalAccessCapability</tspan>
  </text>
  <rect x="272" y="374" width="360" height="140" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="284" y="398" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="284" dy="0">CommonProductLineCapability,</tspan>
    <tspan x="284" dy="20">ProductLineCharacteristic</tspan>
  </text>
  <rect x="632" y="374" width="360" height="140" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="644" y="398" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="644" dy="0">The capability to exchange vehicle signals</tspan>
    <tspan x="644" dy="20">through the middleware is a common</tspan>
    <tspan x="644" dy="20">capability. It is required whenever an</tspan>
    <tspan x="644" dy="20">ADAS application and a vehicle-level</tspan>
    <tspan x="644" dy="20">middleware are both selected. Does not</tspan>
    <tspan x="644" dy="20">distinguish member products.</tspan>
  </text>
  <rect x="0" y="514" width="272" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="538" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">lifecycleCoordinationCapability</tspan>
  </text>
  <rect x="272" y="514" width="360" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="284" y="538" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="284" dy="0">CommonProductLineCapability,</tspan>
    <tspan x="284" dy="20">ProductLineCharacteristic</tspan>
  </text>
  <rect x="632" y="514" width="360" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="644" y="538" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="644" dy="0">Lifecycle coordination (startup, shutdown,</tspan>
    <tspan x="644" dy="20">suspend, resume) through the middleware is</tspan>
    <tspan x="644" dy="20">a common capability. Required for all</tspan>
    <tspan x="644" dy="20">middleware-integrated products. Does not</tspan>
    <tspan x="644" dy="20">distinguish member products.</tspan>
  </text>
  <rect x="0" y="634" width="272" height="100" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="658" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">healthMonitoringCapability</tspan>
  </text>
  <rect x="272" y="634" width="360" height="100" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="284" y="658" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="284" dy="0">CommonProductLineCapability,</tspan>
    <tspan x="284" dy="20">ProductLineCharacteristic</tspan>
  </text>
  <rect x="632" y="634" width="360" height="100" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="644" y="658" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="644" dy="0">Health monitoring and fault detection</tspan>
    <tspan x="644" dy="20">through the middleware is a common</tspan>
    <tspan x="644" dy="20">capability. Required for all middleware-</tspan>
    <tspan x="644" dy="20">integrated products.</tspan>
  </text>
  <rect x="0" y="734" width="272" height="80" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="758" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">diagnosticAccessCapability</tspan>
  </text>
  <rect x="272" y="734" width="360" height="80" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="284" y="758" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="284" dy="0">CommonProductLineCapability,</tspan>
    <tspan x="284" dy="20">ProductLineCharacteristic</tspan>
  </text>
  <rect x="632" y="734" width="360" height="80" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="644" y="758" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="644" dy="0">Authenticated diagnostic access through</tspan>
    <tspan x="644" dy="20">the middleware is a common capability.</tspan>
    <tspan x="644" dy="20">Does not distinguish member products.</tspan>
  </text>
  <rect x="0" y="814" width="272" height="80" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="838" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">updateCoordinationCapability</tspan>
  </text>
  <rect x="272" y="814" width="360" height="80" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="284" y="838" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="284" dy="0">CommonProductLineCapability,</tspan>
    <tspan x="284" dy="20">ProductLineCharacteristic</tspan>
  </text>
  <rect x="632" y="814" width="360" height="80" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="644" y="838" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="644" dy="0">OTA software update coordination through</tspan>
    <tspan x="644" dy="20">the middleware is a common capability.</tspan>
    <tspan x="644" dy="20">Does not distinguish member products.</tspan>
  </text>
  <rect x="0" y="894" width="272" height="140" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="918" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">safetyPathDecision</tspan>
  </text>
  <rect x="272" y="894" width="360" height="140" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="284" y="918" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="284" dy="0">DeferredProductLineScope,</tspan>
    <tspan x="284" dy="20">ProductLineCharacteristic</tspan>
  </text>
  <rect x="632" y="894" width="360" height="140" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="644" y="918" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="644" dy="0">The decision about which emergency</tspan>
    <tspan x="644" dy="20">intervention path to realize (through</tspan>
    <tspan x="644" dy="20">safety-certified middleware partition vs</tspan>
    <tspan x="644" dy="20">direct vehicle-command gate) is deferred</tspan>
    <tspan x="644" dy="20">to INC-MW-004 (needs) and INC-MW-005</tspan>
    <tspan x="644" dy="20">(requirements).</tspan>
  </text>
  <rect x="0" y="1034" width="272" height="120" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="1058" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">securityTrustBoundary</tspan>
  </text>
  <rect x="272" y="1034" width="360" height="120" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="284" y="1058" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="284" dy="0">DeferredProductLineScope,</tspan>
    <tspan x="284" dy="20">ProductLineCharacteristic</tspan>
  </text>
  <rect x="632" y="1034" width="360" height="120" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="644" y="1058" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="644" dy="0">The security and trust boundary for</tspan>
    <tspan x="644" dy="20">middleware communication (DICE identity,</tspan>
    <tspan x="644" dy="20">attestation, VLAN segmentation) is not yet</tspan>
    <tspan x="644" dy="20">classified. Deferred to a security-focused</tspan>
    <tspan x="644" dy="20">increment or INC-MW-005.</tspan>
  </text>
</svg>
