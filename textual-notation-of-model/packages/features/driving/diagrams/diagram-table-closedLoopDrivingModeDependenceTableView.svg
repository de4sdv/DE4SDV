<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="470" height="534" viewBox="0 0 470 534" role="img" aria-labelledby="title description">
  <title id="title">Closed-loop driving system modes</title>
  <desc id="description">The modes of the driving system and the functions whose behavior differs in each.</desc>
  <!-- Generated from SysIDE grid CSV; SysML remains authoritative. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="0" y="0" width="470" height="54" fill="#172033"/>
  <text x="12" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Closed-loop driving system modes</text>
  <rect x="0" y="54" width="110" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">Mode</tspan>
  </text>
  <rect x="110" y="54" width="360" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="122" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="122" dy="0">DependentFunctions</tspan>
  </text>
  <rect x="0" y="94" width="110" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">priming</tspan>
  </text>
  <rect x="110" y="94" width="360" height="120" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="122" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="122" dy="0">Both histories are incomplete:</tspan>
    <tspan x="122" dy="20">CommandVehicle holds the vehicle at</tspan>
    <tspan x="122" dy="20">standstill while plans are produced, and</tspan>
    <tspan x="122" dy="20">PublishOperationalState publishes the</tspan>
    <tspan x="122" dy="20">mode.</tspan>
  </text>
  <rect x="0" y="214" width="110" height="140" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="238" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">driving</tspan>
  </text>
  <rect x="110" y="214" width="360" height="140" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="122" y="238" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="122" dy="0">Both histories are complete and no</tspan>
    <tspan x="122" dy="20">detection has stopped the loop:</tspan>
    <tspan x="122" dy="20">CommandVehicle commands from the newest</tspan>
    <tspan x="122" dy="20">valid plan, and PublishOperationalState</tspan>
    <tspan x="122" dy="20">publishes the plan, the vehicle state and</tspan>
    <tspan x="122" dy="20">the health.</tspan>
  </text>
  <rect x="0" y="354" width="110" height="180" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="378" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">stopped</tspan>
  </text>
  <rect x="110" y="354" width="360" height="180" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="122" y="378" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="122" dy="0">The stop response, from the first</tspan>
    <tspan x="122" dy="20">detection of SuperviseDrivingLoop:</tspan>
    <tspan x="122" dy="20">CommandVehicle computes the stop response,</tspan>
    <tspan x="122" dy="20">deceleration to standstill with the</tspan>
    <tspan x="122" dy="20">steering held, then standstill, and</tspan>
    <tspan x="122" dy="20">PublishOperationalState publishes the stop</tspan>
    <tspan x="122" dy="20">with its cause. There is no transition</tspan>
    <tspan x="122" dy="20">out.</tspan>
  </text>
</svg>
