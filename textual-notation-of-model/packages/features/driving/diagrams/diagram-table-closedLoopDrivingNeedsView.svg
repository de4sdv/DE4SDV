  <rect x="0" y="94" width="152" height="200" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">NEED-DRIVING-001</tspan>
  </text>
  <rect x="152" y="94" width="360" height="200" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="164" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="164" dy="0">needCheckpointPlansMoveTheVehicle</tspan>
  </text>
  <rect x="512" y="94" width="360" height="200" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="524" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="524" dy="0">Systems engineers, verification engineers</tspan>
    <tspan x="524" dy="20">and open-source reviewers need the</tspan>
    <tspan x="524" dy="20">steering and acceleration of the vehicle</tspan>
    <tspan x="524" dy="20">to follow the plans that the pinned</tspan>
    <tspan x="524" dy="20">AutoE2E checkpoint makes from the</tspan>
    <tspan x="524" dy="20">vehicle's live camera images and motion,</tspan>
    <tspan x="524" dy="20">with no autopilot, replayed history,</tspan>
    <tspan x="524" dy="20">prediction overlay or other command source</tspan>
    <tspan x="524" dy="20">acting in their place.</tspan>
  </text>
  <rect x="872" y="94" width="360" height="200" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="884" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="884" dy="0">INC-DRIVING-001</tspan>
    <tspan x="884" dy="20">checkpointCommandAuthorityConcern, scope</tspan>
    <tspan x="884" dy="20">item learnedDrivingInScope, assumption</tspan>
    <tspan x="884" dy="20">asmSourceAuthenticity, scenario SC-</tspan>
    <tspan x="884" dy="20">DRIVING-001</tspan>
  </text>
  <rect x="0" y="294" width="152" height="360" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="318" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">NEED-DRIVING-002</tspan>
  </text>
  <rect x="152" y="294" width="360" height="360" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="164" y="318" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="164" dy="0">needCheckpointInputsAsTrained</tspan>
  </text>
  <rect x="512" y="294" width="360" height="360" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="524" y="318" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="524" dy="0">Systems engineers and verification</tspan>
    <tspan x="524" dy="20">engineers need the pinned AutoE2E</tspan>
    <tspan x="524" dy="20">checkpoint to plan from inputs in the form</tspan>
    <tspan x="524" dy="20">its runtime contract fixes: the camera</tspan>
    <tspan x="524" dy="20">images with the calibration of the cameras</tspan>
    <tspan x="524" dy="20">that took them, the ego-motion history of</tspan>
    <tspan x="524" dy="20">the vehicle, and the map around the</tspan>
    <tspan x="524" dy="20">vehicle with the route to its destination,</tspan>
    <tspan x="524" dy="20">aligned in time with one another.</tspan>
  </text>
  <rect x="872" y="294" width="360" height="360" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="884" y="318" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="884" dy="0">INC-DRIVING-001</tspan>
    <tspan x="884" dy="20">checkpointCommandAuthorityConcern,</tspan>
    <tspan x="884" dy="20">assumption asmSourceAuthenticity (the</tspan>
    <tspan x="884" dy="20">pinned checkpoint and its compatible input</tspan>
    <tspan x="884" dy="20">geometry and history), gap</tspan>
    <tspan x="884" dy="20">gapModelInputAndFeedback, scenario SC-</tspan>
    <tspan x="884" dy="20">DRIVING-001; the runtime contract of</tspan>
    <tspan x="884" dy="20">AutoE2E at cb50764b (Model/README.md:</tspan>
    <tspan x="884" dy="20">surround camera images with a projection</tspan>
    <tspan x="884" dy="20">operator that carries their calibration, a</tspan>
    <tspan x="884" dy="20">semantic map raster with the route</tspan>
    <tspan x="884" dy="20">corridor and destination, and an ego-</tspan>
    <tspan x="884" dy="20">motion history of speed, acceleration, yaw</tspan>
    <tspan x="884" dy="20">rate and curvature; egomotion.py in</tspan>
    <tspan x="884" dy="20">Model/data_parsing: 64 history samples at</tspan>
    <tspan x="884" dy="20">10 Hz); owner review of 2026-11-02 (ego</tspan>
    <tspan x="884" dy="20">motion)</tspan>
  </text>
  <rect x="0" y="654" width="152" height="160" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="678" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">NEED-DRIVING-003</tspan>
  </text>
  <rect x="152" y="654" width="360" height="160" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="164" y="678" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="164" dy="0">needPlansAndCommandsThroughSCORE</tspan>
  </text>
  <rect x="512" y="654" width="360" height="160" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="524" y="678" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="524" dy="0">System architects, software developers and</tspan>
    <tspan x="524" dy="20">maintainers need the plans and commands of</tspan>
    <tspan x="524" dy="20">the driving system to pass between</tspan>
    <tspan x="524" dy="20">planning and the vehicle's actuation</tspan>
    <tspan x="524" dy="20">through Eclipse S-CORE communication, with</tspan>
    <tspan x="524" dy="20">no exchange on that path that goes around</tspan>
    <tspan x="524" dy="20">it.</tspan>
  </text>
  <rect x="872" y="654" width="360" height="160" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="884" y="678" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="884" dy="0">INC-DRIVING-001 scoreCommandPathConcern,</tspan>
    <tspan x="884" dy="20">scope item</tspan>
    <tspan x="884" dy="20">integrationAndObservationInScope (S-CORE</tspan>
    <tspan x="884" dy="20">part), gap gapTransportAndControl,</tspan>
    <tspan x="884" dy="20">assumption asmCandidateReuse, scenario SC-</tspan>
    <tspan x="884" dy="20">DRIVING-001</tspan>
  </text>
  <rect x="0" y="814" width="152" height="180" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="838" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">NEED-DRIVING-004</tspan>
  </text>
  <rect x="152" y="814" width="360" height="180" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="164" y="838" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="164" dy="0">needLiveStateForAAOS</tspan>
  </text>
  <rect x="512" y="814" width="360" height="180" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="524" y="838" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="524" dy="0">Verification engineers and open-source</tspan>
    <tspan x="524" dy="20">reviewers need the driving system to</tspan>
    <tspan x="524" dy="20">publish its plan, the vehicle state and</tspan>
    <tspan x="524" dy="20">its health as it produces them in the</tspan>
    <tspan x="524" dy="20">running loop, each with its producer and</tspan>
    <tspan x="524" dy="20">its time, so that what AAOS SDV presents</tspan>
    <tspan x="524" dy="20">is this run and a stale, mocked or</tspan>
    <tspan x="524" dy="20">replayed state cannot pass for it.</tspan>
  </text>
  <rect x="872" y="814" width="360" height="180" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="884" y="838" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="884" dy="0">INC-DRIVING-001</tspan>
    <tspan x="884" dy="20">aaosObservationFidelityConcern, scope item</tspan>
    <tspan x="884" dy="20">integrationAndObservationInScope (AAOS</tspan>
    <tspan x="884" dy="20">part), gap gapTransportAndControl,</tspan>
    <tspan x="884" dy="20">scenario SC-DRIVING-002; owner decision</tspan>
    <tspan x="884" dy="20">2026-11-02 (AAOS SDV is a context role)</tspan>
  </text>
  <rect x="0" y="994" width="152" height="180" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="1018" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">NEED-DRIVING-005</tspan>
  </text>
  <rect x="152" y="994" width="360" height="180" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="164" y="1018" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="164" dy="0">needLoopIndependentOfAAOS</tspan>
  </text>
  <rect x="512" y="994" width="360" height="180" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="524" y="1018" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="524" dy="0">Verification engineers and open-source</tspan>
    <tspan x="524" dy="20">reviewers need the driving system to go on</tspan>
    <tspan x="524" dy="20">planning and commanding the vehicle</tspan>
    <tspan x="524" dy="20">unchanged, without its degraded-input</tspan>
    <tspan x="524" dy="20">response, when AAOS SDV, its application</tspan>
    <tspan x="524" dy="20">or the path to it is down or late.</tspan>
  </text>
  <rect x="872" y="994" width="360" height="180" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="884" y="1018" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="884" dy="0">INC-DRIVING-001</tspan>
    <tspan x="884" dy="20">aaosObservationFidelityConcern (AAOS SDV</tspan>
    <tspan x="884" dy="20">typed as a context role), gap</tspan>
    <tspan x="884" dy="20">gapTransportAndControl (the display is not</tspan>
    <tspan x="884" dy="20">in the fast control loop), scenario SC-</tspan>
    <tspan x="884" dy="20">DRIVING-004; owner decision 2026-11-02</tspan>
    <tspan x="884" dy="20">(removing AAOS SDV leaves the plan-to-</tspan>
    <tspan x="884" dy="20">command chain unchanged)</tspan>
  </text>
  <rect x="0" y="1174" width="152" height="180" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="1198" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">NEED-DRIVING-006</tspan>
  </text>
  <rect x="152" y="1174" width="360" height="180" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="164" y="1198" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="164" dy="0">needDefinedResponseToDegradedInputOrPlan</tspan>
  </text>
  <rect x="512" y="1174" width="360" height="180" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="524" y="1198" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="524" dy="0">Safety experts and system architects need</tspan>
    <tspan x="524" dy="20">the driving system, when the camera images</tspan>
    <tspan x="524" dy="20">or the motion of the vehicle become</tspan>
    <tspan x="524" dy="20">invalid, lost or stale, or a plan becomes</tspan>
    <tspan x="524" dy="20">invalid, late, lost or stale, to give the</tspan>
    <tspan x="524" dy="20">vehicle a defined stop or disable response</tspan>
    <tspan x="524" dy="20">instead of acting on the last plan, and to</tspan>
    <tspan x="524" dy="20">publish that it is degraded.</tspan>
  </text>
  <rect x="872" y="1174" width="360" height="180" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="884" y="1198" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="884" dy="0">INC-DRIVING-001</tspan>
    <tspan x="884" dy="20">degradedInputBehaviorConcern, scope item</tspan>
    <tspan x="884" dy="20">feedbackAndTimingInScope (behavior part),</tspan>
    <tspan x="884" dy="20">gap gapTransportAndControl, scenario SC-</tspan>
    <tspan x="884" dy="20">DRIVING-003</tspan>
  </text>
  <rect x="0" y="1354" width="152" height="200" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="1378" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">NEED-DRIVING-007</tspan>
  </text>
  <rect x="152" y="1354" width="360" height="200" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="164" y="1378" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="164" dy="0">needTimesMeasurableInTheirOwnDomain</tspan>
  </text>
  <rect x="512" y="1354" width="360" height="200" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="524" y="1378" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="524" dy="0">Verification engineers and systems</tspan>
    <tspan x="524" dy="20">engineers need the driving system to carry</tspan>
    <tspan x="524" dy="20">the time of each camera image, motion</tspan>
    <tspan x="524" dy="20">sample, plan and command with it, so that</tspan>
    <tspan x="524" dy="20">the age of an input at actuation, the</tspan>
    <tspan x="524" dy="20">planning cadence and the transport delay</tspan>
    <tspan x="524" dy="20">can each be measured in its own time</tspan>
    <tspan x="524" dy="20">domain and simulation time is never read</tspan>
    <tspan x="524" dy="20">as wall-clock time.</tspan>
  </text>
  <rect x="872" y="1354" width="360" height="200" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="884" y="1378" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="884" dy="0">INC-DRIVING-001 timeDomainHonestyConcern,</tspan>
    <tspan x="884" dy="20">scope item feedbackAndTimingInScope</tspan>
    <tspan x="884" dy="20">(timing part), gap</tspan>
    <tspan x="884" dy="20">gapClosedLoopPerformance</tspan>
  </text>
  <rect x="0" y="1554" width="152" height="160" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="1578" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">NEED-DRIVING-008</tspan>
  </text>
  <rect x="152" y="1554" width="360" height="160" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="164" y="1578" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="164" dy="0">needRunsIdentifyCheckpointAndConfiguration</tspan>
  </text>
  <rect x="512" y="1554" width="360" height="160" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="524" y="1578" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="524" dy="0">Verification engineers, maintainers and</tspan>
    <tspan x="524" dy="20">open-source reviewers need each run of the</tspan>
    <tspan x="524" dy="20">driving system to identify the checkpoint</tspan>
    <tspan x="524" dy="20">and the configuration it ran with, so that</tspan>
    <tspan x="524" dy="20">another engineer can rerun it and an</tspan>
    <tspan x="524" dy="20">undisclosed checkpoint swap shows.</tspan>
  </text>
  <rect x="872" y="1554" width="360" height="160" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="884" y="1578" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="884" dy="0">INC-DRIVING-001</tspan>
    <tspan x="884" dy="20">reproducibleClosedLoopEvidenceConcern,</tspan>
    <tspan x="884" dy="20">scope item closedLoopEvidenceInScope, out-</tspan>
    <tspan x="884" dy="20">of-scope item modelTrainingOutOfScope (no</tspan>
    <tspan x="884" dy="20">undisclosed checkpoint swap), gap</tspan>
    <tspan x="884" dy="20">gapAdoptionAndRights (source, checkpoint</tspan>
    <tspan x="884" dy="20">and configuration pinned separately)</tspan>
  </text>
</svg>
