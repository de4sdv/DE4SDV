  <rect x="0" y="0" width="896" height="54" fill="#172033"/>
  <text x="12" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">table-closedLoopDrivingClassificationView</text>
  <rect x="0" y="54" width="176" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">ID</tspan>
  </text>
  <rect x="176" y="54" width="360" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="188" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="188" dy="0">Classification</tspan>
  </text>
  <rect x="536" y="54" width="360" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="548" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="548" dy="0">Rationale</tspan>
  </text>
  <rect x="0" y="94" width="176" height="340" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">autoE2EDrivingStack</tspan>
  </text>
  <rect x="176" y="94" width="360" height="340" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="188" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="188" dy="0">ProductLineFeatureCandidate,</tspan>
    <tspan x="188" dy="20">ProductLineCharacteristic</tspan>
  </text>
  <rect x="536" y="94" width="360" height="340" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="548" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="548" dy="0">AutoE2E as the vehicle application</tspan>
    <tspan x="548" dy="20">distinguishes the driving member from the</tspan>
    <tspan x="548" dy="20">Autoware members. It plans from camera</tspan>
    <tspan x="548" dy="20">images and its ego-motion history (speed,</tspan>
    <tspan x="548" dy="20">acceleration, yaw rate and curvature) and</tspan>
    <tspan x="548" dy="20">takes no LiDAR input. So phase 9 adds it</tspan>
    <tspan x="548" dy="20">to the feature model with a constraint</tspan>
    <tspan x="548" dy="20">that it requires the camera feature, and</tspan>
    <tspan x="548" dy="20">leaves LiDAR selectable (owner decision of</tspan>
    <tspan x="548" dy="20">2026-11-02). Ego motion needs no</tspan>
    <tspan x="548" dy="20">constraint: it comes from the motion</tspan>
    <tspan x="548" dy="20">sensors, which are common content of every</tspan>
    <tspan x="548" dy="20">member and have no feature. Phase 9 also</tspan>
    <tspan x="548" dy="20">derives its middleware adapter, which</tspan>
    <tspan x="548" dy="20">phase 8 realizes first. Acceptance waits</tspan>
    <tspan x="548" dy="20">for the member decision.</tspan>
  </text>
</svg>
