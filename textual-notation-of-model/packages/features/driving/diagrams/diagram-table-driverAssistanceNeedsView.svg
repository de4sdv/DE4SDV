  <text x="492" y="718" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="492" dy="0">Verification engineers and product-line</tspan>
    <tspan x="492" dy="20">engineers need each run of the driver-</tspan>
    <tspan x="492" dy="20">assistance system to identify the</tspan>
    <tspan x="492" dy="20">candidate revision and the configuration</tspan>
    <tspan x="492" dy="20">it ran with, so that each verdict is bound</tspan>
    <tspan x="492" dy="20">to what ran.</tspan>
  </text>
  <rect x="840" y="694" width="360" height="140" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="852" y="718" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
