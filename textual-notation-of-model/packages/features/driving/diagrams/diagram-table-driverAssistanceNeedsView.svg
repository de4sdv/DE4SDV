  <text x="164" y="418" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="164" dy="0">needNoReactionWithoutImminentCollision</tspan>
  </text>
  <rect x="480" y="394" width="360" height="160" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="492" y="418" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="492" dy="0">Vehicle occupants and road users need the</tspan>
    <tspan x="492" dy="20">driver-assistance system to request no</tspan>
    <tspan x="492" dy="20">collision warning and to command no</tspan>
    <tspan x="492" dy="20">emergency braking when no collision with a</tspan>
    <tspan x="492" dy="20">vehicle ahead is imminent, as when a</tspan>
    <tspan x="492" dy="20">stationary vehicle stands beyond a curve</tspan>
    <tspan x="492" dy="20">or a vehicle ahead turns off.</tspan>
  </text>
  <rect x="840" y="394" width="360" height="160" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="852" y="418" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="852" dy="0">INC-DRIVING-002</tspan>
    <tspan x="852" dy="20">vehicleTargetResponseConcern,</tspan>
    <tspan x="852" dy="20">vehicleTargetCriteriaConcern, scope item</tspan>
    <tspan x="852" dy="20">noReactionInScope, gap</tspan>
    <tspan x="852" dy="20">gapVehicleTargetCriteria, scenarios SC-</tspan>
    <tspan x="852" dy="20">DRIVING-014 and SC-DRIVING-015</tspan>
  </text>
  <rect x="0" y="554" width="152" height="140" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="578" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">NEED-DRIVING-010</tspan>
  </text>
  <rect x="152" y="554" width="328" height="140" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="164" y="578" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="164" dy="0">needWarningRequestForTheDriver</tspan>
  </text>
  <rect x="480" y="554" width="360" height="140" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="492" y="578" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="492" dy="0">Vehicle occupants need the driver-</tspan>
    <tspan x="492" dy="20">assistance system to give a warning</tspan>
    <tspan x="492" dy="20">request at its boundary when a collision</tspan>
    <tspan x="492" dy="20">with a vehicle ahead in its lane is</tspan>
    <tspan x="492" dy="20">imminent, so that the AAOS SDV warns the</tspan>
    <tspan x="492" dy="20">driver on its display and as a sound.</tspan>
  </text>
  <rect x="840" y="554" width="360" height="140" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="852" y="578" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="852" dy="0">INC-DRIVING-002</tspan>
    <tspan x="852" dy="20">driverWarningSequenceConcern, scope item</tspan>
    <tspan x="852" dy="20">driverWarningInScope, gap</tspan>
    <tspan x="852" dy="20">gapWarningOutput, scenarios SC-DRIVING-012</tspan>
    <tspan x="852" dy="20">and SC-DRIVING-013</tspan>
  </text>
  <rect x="0" y="694" width="152" height="140" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="718" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">NEED-DRIVING-011</tspan>
