  <text x="852" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="852" dy="0">INC-DRIVING-002</tspan>
    <tspan x="852" dy="20">vehicleTargetResponseConcern,</tspan>
    <tspan x="852" dy="20">emergencyBrakingIndependenceConcern,</tspan>
    <tspan x="852" dy="20">scoreCommandAndWarningPathConcern,</tspan>
    <tspan x="852" dy="20">vehicleTargetCriteriaConcern, scope items</tspan>
    <tspan x="852" dy="20">vehicleTargetResponseInScope,</tspan>
    <tspan x="852" dy="20">scoreCommandPathInScope and</tspan>
    <tspan x="852" dy="20">vehicleTargetCriteriaInScope, gaps</tspan>
    <tspan x="852" dy="20">gapNoSeparateEmergencyFunction,</tspan>
    <tspan x="852" dy="20">gapScoreIntegration,</tspan>
    <tspan x="852" dy="20">gapVehicleTargetCriteria and</tspan>
    <tspan x="852" dy="20">gapCameraImageAndGeometry, assumption</tspan>
    <tspan x="852" dy="20">asmBenchReuse, scenarios SC-DRIVING-012</tspan>
    <tspan x="852" dy="20">and SC-DRIVING-013</tspan>
  </text>
  <rect x="0" y="394" width="152" height="160" fill="#f6f8fb" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="418" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
