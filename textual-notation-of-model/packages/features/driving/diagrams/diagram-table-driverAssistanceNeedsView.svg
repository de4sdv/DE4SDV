  <text x="164" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="164" dy="0">needWarnAndBrakeForVehicleAhead</tspan>
  </text>
  <rect x="480" y="94" width="360" height="300" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="492" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="492" dy="0">Vehicle occupants and road users need the</tspan>
    <tspan x="492" dy="20">driver-assistance system to request the</tspan>
    <tspan x="492" dy="20">collision warning and to command the</tspan>
    <tspan x="492" dy="20">braking of the vehicle when a collision</tspan>
    <tspan x="492" dy="20">with a stationary or a slower moving</tspan>
    <tspan x="492" dy="20">vehicle ahead in its lane is imminent.</tspan>
  </text>
