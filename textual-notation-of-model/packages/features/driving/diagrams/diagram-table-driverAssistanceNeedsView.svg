    <tspan x="852" dy="20">scope item verdictEvidenceInScope, gap</tspan>
    <tspan x="852" dy="20">gapCandidateBehaviorUnverified, scenarios</tspan>
    <tspan x="852" dy="20">SC-DRIVING-012 to SC-DRIVING-015</tspan>
