    <tspan x="12" dy="0">ID</tspan>
  </text>
  <rect x="208" y="54" width="360" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="220" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="220" dy="0">Classification</tspan>
  </text>
  <rect x="568" y="54" width="360" height="40" fill="#e8eef8" stroke="#9aa7b8" stroke-width="1"/>
  <text x="580" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="580" dy="0">Rationale</tspan>
  </text>
  <rect x="0" y="94" width="208" height="500" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="12" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="start">
    <tspan x="12" dy="0">visionPilotDrivingStack</tspan>
  </text>
  <rect x="208" y="94" width="360" height="500" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="220" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="220" dy="0">ProductLineFeatureCandidate,</tspan>
    <tspan x="220" dy="20">ProductLineCharacteristic</tspan>
  </text>
  <rect x="568" y="94" width="360" height="500" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/>
  <text x="580" y="118" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033" text-anchor="start">
    <tspan x="580" dy="0">VisionPilot as the vehicle application</tspan>
    <tspan x="580" dy="20">distinguishes a camera-only driver-</tspan>
    <tspan x="580" dy="20">assistance member from the Autoware</tspan>
    <tspan x="580" dy="20">members and from the AutoE2E candidate. At</tspan>
    <tspan x="580" dy="20">the pinned revision it reads one front-</tspan>
    <tspan x="580" dy="20">camera image and the vehicle speed, and</tspan>
    <tspan x="580" dy="20">writes steering and acceleration. It</tspan>
    <tspan x="580" dy="20">requires the camera, so phase 9 adds a</tspan>
    <tspan x="580" dy="20">requiresFeatures constraint and leaves</tspan>
    <tspan x="580" dy="20">LiDAR and radar selectable. It requires</tspan>
    <tspan x="580" dy="20">Linux on the main side: its live camera</tspan>
    <tspan x="580" dy="20">source uses V4L2, a Linux interface. ROS 2</tspan>
    <tspan x="580" dy="20">is a build option, which its upstream</tspan>
    <tspan x="580" dy="20">simulator path uses. Phase 9 adds the</tspan>
    <tspan x="580" dy="20">Linux constraint as well. It needs a</tspan>
    <tspan x="580" dy="20">middleware adapter to Eclipse S-CORE,</tspan>
    <tspan x="580" dy="20">which phase 8 realizes first and phase 9</tspan>
    <tspan x="580" dy="20">derives. It also runs a speed-following</tspan>
    <tspan x="580" dy="20">and a lane-keeping function, which no case</tspan>
    <tspan x="580" dy="20">of this increment judges. Phase 9 decides</tspan>
    <tspan x="580" dy="20">whether the configuration selects them. It</tspan>
    <tspan x="580" dy="20">raises lane-departure warnings as well,</tspan>
    <tspan x="580" dy="20">which no case judges either. Acceptance</tspan>
    <tspan x="580" dy="20">waits for the member decision.</tspan>
  </text>
</svg>
