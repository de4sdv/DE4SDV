<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">DE4SDV System Context</title>
  <desc id="desc">Bootstrap placeholder for a SysML v2 repository-rendered system context view.</desc>
  <rect width="960" height="420" fill="#0f172a"/>
  <text x="480" y="42" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">DE4SDV System Context</text>
  <text x="480" y="72" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14">Pilot placeholder — generated view will come from SysML v2 repository + SysON/export pipeline</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="52" y="145" width="240" height="125" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="172" y="188" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">System 1</text>
    <text x="172" y="220" text-anchor="middle" fill="#cbd5e1" font-size="15">Configurable SDV</text>
    <text x="172" y="242" text-anchor="middle" fill="#cbd5e1" font-size="15">product line + variants</text>
    <rect x="360" y="125" width="240" height="165" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="480" y="178" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">System 2</text>
    <text x="480" y="210" text-anchor="middle" fill="#cbd5e1" font-size="15">DE4SDV life-cycle</text>
    <text x="480" y="232" text-anchor="middle" fill="#cbd5e1" font-size="15">engineering + assurance</text>
    <rect x="668" y="145" width="240" height="125" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="788" y="188" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">System 3</text>
    <text x="788" y="220" text-anchor="middle" fill="#cbd5e1" font-size="15">Open innovation</text>
    <text x="788" y="242" text-anchor="middle" fill="#cbd5e1" font-size="15">ecosystem</text>
    <path d="M360 205 L292 205" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="326" y="194" text-anchor="middle" fill="#cbd5e1" font-size="13">manages</text>
    <path d="M600 205 L668 205" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="634" y="194" text-anchor="middle" fill="#cbd5e1" font-size="13">evolves</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e2e8f0"/>
    </marker>
  </defs>
</svg>
