syntax = "proto3";

package de4sdv.reference.vehicle_speed;

// DE4SDV-owned reference payload. This is not an OEM vehicle contract.
message VehicleSpeed {
  // VSS Vehicle.Speed, expressed in km/h.
  double speed_kmh = 1;
  // Unix epoch nanoseconds from the AAOS system clock.
  uint64 timestamp_ns = 2;
  Quality quality = 3;

  enum Quality {
    QUALITY_UNSPECIFIED = 0;
    VALID = 1;
    STALE = 2;
    INVALID = 3;
  }
}
