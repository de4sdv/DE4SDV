    instance: de4sdv-aaos-build
    guest: sdv_core_cf Cuttlefish (instance1)
    provider: DE4SDV_VEHICLE_SPEED_PUBLISHED speed_kmh=36 (1 Hz)
    observer: DE4SDV_VEHICLE_SPEED_OBSERVED (same timestamp_ns)
    egress: Vehicle.Speed TCP egress connected endpoint=10.250.0.3:4711
  vmB:
    instance: de4sdv-ros2-autoware
    bridge: vehicle_speed_tcp_bridge (100+ VelocityReport publishes)
    autoware: autowarefoundation/autoware humble source build
    consumer_node: autoware_vehicle_velocity_converter
    input_topic: /vehicle/status/velocity_status (autoware_vehicle_msgs/msg/VelocityReport)
    output_topic: /vehicle/status/twist_with_covariance (geometry_msgs/msg/TwistWithCovarianceStamped)
    output_value: "linear.x = 10.0 m/s, covariance[0] = 0.04 (velocity_stddev_xx=0.2)"
    output_rate: "~2 Hz (matches provider publication)"
    discovery: ROS_LOCALHOST_ONLY=1 on bridge and converter (same-host DDS)
toolchain:
