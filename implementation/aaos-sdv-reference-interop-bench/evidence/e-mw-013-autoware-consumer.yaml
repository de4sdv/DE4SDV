claim:
  statement: >-
    A real Autoware node (autoware_vehicle_velocity_converter, built from
    autowarefoundation/autoware humble source) subscribes to the
    /vehicle/status/velocity_status topic published by the DE4SDV adapter
    chain and converts it into /vehicle/status/twist_with_covariance with
    linear.x = 10.0 m/s, providing Autoware-side consumption provenance for
    the AAOS SDV -> VSIDL -> TCP egress -> bridge -> ROS 2 chain.
  system_1_subject: "Configured Autoware + AndroidSDV member (MW-CONFIG-001)"
  system_2_enabler: "Google Cloud de4sdv-aaos-build + de4sdv-ros2-autoware two-VM deployment"
  evidence_boundary: >-
    Autoware-side consumption of the published VelocityReport by the real
    autoware_vehicle_velocity_converter node. Not full Autoware stack
    (perception/planning/control), not production deployment, not safety.
hosts:
