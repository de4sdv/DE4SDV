  statement: >-
    The pinned AAOS SDV target was built successfully and launched as a
    Cuttlefish guest on an x86_64 Linux host with nested KVM. The guest reached
    Android boot completion, exposed the expected storage link and enforcing
    SELinux state, and was reachable through an explicitly recorded TCP ADB
    fallback transport.
