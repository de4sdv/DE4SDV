  - the default Cuttlefish vsock ADB path for this target
  - a complete Android framework or Car Service runtime
  - VSIDL provider deployment or generated vehicle-service bindings
  - adapter deployment, transport/QoS behavior, ROS 2 graph connectivity, or Autoware integration
  - vehicle-level runtime interoperability, safety evidence, certification, homologation, or type approval
