# Bill-of-Features: AEBS visualization test article
#
# NOT a product Bill-of-Features. This file records the planned execution
# configuration of the INC-AEBS-010 System 2 test article. The product-level
# feature selections are inherited unchanged from the accepted
# mw-autoware-aaos-sdv-reference.yaml BoF; no feature selection is added or
# modified, and the visualization is not a product feature.

name: AEBSAutowareAAOSSDVVisualizationTestArticle
description: >
  Instrumented specialization of the accepted MWAutowareAAOSSDVReference
  member for the INC-AEBS-010 AEBS visualization chain. The member's
  platform stack and capability selections are inherited unchanged; this
  configuration adds only System 2 visualization instrumentation. It proves
  no runtime interoperability, preflight outcome, rendering behavior, or
  requirement satisfaction.

evidence:
  status: planned
  artifacts: []

# Product selections are inherited from the accepted reference member BoF
# (reused by qualified reference in SysML). Reproduced here for execution
# reproducibility only; the authoritative source remains the reference file.
inherits_product_configuration:
  source: model-based-product-line-engineering/feature-configurations/mw-autoware-aaos-sdv-reference.yaml
  reused_unchanged: true

system2_instrumentation:
  visualization_chain:
    architecture_slice: INC-AEBS-010 Phase 8
    sysml_owner: >-
      textual-notation-of-model/packages/features/aebs/
      aebs_010_visualization_physical_realization.sysml
    notes:
      - Read-only ROS 2 source adapter over the 009B bench.
      - New bounded transport; the INC-MW-010 port is not reused.
      - sdv_ivi_cf AAOS guest with SDV Gateway ingress, Data Tunnel, and a
        Java center-display application.

