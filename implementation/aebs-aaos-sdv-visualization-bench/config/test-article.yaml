    name: autoware_source_revision
    value: f603d8759c92fb2f423f1544844e13086d79ad09
    pinned_at: architecture_slice
  - id: AO-AEBS-010-004
    name: visualization_transport_port
    constraint: new_port_not_inc_mw_010_port
    pinned_at: implementation_slice
  - id: AO-AEBS-010-005
