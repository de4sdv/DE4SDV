// DE4SDV broker-path bench (INC-MW-011 phase 10), bench-only, not a product type.
//
// The VSIDL type of the frame topic that the SOME/IP broker publishes in the
// SDV Core VM. The SOME/IP payload (a 4-byte little-endian length prefix plus
// one AEBS signal frame of at most 2044 bytes) is carried unchanged in `data`
// with INTERPRET_AS_BYTES. The bytes field is bounded at the 2048 bytes of the
// frame bound (owner decision of 2026-10-29), not much more. The broker's
// wrapper adds about 5 bytes, so the slot is about 2053 bytes. Data Tunnel
// sends the whole slot, so a larger field costs bandwidth. A 2044-byte frame
// plus its 4-byte prefix fills the bound; S1 boundary-tests it
// (MAP-MW-SCORE-AEBS-SIGNAL-FRAME).
syntax = "proto3";

package com.android.sdv.someip;

import "sdv/vsidl/v1/annotations.proto";

message De4sdvScoreAebsSignalFrame {
  option (.sdv.vsidl.v1.publication) = {
    message_count : 32
    model : SINGLE_PUB
  };
  bytes data = 1 [ (.sdv.vsidl.v1.variable_type_max_size) = 2048 ];
}
