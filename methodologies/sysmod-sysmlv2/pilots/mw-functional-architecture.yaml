assumptions:
- id: ASM-MW-013
  statement: >-
    Functional actions describe behavior and information exchange only; they
    do not identify logical components, processes, middleware products, or
    physical owners.
- id: ASM-MW-014
  statement: >-
    Service discovery and authentication are represented as a functional
    boundary responsibility; their concrete protocol and trust-boundary
    realization remain deferred.
