- diagnosticProxyCandidate
- lifecycleBridgeCandidate
- healthProxyCandidate
- updateCoordinatorCandidate
- serviceBindingManagerCandidate
requirement_trace_ids:
- REQ-MW-001
- REQ-MW-002
- REQ-MW-003
- REQ-MW-004
- REQ-MW-005
- REQ-MW-006
- REQ-MW-007
- REQ-MW-008
assumptions:
- id: ASM-MW-018
  statement: >-
    The AAOS SDV and adapter definitions are candidate boundary models, not
    evidence that the corresponding implementation is available or selected.
- id: ASM-MW-019
  statement: >-
    Physical/software realization is broader than hardware: software clients,
    adapter elements, service boundaries, and platform services are included,
    while deployment remains deferred.
gaps:
