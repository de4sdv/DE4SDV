schema: de4sdv.physical-software-realization.v0
id: INC-MW-008
name: Middleware integration physical/software realization
status: draft
type: PhysicalSoftwareRealizationIncrement
parent_increment: INC-MW-007
owner: DE4SDV maintainers
purpose: >-
  Map the middleware logical responsibilities to a candidate Autoware-to-AAOS
  SDV physical/software integration boundary without claiming pinned source,
  executable runtime behavior, complete requirement satisfaction, or safety
  certification.
engineering_question: >-
  What candidate software and platform boundary elements can realize the
  middleware logical responsibilities, and what source contracts remain to be
  pinned before execution claims are possible?
lifecycle_decision_supported: >-
  Decide whether the candidate physical/software boundary is sufficiently
  explicit to begin variability/configuration and V&V planning.
scope:
  in_scope:
  - Autoware-to-AAOS SDV adapter candidate
  - AAOS SDV boundary reference model
  - candidate physical/software clients for signal, diagnostic, lifecycle, health, update, and discovery responsibilities
  - logical-to-physical candidate mappings
  - physical structure, interface, functional-mapping, and logical-mapping views
  out_of_scope:
  - vendoring or implementing AAOS SDV
  - pinned ROS 2 topic schemas
  - pinned VSIDL or SOME/IP service schemas
  - process, executor, RMW/DDS, VM, ECU, network, or deployment selection
  - executable runtime evidence
  - safety certification or complete requirement satisfaction claim
  - emergency intervention command path through the middleware
source_alignment:
- source_id: INC-MW-007
  use: logical-architecture-baseline
  artifact: methodologies/sysmod-sysmlv2/pilots/mw-logical-architecture.yaml
- source_id: SDV-PLATFORM-STACK
  use: candidate-adapter-definition
  artifact: textual-notation-of-model/packages/architecture/sdv_platform_stack.sysml
- source_id: AAOS-SDV-BOUNDARY
  use: candidate-platform-boundary
  artifact: textual-notation-of-model/packages/architecture/aaos_sdv_middleware_boundary.sysml
selected_viewpoints:
- viewpoint: PhysicalStructureDefinitionViewpoint
  rationale: Review candidate physical/software boundary composition.
- viewpoint: PhysicalInterfaceDefinitionViewpoint
  rationale: Review candidate software/platform interface roles.
- viewpoint: PhysicalFunctionalMappingViewpoint
  rationale: Review functional responsibility coverage by candidate physical clients.
- viewpoint: PhysicalLogicalMappingViewpoint
  rationale: Review logical-to-physical candidate allocations.
physical_element_ids:
- MiddlewarePhysicalSoftwareBoundary
- AutowareToAAOSSDVAdapter
- SDVCoreBoundary
- SignalAccessClient
