schema: de4sdv.physical-software-realization.v0
id: INC-MW-008
name: Middleware integration physical/software realization
status: draft
type: PhysicalSoftwareRealizationIncrement
parent_increment: INC-MW-007
owner: DE4SDV maintainers
purpose: >-
  Map the middleware logical responsibilities to a candidate Autoware-to-AAOS
  SDV physical/software integration boundary with traceability to pinned
  Autoware and AOSP source artifacts, without claiming executable runtime
  behavior, complete requirement satisfaction, or safety certification.
engineering_question: >-
  What candidate software and platform boundary elements can realize the
  middleware logical responsibilities, and what source contracts remain to be
  pinned before execution claims are possible?
lifecycle_decision_supported: >-
  Decide whether the candidate physical/software boundary is sufficiently
  explicit to begin variability/configuration and V&V planning.
scope:
  in_scope:
  - Autoware-to-AAOS SDV adapter candidate
  - AAOS SDV boundary reference model
  - candidate physical/software clients for signal, diagnostic, lifecycle, health, update, and discovery responsibilities
  - logical-to-physical candidate mappings
  - pinned AOSP source-artifact traceability for AAOS SDV middleware projects
  - physical structure, interface, functional-mapping, and logical-mapping views
  out_of_scope:
  - vendoring or implementing AAOS SDV
  - pinned ROS 2 topic schemas
  - complete/pinned vehicle-signal VSIDL or SOME/IP service schemas
  - process, executor, RMW/DDS, VM, ECU, network, or deployment selection
  - executable runtime evidence
  - safety certification or complete requirement satisfaction claim
  - emergency intervention command path through the middleware
