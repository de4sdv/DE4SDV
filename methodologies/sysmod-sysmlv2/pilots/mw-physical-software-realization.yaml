signal_mapping_gate:
  applies: true
  control: logical_to_software_signal_mapping
  rule: >-
    Every logical or semantic signal crossing into a concrete software,
    service, topic, API, or physical interface has an explicit mapping or an
    explicit not-applicable/deferred disposition. A generic dependency or
    same-name element does not establish field-level traceability.
  disposition: candidate
  qualification: reference_contract_with_runtime_gap
  owner: DE4SDV maintainers
  next_action: >-
    Pin the selected vehicle-service contract and generated binding, then
    execute the provider-to-adapter-to-Autoware path before upgrading the
    candidate mapping.
  model_scope: DE4SDV_MWPhysicalSoftwareRealization::physicalSoftware::adapter::aaosSignal::vehicleSpeed
  open_gaps:
  - GAP-MW-022
  - GAP-MW-020
