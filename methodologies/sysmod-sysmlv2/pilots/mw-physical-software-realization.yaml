realization_probes:
- id: PROBE-MW-008-AAOS-CUTTLEFISH-BOOT
  phase: physical-software-realization
  question: >-
    Can the pinned AAOS SDV target build and boot as a Cuttlefish guest on a
    capability-qualified enabling host?
  candidate: x86_64-linux-nested-kvm-aaos-build-host
  evidence_status: observed
  disposition: proceed_with_bounded_boot_baseline
  preflight_gate:
  - x86_64 Linux
  - nested KVM and /dev/kvm
  - pinned AOSP manifest and target build
  - bounded storage, access, and automatic-stop controls
  evidence:
    artifact: implementation/aaos-sdv-reference-interop-bench/evidence/aaos-cuttlefish-cloud-proof.yaml
    execution_head: 9607edfdde49c8e46f305582806160858f0d2327
    build: pass
    launch: pass
    guest_boot: pass
    adb_default_cuttlefish_vsock: fail_offline
    adb_tcp_fallback: pass
    android_framework_and_car_service: gap
  model_impact:
  - enabling-host capability and target bootability are now observed for this configuration
  - VSIDL/provider, adapter deployment, ROS 2, Autoware, and bidirectional runtime claims remain deferred
