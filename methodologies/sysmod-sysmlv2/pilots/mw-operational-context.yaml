out_of_scope:
- AAOS SDV internal implementation (Orchestrator, VSIDL, APEX packages)
- S-CORE internal implementation (LoLa, modules)
- AUTOSAR Adaptive internal implementation (SOME/IP, RA)
- Adapter functional behavior (message translation logic — INC-MW-006)
- Logical architecture of the adapter (INC-MW-007)
- Physical/software realization (INC-MW-008)
- PLE configuration (INC-MW-009)
- V&V evidence (INC-MW-010)
- Safety case for the adapter (ASIL allocation, fault analysis)
- Compliance or certification claims
assumptions:
- id: ASM-MW-005
  statement: The operational scenarios assume the ADAS application is already functionally complete (INC-AEBS-006 through
    INC-AEBS-009). The middleware integration does not change what the ADAS application does — it changes how the ADAS application
    accesses vehicle platform services.
- id: ASM-MW-006
  statement: The middleware provides vehicle signals, diagnostics, lifecycle, health, and update coordination as distributed
    services. The operational context does not assume a specific middleware implementation.
- id: ASM-MW-007
  statement: Multiple SDV Core instances may operate together (as separate VMs on one SoC, on different SoCs, or across the
    vehicle network). The operational context covers the distributed case, not just a single instance.
- id: ASM-MW-008
  statement: The operational context presents both safety path options (through middleware vs direct). The decision is deferred
    to requirements and logical architecture phases.
gaps:
- id: GAP-MW-006
  statement: The specific vehicle signals that the ADAS application needs from the middleware are not yet enumerated. This
    is deferred to INC-MW-005 (requirements).
- id: GAP-MW-007
  statement: The mapping between ROS 2 topics and middleware service interfaces is not yet defined. This is deferred to INC-MW-006
    (functional architecture) and INC-MW-008 (physical realization).
- id: GAP-MW-008
  statement: The security and trust boundary for middleware communication (DICE identity, attestation, VLAN segmentation)
    is not yet modeled. This is deferred to a security-focused increment or INC-MW-005 (requirements).
acceptance_criteria:
- id: AC-MW-OC-001
  statement: The operational context identifies all operational actors and their relationship to the middleware integration.
- id: AC-MW-OC-002
  statement: 'At least six operational scenarios cover the main middleware integration use cases: signal exchange, lifecycle,
    health, diagnostics, updates, and both emergency-path alternatives.'
- id: AC-MW-OC-003
  statement: 'The emergency intervention path is documented as two alternative options: safety path through middleware and
    direct path bypassing middleware.'
- id: AC-MW-OC-004
  statement: No middleware implementation details (AAOS SDV, S-CORE, AUTOSAR) leak into the operational context.
- id: AC-MW-OC-005
  statement: Trace links exist from the INC-MW-001 framing to this operational context.
- id: AC-MW-OC-006
  statement: The operational context explicitly defers the emergency-path selection to requirements and logical architecture
    phases.
