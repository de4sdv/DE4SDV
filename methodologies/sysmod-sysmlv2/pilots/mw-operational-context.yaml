schema: de4sdv.operational-context.v0
id: INC-MW-002
name: Middleware integration operational context and story
status: draft
type: FeatureIncrement
parent_increment: INC-MW-001
owner: DE4SDV maintainers
purpose: Define the operational context for integrating a domain-specific ADAS application stack (Autoware, ROS 2/DDS) with
  a vehicle-level platform middleware (AAOS SDV, Eclipse S-CORE, AUTOSAR Adaptive). This increment models what happens in
  the world when an ADAS application needs vehicle signals, diagnostic access, lifecycle coordination, health monitoring,
  and software update coordination through a platform middleware — while presenting both emergency intervention options for
  later decision-making in requirements and logical architecture phases.
engineering_question: What operational scenarios require middleware integration between an ADAS application and the vehicle
  platform, and how should the alternative emergency intervention paths be represented in the operational context?
lifecycle_decision_supported:
  decision: approve_middleware_operational_context
  description: 'Decide whether the operational context for middleware integration is correctly scoped: vehicle signal exchange,
    diagnostic access, lifecycle coordination, health monitoring, software update coordination, and both emergency intervention
    path options as operational scenarios, with the decision about which emergency path to realize deferred to later phases.'
source_alignment:
- source_id: SRC-AAOS-SDV-DOCS
  url: https://source.android.com/docs/automotive/sdv/workstreams/core/integration-guide
  use: reference_architecture
  notes:
  - AAOS SDV integration guide describes distributed vehicle services, communication stack, lifecycle, health, and update
    management.
  - This increment models the operational need, not the AAOS SDV implementation.
  - AAOS SDV is Apache 2.0 (AOSP).
- source_id: INC-MW-001
  use: framing_baseline
  artifact: methodologies/sysmod-sysmlv2/pilots/middleware-adapter-increment-framing.yaml
- source_id: INC-AEBS-007
  use: integration_target
  artifact: textual-notation-of-model/packages/features/aebs/aebs_physical_software_realization.sysml
  notes:
  - AEBS physical realization defines required boundaries (vehicle interface, health supervisor, diagnostic bridge) that the
    middleware may satisfy.
  - The operational context presents both safety-path options; the selection is deferred to later requirements and architecture
    phases.
