schema: de4sdv.functional-behavior.v0
id: INC-AEBS-004
name: AEBS functional behavior and VSS candidate signals
status: draft
type: FeatureIncrement
parent_increment: INC-AEBS-003
owner: DE4SDV maintainers

purpose: >-
  Define the first functional-architecture slice in the SAF Conceptual Domain
  for the AEBS pilot after the
  operational context and needs/requirements baselines. This increment identifies
  abstract AEBS functions, functional information items, draft requirement trace,
  and reused/extended COVESA VSS signal definitions without claiming logical realization,
  physical/software architecture, implementation ownership, or UNECE R152
  compliance/type-approval fulfillment.

normalization_inputs:
  - artifact: methodologies/sysmod-sysmlv2/pilots/aebs-increment-framing.yaml
    changes:
      - AEBS vehicle-target behavior is normalized as common capability scope, not unresolved feature/common-capability ambiguity.
      - Deferred pedestrian/bicycle target entries are normalized as deferred product-line scope, not accepted features.
      - Sensor-package and evidence-level choices are normalized as native SysML v2 variation/variant choices.
      - SysML v2 model-expression wording is updated to reflect the existing reviewed SysML baseline.
  - artifact: methodologies/sysmod-sysmlv2/pilots/aebs-operational-context.yaml
    changes:
      - Capability and story wording now says across member products without subset/applicability weakening.
      - System 1 is treated as a product-line member product realizing the common AEBS capability.
      - Variable realization choices are deferred to native SysML v2 variation/variant modeling.
  - artifact: methodologies/sysmod-sysmlv2/pilots/aebs-needs-requirements.yaml
    changes:
      - Requirement/need text now says native variation/variant classifications where variable choices are intended.
      - AEBS remains a common product-line capability required across member products.

scope:
  in_scope:
    - abstract functional behavior for vehicle-target forward collision risk mitigation
    - functional information items crossing the AEBS behavior boundary
    - trace from draft requirements to functional responsibilities
    - reuse of generated COVESA VSS signal definitions where present
    - DE4SDV candidate VSS extension definitions for AEBS-specific signals missing from the generated VSS snapshot
    - explicit gaps for semantic review, upstreaming, thresholds, evidence, and interface acceptance
    - SysML v2 functional behavior model slice
  out_of_scope:
    - logical component allocation
    - physical/software deployment architecture
    - sensor package selection as an accepted variant
    - evidence-level selection as an accepted variant
    - calibrated activation thresholds, speed ranges, TTC values, or deceleration profiles
    - regulatory clause-level compliance interpretation
    - certification, homologation, or type-approval claim

source_alignment:
  - source_id: INC-AEBS-001
    use: normalized_framing_baseline
    artifact: methodologies/sysmod-sysmlv2/pilots/aebs-increment-framing.yaml
  - source_id: INC-AEBS-002
    use: normalized_operational_context_baseline
    artifact: methodologies/sysmod-sysmlv2/pilots/aebs-operational-context.yaml
  - source_id: INC-AEBS-003
    use: needs_requirements_baseline
    artifact: methodologies/sysmod-sysmlv2/pilots/aebs-needs-requirements.yaml
  - source_id: SRC-COVESA-VSS
    use: generated_signal_catalog
    artifact: textual-notation-of-model/libraries/covesa-vss-sysmlv2/COVESA_VSS.sysml
    notes:
      - Generated COVESA VSS attributes are reused by the SysML functional slice where they already exist.
      - VSS hierarchy is not used as architecture topology.
      - VSS mappings do not imply implementation ownership or interface completeness.
  - source_id: DE4SDV-VSS-EXT
    use: candidate_signal_extension
    artifact: textual-notation-of-model/libraries/covesa-vss-sysmlv2/DE4SDV_VSS_Extensions.sysml
    notes:
      - Missing AEBS-specific signals are modeled as DE4SDV candidate VSS extensions instead of hidden as absent mappings.
      - Extension paths are candidate vocabulary, not accepted upstream COVESA VSS content.

system_of_interest:
  system_1: SDV product-line member product realizing the common AEBS capability.
  system_2: DE4SDV engineering and assurance baseline recording functional behavior, trace, candidate VSS mappings, and gaps.
  system_3: DE4SDV governance/review ecosystem deciding whether the functional slice is good enough for later logical/interface modeling.

functional_boundary:
  subject: AEBS common capability functional behavior for the vehicle-target slice
  inputs:
    - VehicleMotionState
    - ForwardTargetState
    - DriverOverrideInput
    - AEBSFailureStatus
  outputs:
    - CollisionRiskAssessment
    - DriverWarningRequest
    - EmergencyBrakingCommand
    - FailureIndicationRequest
    - AEBSEvidenceEvent
  constraints:
    - Functional items are abstract and do not select sensors, ECUs, services, buses, or message formats.
    - Generated and extended VSS signal definitions are reused as semantic catalog references, not as architecture topology or implementation ownership.
    - DE4SDV VSS extension signals remain candidates until reviewed and, where appropriate, proposed upstream.

functional_items:
  - id: ITEM-AEBS-001
    name: VehicleMotionState
    description: Abstract state needed to reason about subject-vehicle motion for the AEBS vehicle-target slice.
    generated_vss_paths:
      - Vehicle.Speed
      - Vehicle.Acceleration.Longitudinal
    extension_vss_paths: []
    mapping_status: generated_vss_reused
    open_review: GAP-AEBS-FUNC-001
  - id: ITEM-AEBS-002
    name: ForwardTargetState
    description: Abstract state of the vehicle target ahead of the subject vehicle.
    generated_vss_paths:
      - Vehicle.ADAS.ObstacleDetection.Distance
      - Vehicle.ADAS.ObstacleDetection.TimeGap
    extension_vss_paths: []
    mapping_status: generated_vss_reused
    open_review: GAP-AEBS-FUNC-002
  - id: ITEM-AEBS-003
    name: CollisionRiskAssessment
    description: Functional assessment that forward collision risk is imminent under selected operating conditions.
    generated_vss_paths:
      - Vehicle.ADAS.ObstacleDetection.IsWarning
      - Vehicle.ADAS.ObstacleDetection.WarningType
    extension_vss_paths:
      - Vehicle.ADAS.AEBS.CollisionRisk.IsDetected
    mapping_status: generated_vss_plus_de4sdv_extension
    open_review: GAP-AEBS-FUNC-003
  - id: ITEM-AEBS-004
    name: DriverWarningRequest
    description: Functional request to warn the driver when selected warning conditions are met.
    generated_vss_paths:
      - Vehicle.ADAS.ObstacleDetection.IsWarning
      - Vehicle.ADAS.ObstacleDetection.WarningType
    extension_vss_paths:
      - Vehicle.ADAS.AEBS.DriverWarning.IsActive
    mapping_status: generated_vss_plus_de4sdv_extension
    open_review: GAP-AEBS-FUNC-004
  - id: ITEM-AEBS-005
    name: EmergencyBrakingCommand
    description: Functional command expectation for emergency braking when activation conditions are met and no override prevents intervention.
    generated_vss_paths:
      - Vehicle.ADAS.EBA.IsEngaged
      - Vehicle.Body.Lights.Brake.IsActive
    extension_vss_paths:
      - Vehicle.ADAS.AEBS.EmergencyBraking.IsCommanded
    mapping_status: generated_vss_plus_de4sdv_extension
    open_review: GAP-AEBS-FUNC-005
  - id: ITEM-AEBS-006
    name: DriverOverrideInput
    description: Functional input indicating conscious driver override of AEBS intervention.
    generated_vss_paths: []
    extension_vss_paths:
      - Vehicle.ADAS.AEBS.DriverOverride.IsActive
    mapping_status: de4sdv_extension_required
    open_review: GAP-AEBS-FUNC-006
  - id: ITEM-AEBS-007
    name: DriverOverrideDecision
    description: Functional decision describing whether conscious driver override prevents or modifies AEBS intervention.
    generated_vss_paths: []
    extension_vss_paths:
      - Vehicle.ADAS.AEBS.DriverOverride.IsActive
    mapping_status: de4sdv_extension_required
    open_review: GAP-AEBS-FUNC-006
  - id: ITEM-AEBS-008
    name: AEBSFailureStatus
    description: Functional status indicating detected AEBS-related failure conditions.
    generated_vss_paths:
      - Vehicle.ADAS.EBA.IsError
      - Vehicle.ADAS.ABS.IsError
    extension_vss_paths:
      - Vehicle.ADAS.AEBS.IsError
    mapping_status: generated_vss_plus_de4sdv_extension
    open_review: GAP-AEBS-FUNC-007
  - id: ITEM-AEBS-009
    name: FailureIndicationRequest
    description: Functional request to indicate AEBS-related failure without hiding safe-operation concerns.
    generated_vss_paths: []
    extension_vss_paths:
      - Vehicle.ADAS.AEBS.FailureIndication.IsActive
    mapping_status: de4sdv_extension_required
    open_review: GAP-AEBS-FUNC-008
  - id: ITEM-AEBS-010
    name: AEBSEvidenceEvent
    description: Functional event record seed for later verification, validation, and evidence-baseline work.
    generated_vss_paths: []
    extension_vss_paths:
      - Vehicle.ADAS.AEBS.EvidenceEvent.IsRecorded
    mapping_status: de4sdv_extension_required
    open_review: GAP-AEBS-FUNC-009

functions:
  - id: FUNC-AEBS-001
    name: AcquireVehicleAndTargetState
    responsibility: Acquire abstract vehicle-motion and forward-target state needed by the vehicle-target AEBS slice.
    inputs: []
    outputs:
      - VehicleMotionState
      - ForwardTargetState
    derived_from:
      - REQ-AEBS-001
    known_gaps:
      - GAP-AEBS-FUNC-001
      - GAP-AEBS-FUNC-002
  - id: FUNC-AEBS-002
    name: AssessForwardCollisionRisk
    responsibility: Determine whether forward collision risk is imminent under selected operating conditions.
    inputs:
      - VehicleMotionState
      - ForwardTargetState
    outputs:
      - CollisionRiskAssessment
    derived_from:
      - REQ-AEBS-001
    known_gaps:
      - GAP-AEBS-FUNC-003
  - id: FUNC-AEBS-003
    name: RequestDriverWarning
    responsibility: Request driver warning when selected warning conditions are met.
    inputs:
      - CollisionRiskAssessment
    outputs:
      - DriverWarningRequest
    derived_from:
      - REQ-AEBS-002
    known_gaps:
      - GAP-AEBS-FUNC-004
  - id: FUNC-AEBS-004
    name: EvaluateDriverOverride
    responsibility: Evaluate whether conscious driver override prevents or modifies AEBS intervention.
    inputs:
      - DriverOverrideInput
      - CollisionRiskAssessment
    outputs:
      - DriverOverrideDecision
    derived_from:
      - REQ-AEBS-004
    known_gaps:
      - GAP-AEBS-FUNC-006
  - id: FUNC-AEBS-005
    name: RequestEmergencyBraking
    responsibility: Request emergency braking when activation conditions are met and no overriding condition prevents intervention.
    inputs:
      - CollisionRiskAssessment
      - DriverOverrideDecision
    outputs:
      - EmergencyBrakingCommand
    derived_from:
      - REQ-AEBS-003
    known_gaps:
      - GAP-AEBS-FUNC-005
  - id: FUNC-AEBS-006
    name: MonitorAEBSFailureStatus
    responsibility: Monitor AEBS-related failure status relevant to safe-operation concerns.
    inputs:
      - AEBSFailureStatus
    outputs:
      - FailureIndicationRequest
    derived_from:
      - REQ-AEBS-005
    known_gaps:
      - GAP-AEBS-FUNC-007
      - GAP-AEBS-FUNC-008
  - id: FUNC-AEBS-007
    name: RecordAEBSEvidenceEvent
    responsibility: Record evidence-relevant event expectations for later V&V/evidence slices.
    inputs:
      - CollisionRiskAssessment
      - DriverWarningRequest
      - EmergencyBrakingCommand
      - FailureIndicationRequest
    outputs:
      - AEBSEvidenceEvent
    derived_from:
      - REQ-AEBS-007
    known_gaps:
      - GAP-AEBS-FUNC-009

traceability:
  - from: REQ-AEBS-001
    relation: allocated_to_function_candidate
    to:
      - FUNC-AEBS-001
      - FUNC-AEBS-002
    status: draft
  - from: REQ-AEBS-002
    relation: allocated_to_function_candidate
    to:
      - FUNC-AEBS-003
    status: draft
  - from: REQ-AEBS-003
    relation: allocated_to_function_candidate
    to:
      - FUNC-AEBS-005
    status: draft
  - from: REQ-AEBS-004
    relation: allocated_to_function_candidate
    to:
      - FUNC-AEBS-004
    status: draft
  - from: REQ-AEBS-005
    relation: allocated_to_function_candidate
    to:
      - FUNC-AEBS-006
    status: draft
  - from: REQ-AEBS-006
    relation: constrains_functional_slice
    to:
      - FUNC-AEBS-001
      - FUNC-AEBS-002
      - FUNC-AEBS-003
      - FUNC-AEBS-004
