      - FUNC-AEBS-007
    status: draft

gaps:
  - id: GAP-AEBS-FUNC-001
    statement: Vehicle motion state needs reviewed units, sampling assumptions, and operating-condition boundaries before interface modeling.
    status: open
  - id: GAP-AEBS-FUNC-002
    statement: Forward target state needs reviewed target typing, relative-distance/relative-speed assumptions, and object-source semantics.
    status: open
  - id: GAP-AEBS-FUNC-003
    statement: Collision-risk assessment has no accepted threshold, TTC criterion, or activation logic.
    status: open
  - id: GAP-AEBS-FUNC-004
    statement: Driver warning request needs modality, timing, and observability criteria.
    status: open
  - id: GAP-AEBS-FUNC-005
    statement: Emergency braking command uses generated EBA/brake-light signals plus a DE4SDV AEBS command extension; the extension needs interface review and possible upstream proposal.
    status: open
  - id: GAP-AEBS-FUNC-006
    statement: Conscious AEBS driver override needs a DE4SDV VSS extension signal because no direct generated COVESA VSS path was identified; semantics and upstream suitability remain open.
    status: open
  - id: GAP-AEBS-FUNC-007
    statement: AEBS failure status uses generated subsystem-level EBA/ABS errors plus a DE4SDV AEBS-specific error extension; the accepted AEBS failure model remains open.
    status: open
  - id: GAP-AEBS-FUNC-008
    statement: Failure indication request uses a DE4SDV VSS extension signal; the accepted driver/HMI or diagnostic indication model remains open.
    status: open
  - id: GAP-AEBS-FUNC-009
    statement: Evidence event recording uses a DE4SDV VSS extension signal; event schema, log destination, timing, retention semantics, and upstream suitability remain open.
    status: open

acceptance_criteria:
  - id: AC-AEBS-FUNC-001
    criterion: Each draft requirement from INC-AEBS-003 maps to at least one function or explicit constraint in this increment.
  - id: AC-AEBS-FUNC-002
    criterion: Each functional information item reuses generated VSS signal definitions where present, uses DE4SDV VSS extension definitions where needed, and keeps semantic/interface gaps explicit.
  - id: AC-AEBS-FUNC-003
    criterion: The SysML v2 slice uses functional action/item/flow constructs and avoids logical/physical realization claims.
  - id: AC-AEBS-FUNC-004
    criterion: No VSS candidate is described as normative architecture topology or implementation ownership.

validation:
  public_checks:
    - python scripts/check_repo.py
    - python scripts/smoke_test.py
    - git diff --check
  local_sysml_validation: not_run_by_policy
  privileged_sysml_validation: expected_from_github_when_pr_runs
