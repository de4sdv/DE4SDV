schema: de4sdv.verification-and-validation-evidence.v0
id: INC-MW-010
name: Middleware verification, validation, and evidence
status: baselined_bounded
type: VerificationAndValidationEvidenceIncrement
parent_increment: INC-MW-009
owner: DE4SDV maintainers
purpose: >-
  Index the retained verification evidence, bounded verdicts, open gaps, and
  Phase 12 baseline decision for the configured Autoware + AndroidSDV member.
  SysML owns the acceptance and closure semantics; this file records status,
  evidence locations, blockers, and execution facts.
engineering_question: >-
  What evidence is required to determine whether the configured direct
  Vehicle.Speed path, lifecycle/health boundary, startup behavior, update
  coordination, and fault detection are realized for the selected member
  product, and which claims remain blocked by missing provider, transport,
  consumer, or independent-observer implementation?
lifecycle_decision_supported: >-
  Index the bounded baseline owned by boundedBaselineDecision010 without
  promoting deferred lifecycle, update/OTA, reverse-path, production, safety,
  or certification scope.

phase12_baseline:
  id: BL-MW-010-P12
  sysml_element: boundedBaselineDecision010
  status: accepted_bounded
  recorded_on: 2026-08-27
  evidence:
    - id: E-MW-011
      artifact: implementation/aaos-sdv-reference-interop-bench/evidence/e-mw-011-runtime-campaign.yaml
      status: observed_bounded
    - id: E-MW-012
      artifact: implementation/aaos-sdv-reference-interop-bench/evidence/e-mw-012-adapter-path-campaign.yaml
      status: observed_bounded
    - id: E-MW-013
      artifact: implementation/aaos-sdv-reference-interop-bench/evidence/e-mw-013-autoware-consumer.yaml
      status: observed_bounded_autoware_consumer
    - id: E-MW-014
      artifact: implementation/aaos-sdv-reference-interop-bench/evidence/e-mw-014-health-disposition.yaml
      status: observed_bounded_health_disposition
  deferred_items:
    - id: AC-MW-010-02
      status: deferred_not_proven
    - id: AC-MW-010-05
      status: deferred_not_proven
    - gate: 8
      status: not_claimed
  successor_decision: successorIncrementDecision010

scope:
  in_scope:
    - signal translation correctness for Vehicle.Speed [km/h] to VelocityReport [m/s]
    - lifecycle coordination and readiness ordering
    - health forwarding and stale/missing/inconsistent fault disposition
    - vehicle/application startup validation
    - update/OTA contract-preservation validation
    - provider, discovery, transport, adapter, and consumer fault detection
    - independent observer and retained-evidence obligations
    - configured-member and System 2 execution-environment traceability
    - ArgumentationAssuranceViewpoint
  out_of_scope:
    - emergency-braking actuation through the generic middleware adapter
    - safety certification, compliance, homologation, or type approval
    - production readiness or vehicle-road testing
    - KUKSA broker deployment
    - claims that the minimal Cuttlefish boot target provides a complete Android framework or Car Service

system_boundary:
  system_1_member_product:
    status: configured_bounded_runtime_observed
    configuration_artifact: model-based-product-line-engineering/feature-configurations/middleware-autoware-aaos-sdv-reference.yaml
    product_projection: model-based-product-line-engineering/product-models/middleware_autoware_aaos_sdv_reference.sysml
    selected_path: >-
      COVESA VSS Vehicle.Speed [km/h] -> reference/selected VSIDL provider
      contract -> adapter normalization -> ROS 2
      autoware_vehicle_msgs/msg/VelocityReport.longitudinal_velocity [m/s]
    configured_member_id: MW-CONFIG-001
    runtime_status: observed_bounded_two_vm_campaign
  system_2_test_system:
    status: observed_bounded_two_vm_campaign
    candidate: google-cloud-x86_64-linux-nested-kvm
    model_artifact: textual-notation-of-model/packages/architecture/execution_environments.sysml
    retained_baseline: implementation/aaos-sdv-reference-interop-bench/evidence/aaos-cuttlefish-cloud-proof.yaml
    role: >-
      Build, deploy, execute, observe, and retain evidence for the System 1
      candidate. Cloud provider, VM identity, region, disk, and cost controls
      are System 2 metadata and are not product selections.

