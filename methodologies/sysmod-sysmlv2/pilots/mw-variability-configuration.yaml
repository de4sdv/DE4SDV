schema: de4sdv.variability-configuration.v0
id: INC-MW-009
name: Middleware variability and configured AAOS SDV member
status: draft
type: VariabilityConfigurationIncrement
parent_increment: INC-MW-008
owner: DE4SDV maintainers
purpose: >-
  Resolve the application-middleware adapter from the selected application and
  middleware, generate a deterministic Autoware + AAOS SDV member projection,
  and make the selected direct realization, external interface sources,
  unselected brokered alternative, and runtime non-claims reviewable.
engineering_question: >-
  Can DE4SDV produce one reproducible member-product projection for the
  selected application and middleware without allowing an incompatible or
  independently selected adapter and without promoting interface sources or
  candidate software to deployed runtime evidence?
lifecycle_decision_supported: >-
  Approve the configured member and its derived adapter as the controlled input
  to a separate implementation change before INC-MW-010 V&V and evidence work.
trace_ids:
- configuredPhysicalBoundaryTrace
- selectedDirectRealizationTrace
- exactReferenceContractTrace
- vssVehicleSpeedSemanticTrace
- ifexPropertyClassificationTrace
- configuredSignalAccessRequirementTrace
selected_viewpoints:
  - id: product-line-configuration
    viewpoint: ProductLineConfigurationViewpoint
    purpose: Review native variations and the generated selection against the catalogue and BoF.
  - id: product-model-assembly
    viewpoint: ProductModelAssemblyViewpoint
    purpose: Review configured-member composition and cross-increment traceability.
element_ids:
  configured_member: MW-CONFIG-001
  source_contributions:
    - SRC-MW-IFEX-001
    - SRC-MW-VSS-001
  realization_records:
    - REAL-MW-DIRECT-001
    - ALT-MW-KUKSA-001
  gaps:
    - GAP-MW-019
    - GAP-MW-022
    - GAP-MW-024
model_artifacts:
  sysml: textual-notation-of-model/packages/features/middleware/mw_variability_configuration.sysml
  feature_model: model-based-product-line-engineering/feature-models/sdv_product_line.yaml
  bill_of_features: model-based-product-line-engineering/feature-configurations/mw-autoware-aaos-sdv-reference.yaml
  generated_projection: model-based-product-line-engineering/product-models/mw_autoware_aaos_sdv_reference.sysml
out_of_scope:
  - IFEX toolchain or generated-contract adoption
  - KUKSA Databroker, provider, or consumer deployment
  - generated VSIDL language binding
  - deployed AAOS vehicle-speed provider
  - service discovery and cross-domain transport
  - ROS 2 VelocityReport publisher and independent Autoware observation
  - safety, compliance, certification, or runtime interoperability claims
  - emergency-braking actuation through the generic middleware adapter
supporting_implementation:
  status: planned-separate-change
  scope: >-
    Implement and exercise the direct vehicle-speed slice from the selected
    VSIDL provider contract through semantic normalization to the Autoware ROS 2
    VelocityReport publication edge. This is application engineering, not a new
    method increment.
validation:
  repository_checks: required
  deterministic_projection: required
  sysml: maintainer-run licensed validation required before readiness
next_increments:
  - INC-MW-010
