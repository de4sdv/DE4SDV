upstreaming_proposals:
  - vss_path: Vehicle.ADAS.AEBS.CollisionRisk.IsDetected
    posture: extension_candidate_for_upstream
    rationale: AEBS-specific collision risk detection does not exist in the generated COVESA VSS snapshot. The AEBS functional chain produces this as an assessment output; it could be useful as a standard VSS signal for ADAS collision risk.
    review_priority: medium
  - vss_path: Vehicle.ADAS.AEBS.DriverWarning.IsActive
    posture: extension_candidate_for_upstream
    rationale: AEBS-specific driver warning activation does not exist in the generated snapshot. It distinguishes AEBS-triggered warnings from generic obstacle detection warnings.
    review_priority: medium
  - vss_path: Vehicle.ADAS.AEBS.DriverOverride.IsActive
    posture: extension_candidate_for_upstream
    rationale: No COVESA VSS signal captures conscious driver override of AEBS intervention. This is a functional input, not a derived quantity. Upstream proposal would fill a real gap.
    review_priority: high
  - vss_path: Vehicle.ADAS.AEBS.EmergencyBraking.IsCommanded
    posture: extension_candidate_for_upstream
    rationale: Generated VSS has EBA.IsEngaged (status) but no AEBS-specific braking command signal. The distinction between EBA engagement status and AEBS commanded intervention matters for functional safety.
    review_priority: high
  - vss_path: Vehicle.ADAS.AEBS.IsError
    posture: extension_candidate_for_upstream
    rationale: Generated VSS has subsystem-level EBA.IsError and ABS.IsError but no AEBS-specific error signal. An AEBS-level error aggregate could be useful upstream.
    review_priority: medium
  - vss_path: Vehicle.ADAS.AEBS.FailureIndication.IsActive
    posture: extension_candidate_for_upstream
    rationale: No generated VSS signal covers AEBS-specific failure indication to the driver. The general Check Control signals do not distinguish AEBS failure from other system failures.
    review_priority: low
  - vss_path: Vehicle.ADAS.AEBS.EvidenceEvent.IsRecorded
    posture: extension_candidate_for_upstream
    rationale: Evidence event recording is an AEBS-specific functional concern. It may be too DE4SDV-specific for upstream VSS but is included as a candidate for review.
    review_priority: low

gaps:
  - id: GAP-AEBS-INT-003
    statement: Collision-risk assessment has no accepted threshold, TTC criterion, or activation logic. The interface port exists but the functional semantics of the assessment remain open.
    status: open
  - id: GAP-AEBS-INT-004
    statement: Driver warning request needs modality, timing, and observability criteria. The outbound port is typed but the warning interface contract is not yet reviewed.
    status: open
  - id: GAP-AEBS-INT-005
    statement: Emergency braking command uses generated EBA/brake-light status signals plus a DE4SDV AEBS command extension. The command interface contract (authority, priority, arbitration) remains open.
    status: open
  - id: GAP-AEBS-INT-006
    statement: Driver override input and decision use a DE4SDV VSS extension signal. Override semantics (conscious vs unconscious, threshold, duration) and upstream suitability remain open.
    status: open
  - id: GAP-AEBS-INT-007
    statement: AEBS failure status aggregates EBA, ABS, and AEBS-specific error signals. The accepted failure model and which errors are in-scope for AEBS safe-operation remain open.
    status: open
  - id: GAP-AEBS-INT-008
    statement: Failure indication request uses a DE4SDV VSS extension signal. HMI/diagnostic indication semantics and whether this should be a standard VSS signal remain open.
    status: open
  - id: GAP-AEBS-INT-009
    statement: Evidence event output uses a DE4SDV VSS extension signal. Event schema, log destination, timing, retention, and upstream suitability remain open.
    status: open
  - id: GAP-AEBS-INT-010
    statement: VehicleMotionState and ForwardTargetState are currently acquired internally by AcquireVehicleAndTargetState with no inputs. Whether these should become external inbound interface ports depends on sensor-ownership decisions deferred to logical realization. This gap asks whether the functional boundary should be widened.
    status: open

acceptance_criteria:
  - id: AC-AEBS-INT-001
    criterion: Each boundary-crossing functional item from INC-AEBS-004 has a typed port definition with explicit direction.
  - id: AC-AEBS-INT-002
    criterion: Each VSS signal attribute in the functional items is classified with signal character, producer, consumer, and direction at the boundary.
  - id: AC-AEBS-INT-003
    criterion: Each DE4SDV candidate VSS extension signal has an upstreaming posture with rationale and review priority.
  - id: AC-AEBS-INT-004
    criterion: The functional chain part performs the composite flow from INC-AEBS-004 and binds its boundary params to typed ports.
  - id: AC-AEBS-INT-005
    criterion: No port or interface definition claims logical component allocation, physical/software deployment, or accepted VSS interface mapping.

validation:
  public_checks:
    - python scripts/check_repo.py
    - python scripts/smoke_test.py
    - git diff --check
  local_sysml_validation: not_run_by_policy
  privileged_sysml_validation: expected_from_github_when_pr_runs