    vss_source: generated
    signal_character: observation
    producer_function: AcquireVehicleAndTargetState
    consumer_function: AssessForwardCollisionRisk
    direction_at_boundary: internal
    upstreaming_posture: not_applicable
  - item: VehicleMotionState
    attribute: longitudinalAcceleration
    vss_path: Vehicle.Acceleration.Longitudinal
    vss_source: generated
    signal_character: observation
    producer_function: AcquireVehicleAndTargetState
    consumer_function: AssessForwardCollisionRisk
    direction_at_boundary: internal
    upstreaming_posture: not_applicable
  - item: ForwardTargetState
    attribute: obstacleDistance
    vss_path: Vehicle.ADAS.ObstacleDetection.Distance
    vss_source: generated
    signal_character: observation
    producer_function: AcquireVehicleAndTargetState
    consumer_function: AssessForwardCollisionRisk
    direction_at_boundary: internal
    upstreaming_posture: not_applicable
  - item: ForwardTargetState
