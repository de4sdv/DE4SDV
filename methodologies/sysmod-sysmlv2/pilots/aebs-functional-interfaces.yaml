schema: de4sdv.functional-interfaces.v0
id: INC-AEBS-005
name: AEBS functional interface refinement
status: draft
type: FeatureIncrement
parent_increment: INC-AEBS-004
owner: DE4SDV maintainers

purpose: >-
  Refine the INC-AEBS-004 functional behavior boundary into typed functional
  interface ports. classify signal character and direction for each functional
  information item, and record upstreaming posture for each DE4SDV candidate
  VSS extension signal. This increment does not allocate logical components,
  physical/software architecture, or accepted VSS interface mapping.
  The port definitions and functional chain are added to the existing
  aebs_functional_architecture.sysml file inside the FunctionalBehavior package,
  not in a separate file, because SysIDE does not support cross-file sibling
  package imports within the same DE4SDV namespace.

scope:
  in_scope:
    - functional interface port definitions typed by INC-AEBS-004 item defs
    - direction (in/out) at the AEBS functional boundary
    - signal character classification for each VSS signal attribute
    - producer/consumer mapping at the functional level
    - upstreaming posture for each DE4SDV candidate VSS extension signal
    - composite flow performed by a functional chain part with typed ports
    - explicit gaps for interface acceptance, sensor ownership, and upstream review
    - SysML v2 functional interface model slice
  out_of_scope:
    - logical component allocation
    - physical/software deployment architecture
    - sensor package selection as an accepted variant
    - evidence-level selection as an accepted variant
    - calibrated activation thresholds, speed ranges, TTC values, or deceleration profiles
    - regulatory clause-level compliance interpretation
    - certification, homologation, or type-approval claim
    - accepted upstream COVESA VSS extension

source_alignment:
  - source_id: INC-AEBS-004
    use: functional_behavior_baseline
    artifact: textual-notation-of-model/packages/features/aebs/aebs_functional_architecture.sysml
    notes:
      - Item defs, action defs, and composite flow are imported from INC-AEBS-004.
      - VSS signal attributes inside item defs are reused as structural catalog references.
      - No new VSS extension signals are introduced in this increment.
  - source_id: SRC-COVESA-VSS
    use: generated_signal_catalog
    artifact: textual-notation-of-model/libraries/covesa-vss-sysmlv2/COVESA_VSS.sysml
  - source_id: DE4SDV-VSS-EXT
    use: candidate_signal_extension
    artifact: textual-notation-of-model/libraries/covesa-vss-sysmlv2/DE4SDV_VSS_Extensions.sysml

system_of_interest:
  system_1: SDV product-line member product realizing the common AEBS capability.
  system_2: DE4SDV engineering and assurance baseline recording functional interfaces, signal character, and upstreaming posture.
  system_3: DE4SDV governance/review ecosystem deciding whether functional interfaces are good enough for logical realization.

functional_boundary_ports:
  inbound:
    - id: PORT-AEBS-IN-001
      name: DriverOverrideInputInbound
      item_type: DriverOverrideInput
      direction: in
      signal_character: observation
      rationale: Driver override is an observed input from the driver; the functional chain does not own or command it.
      open_review: GAP-AEBS-INT-006
    - id: PORT-AEBS-IN-002
      name: AEBSFailureStatusInbound
      item_type: AEBSFailureStatus
      direction: in
      signal_character: status
      rationale: Failure status is monitored from subsystem-level and AEBS-specific error sources; the functional chain does not produce it.
      open_review: GAP-AEBS-INT-007
  outbound:
    - id: PORT-AEBS-OUT-001
      name: DriverWarningRequestOutbound
      item_type: DriverWarningRequest
      direction: out
      signal_character: command
      rationale: Warning request is a functional command to the HMI/warning subsystem; the chain owns the request but not the rendering.
      open_review: GAP-AEBS-INT-004
    - id: PORT-AEBS-OUT-002
      name: EmergencyBrakingCommandOutbound
      item_type: EmergencyBrakingCommand
      direction: out
      signal_character: command
      rationale: Emergency braking command is a functional command to the braking subsystem; the chain owns the decision but not the actuation.
      open_review: GAP-AEBS-INT-005
    - id: PORT-AEBS-OUT-003
      name: FailureIndicationRequestOutbound
      item_type: FailureIndicationRequest
      direction: out
      signal_character: command
      rationale: Failure indication request is a functional command to the HMI/diagnostic subsystem.
      open_review: GAP-AEBS-INT-008
    - id: PORT-AEBS-OUT-004
      name: AEBSEvidenceEventOutbound
      item_type: AEBSEvidenceEvent
      direction: out
      signal_character: event
      rationale: Evidence event is a recorded observation for later V&V/evidence work; the chain owns the event seed but not the storage.
      open_review: GAP-AEBS-INT-009

internal_items_not_on_boundary:
  - id: ITEM-INTERNAL-001
    name: VehicleMotionState
    rationale: Currently acquired internally by AcquireVehicleAndTargetState with no inbound port. Whether this should become an external inbound interface depends on sensor-ownership decisions.
    open_review: GAP-AEBS-INT-010
  - id: ITEM-INTERNAL-002
    name: ForwardTargetState
    rationale: Same as VehicleMotionState — acquired internally; external interface depends on sensor-ownership decisions.
    open_review: GAP-AEBS-INT-010
  - id: ITEM-INTERNAL-003
    name: CollisionRiskAssessment
    rationale: Internal functional assessment produced by AssessForwardCollisionRisk and consumed by three downstream actions. Not a boundary item.
    open_review: GAP-AEBS-INT-003
  - id: ITEM-INTERNAL-004
    name: DriverOverrideDecision
    rationale: Internal decision produced by EvaluateDriverOverride and consumed by RequestEmergencyBraking. Not a boundary item.
    open_review: GAP-AEBS-INT-006

