schema: de4sdv.physical-software-realization.v0
id: INC-AEBS-007
name: AEBS Autoware physical software realization
status: draft
type: EngineeringIncrement
parent_increment: INC-AEBS-006
owner: DE4SDV maintainers

domain: physical_software_realization
decision_requested: >-
  Decide whether the pinned Autoware AEB package is an adequate source
  realization candidate for a simulation-first pilot, while retaining explicit
  gaps and blocking unsafe or stale branches from use as evidence.

purpose: >-
  Map all nine logical AEBS components from INC-AEBS-006 to inspected,
  commit-pinned Autoware and ROS 2 artifacts; record exact interfaces,
  configuration-dependent coverage, defects, the required downstream emergency
  chain, and evidence limits without claiming requirement satisfaction.

scope:
  in_scope:
    - pinned Autoware AEB package source and package metadata
    - ROS 2 node inputs, outputs, launch remappings, and default configuration
    - logical-to-physical-software fit and gap mapping
    - diagnostic-to-brake-actuation integration obligations
    - inspected source defects and blockers
    - proposed simulation-first pilot configuration
  out_of_scope:
    - source patches or upstream changes
    - SysML or SAF artifacts
    - hardware, compute, network, sensor, brake ECU, and actuator allocation
    - executed build, launch, simulation, road, or braking tests
    - calibrated requirement satisfaction or safety-case evidence
    - UNECE R152 compliance, certification, homologation, or production readiness

