verification_planning:
  status: deferred_to_chain
  ownership: System 2 verification and assurance workflow
  note: >-
    Verification cases, acceptance criteria, and evidence artifacts are
    planned in the Phase 10 slice of the INC-AEBS-010 chain. Controlled
    dispositions for that later evidence are observed_bounded,
    deferred_not_proven, and not_claimed. No verdict exists in this slice.

claim_boundary: >-
  Framing, needs, and System 2 requirement candidates only. No architecture,
  configuration, implementation, runtime, safety, human-factors, compliance,
  certification, or INC-MW-010-modifying claim is made or implied.

