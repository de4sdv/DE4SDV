schema: de4sdv.needs-requirements.v0
id: INC-AEBS-003
name: AEBS needs and draft requirements
status: draft
type: FeatureIncrement
parent_increment: INC-AEBS-002
owner: DE4SDV maintainers
purpose: 'Convert the accepted AEBS operational slice into a small problem-statement, draft needs, and design-input requirements
  baseline with explicit verification and validation planning fields. This increment remains pre-functional: it does not decompose
  functions, allocate logical components, select VSS signals, or claim UNECE R152 compliance/type-approval fulfillment. UNECE
  R152 is treated as a regulatory driver for a common AEBS capability, not as fulfilled evidence.'
scope:
  in_scope:
  - problem statement and DE4SDV system context
  - product-line common AEBS capability need
  - vehicle-target rear-end in-lane collision risk slice
  - draft design-input requirement candidates
  - requirement quality findings and known gaps
  - verification and validation planning fields
  - SysML v2 requirements model slice
  - pedestrian-target stakeholder need and product requirement candidates
  - bicycle-target stakeholder need and product requirement candidates
  - controlled gaps for quantified regulatory candidates
  out_of_scope:
  - quantified speed, distance, TTC, or deceleration thresholds
  - VSS signal selection or mapping
  - functional decomposition
  - logical or physical/software realization
  - UNECE R152 clause-level compliance interpretation
  - certification, homologation, or type-approval claim
source_alignment:
- source_id: INC-AEBS-001
  use: framing_baseline
  artifact: methodologies/sysmod-sysmlv2/pilots/aebs-increment-framing.yaml
- source_id: INC-AEBS-002
  use: operational_context_baseline
  artifact: methodologies/sysmod-sysmlv2/pilots/aebs-operational-context.yaml
- source_id: MBSE4U-SYSMOD-PROBLEM-STATEMENT
  use: method_pattern
  artifact: https://mbse4u.com/2024/12/01/sysmod-with-sysml-v2-problem-statement/
  notes:
  - Used as a source-backed method pattern for modeling the problem statement as a SysML v2 requirement in a system context.
  - DE4SDV adapts the pattern selectively and does not vendor or implement the full upstream method library.
- source_id: SRC-UNECE-R152
  use: candidate_regulatory_anchor
  notes:
  - Used as a private/source-grounded anchor for AEBS terminology and vehicle-target scope awareness.
  - This file does not copy source text and does not assert compliance.
regulatory_candidate_control:
  source_id: E/ECE/TRANS/505/Rev.3/Add.151/Rev.2
  source_alias: SRC-UNECE-R152
  source_identity_status: controlled_public_safe_metadata
  source_metadata_artifact: methodologies/sysmod-sysmlv2/pilots/aebs-regulatory-source.yaml
  source_original_sha256: dc9cc84498dcae8f0888067ad3967fb5a346e814bc2f19128987a654c8a193de
  applicability_status: candidate_not_authoritatively_determined
  quantified_candidate_status: derivation_deferred
  quantified_candidates: []
  gap_ids:
  - GAP-AEBS-REQ-013
  - GAP-AEBS-REQ-014
  rationale: The repository controls a public-safe source identity, revision, digest, and selected clause anchors. Vehicle-category
    applicability, amendment-selection rationale, authority interpretation, tolerances outside the selected source tables,
    measurement uncertainty, and promotion of clause-derived System 1 obligations remain unresolved. No numeric System 1 obligation
    is derived until those inputs are controlled and reviewed.
system_of_interest:
  system_1: SDV product line whose member products are required to realize the AEBS common capability.
  system_2: DE4SDV engineering and assurance system maintaining traceability, V&V planning, gaps, and model artifacts.
  system_3: DE4SDV governance and review ecosystem deciding whether the draft baseline is good enough for functional modeling.
requirement_quality_gate:
  source: INCOSE GtWR v4 summary-sheet private grounding
  decision: The statements in this increment are requirement candidates, not accepted design-input requirements. They preserve
    the trace chain but still fail or defer several quality checks until operating conditions, thresholds, timing, and success
    criteria are defined.
  enforced_rules:
  - R1 structured statements
  - R2 active voice with responsible entity as subject
  - R4 defined terms
  - R7 avoid vague terms
  - R18 single thought
  - R27 explicit conditions
  - R33 value ranges where quantities are used
  - R34 measurable performance targets
  - R35 explicit temporal dependencies
  - R36 consistent terms and units
  promotion_rule: A candidate can be promoted to an accepted design-input requirement only after the relevant rule findings
    are closed or explicitly accepted with rationale.
verification_planning:
  status: planned_with_open_criteria
  ownership: System 2 verification and assurance workflow
  note: Methods, criteria, and evidence status are planning attachments, not normative content of the System 1 product requirement expressions.
  bounded_evidence_note: Records with a bounded_evidence field link the requirement to executed or implemented INC-AEBS-009 evidence-contract work. Increment statuses are owned by implementation/aebs-autoware-executable-bench/increments.yaml; evidence artifacts live under implementation/aebs-autoware-nominal-vehicle-target-bench/evidence/ and implementation/aebs-autoware-stationary-target-bench/evidence/. These are System 2 evidence-contract results only; no System 1 product requirement is verified or satisfied by them.
  records:
  - requirements:
    - REQ-AEBS-001
    method: analysis
    evidence_status: planned
    criterion_gap: Define operating conditions, target conditions, and detection criteria.
  - requirements:
    - REQ-AEBS-002
    method: demonstration
    evidence_status: planned
    criterion_gap: Define warning conditions, timing, modality, and driver observability.
    bounded_evidence: INC-AEBS-009B EC-AEBS-009B-01 observed replayable (implementation/aebs-autoware-nominal-vehicle-target-bench/evidence/009b/scenario-evidence.json).
  - requirements:
    - REQ-AEBS-003
    method: simulation
    evidence_status: planned
    criterion_gap: Define activation conditions, braking command expectations, and override exclusions.
    bounded_evidence: INC-AEBS-009B EC-AEBS-009B-03/04/05 observed replayable (implementation/aebs-autoware-nominal-vehicle-target-bench/evidence/009b/scenario-evidence.json); INC-AEBS-009C partial native-intervention-to-MRM chain executed_replay_validated_pending_review (implementation/aebs-autoware-stationary-target-bench/evidence/009c/scenario-evidence.json).
  - requirements:
    - REQ-AEBS-004
    method: demonstration
    evidence_status: planned
    criterion_gap: Define allowed override inputs and the controlled override-response mapping.
    bounded_evidence: INC-AEBS-009B EC-AEBS-009B-02 observed replayable (implementation/aebs-autoware-nominal-vehicle-target-bench/evidence/009b/scenario-evidence.json); INC-AEBS-009D six-profile conscious-override matrix executed_replay_validated_pending_review (implementation/aebs-autoware-nominal-vehicle-target-bench/evidence/009d/campaign-manifest.json).
  - requirements:
    - REQ-AEBS-005
    method: inspection
    evidence_status: gap
    criterion_gap: Define failure modes, detection expectations, warning behavior, and safe-operation criteria.
  - requirements:
    - REQ-AEBS-006
    - REQ-AEBS-007
    - REQ-AEBS-S2-001
    method: inspection
    evidence_status: planned
    criterion_gap: null
  - requirements:
    - REQ-AEBS-008
    - REQ-AEBS-012
    method: test
    evidence_status: gap
    criterion_gap: Define non-activation conditions, observation windows, tolerances, and false-reaction classification.
    bounded_evidence: INC-AEBS-009E evidence contracts implemented with quantified bounds; execution pending (no evidence artifact).
  - requirements:
    - REQ-AEBS-009
    - REQ-AEBS-013
    method: test
    evidence_status: gap
    criterion_gap: Define input-health criteria, state ownership, transition timing, indication, and safe-operation response.
    bounded_evidence: INC-AEBS-009F evidence contracts implemented with quantified bounds; execution pending (no evidence artifact).
  - requirements:
    - REQ-AEBS-010
    - REQ-AEBS-014
    method: test
    evidence_status: gap
    criterion_gap: Determine applicability and control pedestrian target definition, conditions, response, tolerances, and
      uncertainty.
    bounded_evidence: INC-AEBS-009G and INC-AEBS-009I (pedestrian criterion) evidence contracts implemented with quantified bounds; execution pending (no evidence artifact).
  - requirements:
    - REQ-AEBS-011
    - REQ-AEBS-015
    method: test
    evidence_status: gap
    criterion_gap: Determine applicability and control bicycle target definition, conditions, response, tolerances, and uncertainty.
    bounded_evidence: INC-AEBS-009H and INC-AEBS-009I (bicycle criterion) evidence contracts implemented with quantified bounds; execution pending (no evidence artifact).
validation_scenarios:
- id: VAL-AEBS-001
  validates_need: N-AEBS-001
  method: stakeholder scenario review
  status: planned
  question: Do the draft requirements preserve the stakeholder-visible vehicle-target collision-risk mitigation intent without
    exceeding the operational slice?
  evidence_artifact: planned requirements review record
- id: VAL-AEBS-002
  validates_need: N-AEBS-002
  method: inspection
  status: planned
  question: Are assumptions and out-of-scope cases still visible after requirements are derived?
  evidence_artifact: planned boundary/assumption review checklist
- id: VAL-AEBS-003
  validates_need: N-AEBS-003
  method: inspection
  status: planned
  question: Does the requirement set keep AEBS framed as product-line common capability while deferring variable realization
    choices to native SysML v2 variation and variant modeling?
  evidence_artifact: planned product-line classification review note
- id: VAL-AEBS-004
  validates_need: N-AEBS-004
  method: inspection
  status: planned
  question: Are regulatory assumptions traceable without compliance wording or copied source text?
  evidence_artifact: planned regulatory-assumption review note
- id: VAL-AEBS-005
  validates_need: N-AEBS-005
  method: inspection
  status: planned
  question: Does every requirement have a separate controlled V&V planning attachment and visible unresolved criteria gaps?
  evidence_artifact: planned requirements V&V inspection record
- id: VAL-AEBS-006
  validates_need: N-AEBS-006
  method: pedestrian stakeholder and applicability review
  status: planned
  question: Does the pedestrian-target candidate preserve distinct stakeholder intent without importing vehicle-target criteria
    or implying regulatory acceptance?
  evidence_artifact: planned pedestrian candidate review record
- id: VAL-AEBS-007
  validates_need: N-AEBS-007
  method: cyclist stakeholder and applicability review
  status: planned
  question: Does the bicycle-target candidate preserve distinct stakeholder intent without importing vehicle-target criteria
    or implying regulatory acceptance?
  evidence_artifact: planned bicycle candidate review record
- id: VAL-AEBS-008
  validates_need: N-AEBS-008
  method: road-user and vehicle-occupant safety/availability review
  status: planned
  question: Do the degraded-state and status-indication candidates preserve the System 1 safety and availability intent without
    importing System 2 evidence-governance concerns?
  evidence_artifact: planned degraded-state stakeholder review record
- id: VAL-AEBS-014
  validates_need: N-AEBS-014
  method: road-user and vehicle-occupant false-reaction review
  status: planned
  question: Do the non-activation silence candidates preserve the trustworthy-intervention intent without weakening the collision-risk
    mitigation obligation of N-AEBS-001?
  evidence_artifact: planned false-reaction stakeholder review record
quality_findings:
- id: QF-AEBS-REQ-001
  severity: expected_gap
  finding: Several requirements are not yet quantitatively verifiable because scenario parameters and thresholds are deferred.
- id: QF-AEBS-REQ-002
  severity: controlled_scope
  finding: Vehicle, pedestrian, and bicycle target candidates remain separate; none borrows another target class's criteria.
- id: QF-AEBS-REQ-003
  severity: controlled_scope
  finding: Requirements avoid VSS signal names until functional interfaces are modeled.
- id: QF-AEBS-REQ-004
  severity: controlled_scope
  finding: Regulatory alignment is captured as a source constraint, not as compliance evidence.
- id: QF-AEBS-REQ-005
  severity: correction
  finding: SysML v2 model representation must use native requirement definitions/usages rather than modeling requirements
    only as generic parts.
- id: QF-AEBS-REQ-006
  severity: controlled_scope
  finding: SysML v2 requirement satisfaction is deferred because the current increment has no functional/logical realization
    elements that can honestly satisfy the candidate requirements.
- id: QF-AEBS-REQ-007
  severity: correction
  finding: 'REQ-AEBS-008 and REQ-AEBS-012 were re-parented from N-AEBS-001 to the new N-AEBS-014 (trustworthy intervention decisions):
    a non-activation silence constraint does not preserve a collision-risk-reduction parent intent.'
- id: QF-AEBS-REQ-008
  severity: correction
  finding: Operating-condition qualifiers unified to one controlled phrase ('defined operating conditions' and 'defined applicable
    ... operating conditions') across N-AEBS-006/007, REQ-AEBS-001/002/003, and REQ-AEBS-010/011/014/015; all point at GAP-AEBS-REQ-001.
model_artifacts:
- id: MODEL-AEBS-NEEDS-REQ-SYSML
  path: textual-notation-of-model/packages/features/aebs/aebs_needs_requirements.sysml
  status: draft
  purpose: SysML v2 needs/requirements model slice using an adapted DE4SDV method context, native requirement definitions/usages
    for stakeholder needs and candidate requirements, and deferred satisfaction until realization elements exist.
- id: MODEL-DE4SDV-METHOD-CONTEXT-SYSML
  path: textual-notation-of-model/packages/methods/de4sdv/de4sdv_method_context.sysml
  status: draft
  purpose: Selective DE4SDV adaptation of the SYSMOD/SysML v2 problem-statement pattern; not a full SYSMOD implementation
    or vendored upstream library.
- id: MODEL-DE4SDV-STAKEHOLDERS-SYSML
  path: textual-notation-of-model/packages/methods/de4sdv/de4sdv_stakeholders.sysml
  status: draft
  purpose: Shared SysML v2 stakeholder role definitions used by requirement stakeholder parameters.
