  - id: GAP-AEBS-REQ-003
    statement: Collision-warning timing, modality, and observability criteria remain undefined.
  - id: GAP-AEBS-REQ-004
    statement: Emergency-braking activation conditions and braking demand profile remain undefined.
  - id: GAP-AEBS-REQ-005
    statement: Non-activation and false-reaction constraints remain undefined.
  - id: GAP-AEBS-REQ-006
    statement: Conscious driver override inputs and resulting behavior remain undefined.
  - id: GAP-AEBS-REQ-007
    statement: AEBS failure detection, indication, and safe-operation criteria remain undefined.
  - id: GAP-AEBS-REQ-008
    statement: Product-line variation points are not yet modeled; they must not weaken the common AEBS capability obligation across member products.
  - id: GAP-AEBS-REQ-009
    statement: VSS signal candidates are intentionally deferred until the functional-interface increment.
  - id: GAP-AEBS-REQ-010
    statement: Requirement satisfaction assertions are intentionally deferred until a functional/logical realization model contains concrete satisfying features.
  - id: GAP-AEBS-REQ-011
    statement: Complete non-activation scenarios, observation windows, classification rules, and false-reaction tolerances remain undefined.
  - id: GAP-AEBS-REQ-012
    statement: Degraded/unavailable state ownership, transition timing, indication behavior, and safe-operation response remain undefined.
  - id: GAP-AEBS-REQ-013
    statement: Source identity is controlled, but amendment-selection rationale, vehicle-category applicability, and authority interpretation remain unresolved.
  - id: GAP-AEBS-REQ-014
    statement: Promotion of quantified thresholds into System 1 obligations, complete tolerance treatment, measurement uncertainty, and repetition interpretation remain deferred.
  - id: GAP-AEBS-REQ-015
    statement: Pedestrian target definition, operating conditions, response criteria, and applicability remain unresolved.
  - id: GAP-AEBS-REQ-016
    statement: Bicycle target definition, operating conditions, response criteria, and applicability remain unresolved.

