  - id: VAL-AEBS-003
    validates_need: N-AEBS-003
    method: inspection
    status: planned
    question: Does the requirement set keep AEBS framed as product-line common capability while deferring variable realization choices to native variation/variant modeling?
    evidence_artifact: planned product-line classification review note
