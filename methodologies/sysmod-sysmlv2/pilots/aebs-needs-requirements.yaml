problem_statement:
  id: PS-AEBS-REQ-001
  type: de4sdv_method_context_problem_statement
  source_pattern: MBSE4U-SYSMOD-PROBLEM-STATEMENT
  statement: >-
    How can DE4SDV define an AEBS needs and draft requirements baseline for
    the SDV product-line common AEBS capability required across member products
    that preserves the vehicle-target collision-risk mitigation intent, keeps
    operational boundaries and regulatory assumptions visible, and exposes
    requirement quality gaps without claiming functional realization, VSS signal
    mapping, or UNECE R152 compliance/type-approval fulfillment?
  status: draft
  model_element: DE4SDV_AEBSNeedsRequirements::Features::AEBS::NeedsRequirements::aebsNeedsRequirementsSystemContext::aebsNeedsRequirementsProblemStatement

needs:
  - id: N-AEBS-001
    stakeholder: road_users_and_vehicle_occupants
    type: stakeholder_need
    statement: >-
      Road users and vehicle occupants need the SDV product line to define AEBS as a
      common capability required across member products to reduce forward
      rear-end in-lane collision risk with a vehicle target under defined
      operating conditions.
    source: STORY-AEBS-VEHICLE-TARGET-001
    priority: high
    status: draft
    validation_reference: VAL-AEBS-001
    rationale: Primary stakeholder-visible value of the first AEBS slice.
  - id: N-AEBS-002
    stakeholder: systems_engineer
    type: engineering_need
    statement: >-
      Systems engineers need the DE4SDV AEBS increment to keep the operational
      boundary, assumptions, source constraints, and out-of-scope cases explicit
      while draft requirements are derived.
    source: INC-AEBS-002
    priority: high
    status: draft
    validation_reference: VAL-AEBS-002
    rationale: Prevents requirements from silently expanding beyond the accepted operational slice.
  - id: N-AEBS-003
    stakeholder: product_line_engineer
    type: product_line_need
    statement: >-
      Product-line engineers need the DE4SDV AEBS increment to keep AEBS
      classified as a product-line common capability required across member
      products, with native SysML v2 variation and variant choices modeled
      separately instead of weakening the common-capability classification.
    source: INC-AEBS-001
    priority: high
    status: draft
    validation_reference: VAL-AEBS-003
    rationale: Keeps product-line semantics aligned with DE4SDV feature terminology.
  - id: N-AEBS-004
    stakeholder: compliance_engineer
    type: constraint_need
    statement: >-
      Compliance engineers need the DE4SDV AEBS increment to keep regulatory
      assumptions, source references, and open interpretation gaps visible
      without implying UNECE R152 compliance or type approval.
    source: SRC-UNECE-R152
    priority: medium
    status: draft
    validation_reference: VAL-AEBS-004
    rationale: Keeps regulatory traceability useful without overclaiming.
  - id: N-AEBS-005
    stakeholder: verification_engineer
    type: vv_need
    statement: >-
      Verification engineers need the DE4SDV AEBS increment to maintain a
      separate, controlled V&V planning attachment for each draft AEBS requirement
      without changing the product obligation.
    source: INC-AEBS-002
    priority: high
    status: draft
    validation_reference: VAL-AEBS-005
    rationale: Prevents weak requirement statements from entering functional modeling without visible V&V debt.
  - id: N-AEBS-006
    stakeholder: pedestrians
    type: stakeholder_need
    statement: >-
      Pedestrians need the SDV product line to provide a common AEBS capability
      that reduces forward collision risk with a pedestrian target under
      controlled applicable operating conditions.
    source: SRC-UNECE-R152
    source_links:
      - SRC-UNECE-R152
    applicability: candidate pedestrian-target scope; exact regulatory applicability remains a controlled gap
    priority: high
    status: draft
    validation_reference: VAL-AEBS-006
    rationale: Keeps pedestrian-target stakeholder intent distinct from the retained vehicle-target slice.
  - id: N-AEBS-007
    stakeholder: cyclists
    type: stakeholder_need
    statement: >-
      Cyclists need the SDV product line to provide a common AEBS capability
      that reduces forward collision risk with a bicycle target under
      controlled applicable operating conditions.
    source: SRC-UNECE-R152
    source_links:
      - SRC-UNECE-R152
    applicability: candidate bicycle-target scope; exact regulatory applicability remains a controlled gap
    priority: high
    status: draft
    validation_reference: VAL-AEBS-007
    rationale: Keeps bicycle-target stakeholder intent distinct from both vehicle and pedestrian target slices.
  - id: N-AEBS-008
    stakeholder: road_users_and_vehicle_occupants
    type: stakeholder_safety_availability_need
    statement: >-
      Road users and vehicle occupants need each SDV product-line member product
      to manage AEBS degradation so that behavior remains bounded and AEBS
      availability is apparent when required inputs or AEBS functions are not healthy.
    source: INC-AEBS-002
    source_links:
      - INC-AEBS-002
      - SRC-UNECE-R152
    applicability: candidate common member-product safety and availability scope
    priority: high
    status: draft
    validation_reference: VAL-AEBS-008
    rationale: Provides the System 1 stakeholder parent for product degraded-state and status-indication candidates without deriving product behavior from assurance visibility needs.

requirement_quality_gate:
  source: INCOSE GtWR v4 summary-sheet private grounding
  decision: >-
    The statements in this increment are requirement candidates, not accepted
    design-input requirements. They preserve the trace chain but still fail or
    defer several quality checks until operating conditions, thresholds, timing,
    and success criteria are defined.
  enforced_rules:
    - R1 structured statements
    - R2 active voice with responsible entity as subject
    - R4 defined terms
    - R7 avoid vague terms
    - R18 single thought
    - R27 explicit conditions
    - R33 value ranges where quantities are used
    - R34 measurable performance targets
    - R35 explicit temporal dependencies
    - R36 consistent terms and units
  promotion_rule: >-
    A candidate can be promoted to an accepted design-input requirement only
    after the relevant rule findings are closed or explicitly accepted with
    rationale.

requirements:
  - id: REQ-AEBS-001
    type: functional
    status: draft
    maturity: requirement_candidate
    statement: >-
      Each SDV product-line member product shall realize the common AEBS
      capability by detecting imminent forward collision risk with a vehicle
      target under selected operating conditions.
    derived_from:
      - N-AEBS-001
    validation_reference: VAL-AEBS-001
    known_gaps:
      - GAP-AEBS-REQ-001
      - GAP-AEBS-REQ-002
  - id: REQ-AEBS-002
    type: functional
    status: draft
    maturity: requirement_candidate
    statement: >-
      Each SDV product-line member product shall realize the common AEBS
      capability by providing a collision warning to the driver when selected
      warning conditions are met.
    derived_from:
      - N-AEBS-001
    validation_reference: VAL-AEBS-001
    known_gaps:
      - GAP-AEBS-REQ-003
  - id: REQ-AEBS-003
    type: functional
    status: draft
    maturity: requirement_candidate
    statement: >-
      Each SDV product-line member product shall realize the common AEBS
      capability by commanding emergency braking when selected activation
      conditions are met and no overriding condition prevents intervention.
    derived_from:
      - N-AEBS-001
    validation_reference: VAL-AEBS-001
    known_gaps:
      - GAP-AEBS-REQ-004
      - GAP-AEBS-REQ-005
  - id: REQ-AEBS-004
    type: functional
    status: draft
    maturity: draft_requirement_with_gap
    statement: >-
      When a valid, fresh, and unambiguous driver input is classified as a
      conscious override under controlled override criteria during AEBS
      intervention, each SDV product-line member product shall apply the
      intervention response selected by the controlled override-response mapping.
    derived_from:
      - N-AEBS-001
    validation_reference: VAL-AEBS-001
    known_gaps:
      - GAP-AEBS-REQ-006
  - id: REQ-AEBS-005
    type: safety_constraint
    status: draft
    maturity: draft_requirement_with_gap
    statement: >-
      Under controlled failure-detection criteria, each SDV product-line
      member product shall detect AEBS-related failure conditions.
    derived_from:
      - N-AEBS-008
    validation_reference: VAL-AEBS-008
    known_gaps:
      - GAP-AEBS-REQ-007
  - id: REQ-AEBS-006
    type: product_line_constraint
    status: draft
    maturity: requirement_candidate
    statement: >-
      The DE4SDV AEBS increment shall keep common-capability, feature, and native
      variation and variant classifications explicit for each AEBS behavior or
      scope element in its model baseline.
    derived_from:
      - N-AEBS-003
    validation_reference: VAL-AEBS-003
    known_gaps:
      - GAP-AEBS-REQ-008
      - GAP-AEBS-REQ-010
  - id: REQ-AEBS-007
    type: traceability_constraint
    status: draft
    maturity: requirement_candidate
    statement: >-
      The DE4SDV AEBS increment shall maintain separate trace links from each
      draft AEBS requirement to its source, stakeholder need, unresolved gaps,
      validation reference, and controlled V&V planning attachment.
    derived_from:
      - N-AEBS-004
      - N-AEBS-005
    validation_reference: VAL-AEBS-005
    known_gaps: []
  - id: REQ-AEBS-S2-001
    type: evidence_contract_traceability_constraint
    status: draft
    maturity: requirement_candidate
    statement: >-
      The DE4SDV AEBS increment shall maintain trace links from each AEBS evidence
      contract to its controlled operational boundary, assumptions, source
      constraints, and exclusions.
    derived_from:
      - N-AEBS-002
    validation_reference: VAL-AEBS-002
    known_gaps: []
  - id: REQ-AEBS-008
    type: safety_constraint
    status: draft
    maturity: draft_requirement_with_gap
    statement: >-
      When controlled non-activation criteria determine that imminent forward
      collision risk is absent under defined operating conditions, each SDV
      product-line member product shall not issue an AEBS collision warning.
    derived_from:
      - N-AEBS-001
    source_links:
      - INC-AEBS-002
      - SRC-UNECE-R152
    applicability: candidate vehicle-target warning non-activation scope
    validation_reference: VAL-AEBS-001
    known_gaps:
      - GAP-AEBS-REQ-005
      - GAP-AEBS-REQ-011
  - id: REQ-AEBS-009
    type: safety_constraint
    status: draft
    maturity: draft_requirement_with_gap
    statement: >-
      When a required AEBS input is stale, missing, malformed, inconsistent, or
      unavailable under controlled input-health criteria, each SDV product-line
      member product shall enter the AEBS state selected by the controlled
      degraded-state mapping.
    derived_from:
      - N-AEBS-008
    source_links:
      - INC-AEBS-002
      - SRC-UNECE-R152
    applicability: candidate common AEBS degraded/unavailable state-transition behavior
    validation_reference: VAL-AEBS-008
    known_gaps:
