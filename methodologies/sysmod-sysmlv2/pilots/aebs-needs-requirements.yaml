verification_planning:
  status: planned_with_open_criteria
  ownership: System 2 verification and assurance workflow
  note: >-
    Methods, criteria, and evidence status are planning attachments, not normative
    content of the System 1 product requirement expressions.
  records:
    - requirements: [REQ-AEBS-001]
      method: analysis
      evidence_status: planned
      criterion_gap: "Define operating conditions, target conditions, and detection criteria."
    - requirements: [REQ-AEBS-002]
      method: demonstration
      evidence_status: planned
      criterion_gap: "Define warning conditions, timing, modality, and driver observability."
    - requirements: [REQ-AEBS-003]
      method: simulation
      evidence_status: planned
      criterion_gap: "Define activation conditions, braking command expectations, and override exclusions."
    - requirements: [REQ-AEBS-004]
      method: demonstration
      evidence_status: planned
      criterion_gap: "Define allowed override inputs and the controlled override-response mapping."
    - requirements: [REQ-AEBS-005]
      method: inspection
      evidence_status: gap
      criterion_gap: "Define failure modes, detection expectations, warning behavior, and safe-operation criteria."
    - requirements: [REQ-AEBS-006, REQ-AEBS-007, REQ-AEBS-S2-001]
      method: inspection
      evidence_status: planned
      criterion_gap: null
    - requirements: [REQ-AEBS-008, REQ-AEBS-012]
      method: test
      evidence_status: gap
      criterion_gap: "Define non-activation conditions, observation windows, tolerances, and false-reaction classification."
    - requirements: [REQ-AEBS-009, REQ-AEBS-013]
      method: test
      evidence_status: gap
      criterion_gap: "Define input-health criteria, state ownership, transition timing, indication, and safe-operation response."
    - requirements: [REQ-AEBS-010, REQ-AEBS-014]
      method: test
      evidence_status: gap
      criterion_gap: "Determine applicability and control pedestrian target definition, conditions, response, tolerances, and uncertainty."
    - requirements: [REQ-AEBS-011, REQ-AEBS-015]
      method: test
      evidence_status: gap
      criterion_gap: "Determine applicability and control bicycle target definition, conditions, response, tolerances, and uncertainty."

