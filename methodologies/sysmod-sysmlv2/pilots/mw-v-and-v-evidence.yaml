evidence_ladder:
  - layer: repository_and_sysml
    status: required
    claim: structural traceability and licensed SysML validity
  - layer: unit_and_contract_tests
    status: observed_bounded
    claim: provider-neutral conversion and exact reference-contract behavior
    artifacts:
      - implementation/vss-vehicle-speed-adapter/tests/test_adapter.py
      - implementation/aaos-sdv-reference-interop-bench/tests/test_reference_bench.py
  - layer: reference_rehearsal
    status: observed_bounded
    claim: DE4SDV-owned reference contract and observer behavior only
    artifact: implementation/aaos-sdv-reference-interop-bench
  - layer: aaos_cuttlefish_boot
    status: observed_bounded
    claim: pinned AAOS target build and bounded Cuttlefish bootability only
    artifact: implementation/aaos-sdv-reference-interop-bench/evidence/aaos-cuttlefish-cloud-proof.yaml
  - layer: target_runtime_interoperability
    status: observed_bounded_autoware_consumer
    claim: provider, discovery, direct VSIDL service egress, adapter, ROS 2 publication, independent observation, and real Autoware consumer consumption on the modeled two-VM deployment
    artifact: implementation/aaos-sdv-reference-interop-bench/evidence/e-mw-013-autoware-consumer.yaml
    blockers: [GAP-MW-019, GAP-MW-022, GAP-MW-027]
    scope: adapter path + real Autoware consumer observed (E-MW-012/013); full Autoware stack and production deployment decision remain open
  - layer: lifecycle_update_fault_validation
    status: partial_fault_observed
    claim: startup, update/OTA, health, and fault behavior on the configured member
    artifact: implementation/aaos-sdv-reference-interop-bench/evidence/e-mw-011-runtime-campaign.yaml
    blockers: [GAP-MW-028]
    scope: fault rejection observed (gate 7); lifecycle/update/health and reverse path not claimed (gate 8)

cloud_readiness:
  purpose: >-
    Use a Google Cloud VM as the System 2 build/run/evidence environment only
    after read-only project, quota, billing/credit, budget, shutdown, and host
    capability checks.
  candidate: google-cloud-x86_64-linux-nested-kvm
  required_capabilities:
    architecture: x86_64
    operating_system: Linux
    minimum_memory_gib: 64
    minimum_free_storage_gib: 400
    nested_kvm: true
    kvm_device: /dev/kvm
    target_runtime: AAOS Cuttlefish
  previous_baseline:
    artifact: implementation/aaos-sdv-reference-interop-bench/evidence/aaos-cuttlefish-cloud-proof.yaml
    status: observed_bounded_boot_baseline
    observed_memory: 62GiB
    observed_free_storage: 102GiB
    observed_kvm: present
    observed_target: sdv_core_cf-trunk_staging-userdebug
    interpretation: >-
      The previous host built and booted the pinned target but did not satisfy
      the current full-campaign resource envelope and did not provide framework,
      provider, transport, ROS 2, or Autoware interoperability evidence.
  provisioning_status: observed_bounded_campaign
  campaign_instance: de4sdv-aaos-build
  campaign_state_after: TERMINATED
  campaign_evidence: implementation/aaos-sdv-reference-interop-bench/evidence/mw-010-google-cloud-vsidlc-cuttlefish.yaml
  campaign_interpretation: >-
    The campaign proved the x86_64 host, VSIDL catalog compilation, generated
    service-bundle binding, and bounded Cuttlefish boot path. The selected
    target remains insufficient for provider registration, discovery,
    transport, ROS 2, Autoware, lifecycle, update, or fault evidence.
  cost_control_required:
    - bounded_run_duration
    - automatic_stop_or_termination
    - persistent_disk_review
    - no_unbounded_source_sync_or_build

trace_ids:
- verificationConfiguredMemberTrace
- verificationPhysicalBoundaryTrace
