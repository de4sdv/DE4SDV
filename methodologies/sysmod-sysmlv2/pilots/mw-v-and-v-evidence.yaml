claim_boundary:
  supported_now:
    - Phase 10 verification and validation plan
    - exact acceptance criteria and traceability
    - provider-neutral 36/72 kmh conversion evidence
    - reference contract rehearsal evidence
    - bounded AAOS/Cuttlefish build-and-boot baseline
    - E-MW-011 runtime campaign gates 1-7 on the modeled two-VM deployment
    - independent observer validation of 36 kmh -> 10.0 m/s on the exact ROS 2 topic
    - ingress rejection of non-valid envelopes (fault subset)
  not_supported_now:
    - production adapter-chain VSIDL provider binding or generated binding
    - production adapter-chain service discovery or cross-domain transport
    - Autoware-side provenance beyond the independent ROS 2 observer
    - lifecycle, update/OTA, or health runtime acceptance
    - reverse lifecycle/status path (gate 8)
    - safety, compliance, certification, homologation, or type approval

supporting_implementation:
  status: required-separate-change
  branch: feat/mw-vsidl-vehicle-speed-bridge
  scope: >-
    Implement the smallest direct Vehicle.Speed vertical slice needed to produce
    target-runtime evidence for AC-MW-010-01 and then extend only as required by
    lifecycle, health, startup, update, and fault scenarios.

validation:
  repository_checks: required
  smoke_test: required
  targeted_phase10_tests: required
  local_sysml_validation: architecture_blocked_on_arm64_host
  privileged_sysml_validation: required_before_ready_claim
  runtime_interoperability: blocked_until_supporting_implementation_and_independent_observer_exist

next_actions:
  - complete Phase 10 model review and repository gates
  - run read-only GCP project and host readiness checks
  - provision only a capability-qualified, budget-bounded VM
  - implement the direct Vehicle.Speed vertical slice on the separate branch
  - execute target-runtime evidence and update verdict statuses without rewriting the claim boundary
