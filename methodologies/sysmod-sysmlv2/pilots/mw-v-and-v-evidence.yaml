  - id: VC-MW-010-01
    name: Vehicle.Speed translation correctness
    scenario: signalTranslation
    requirement_ids: [REQ-MW-001]
    methods: [test, inspect, analyze]
    acceptance_criterion: AC-MW-010-01
    current_evidence:
      - implementation/vss-vehicle-speed-adapter/tests/test_adapter.py
      - implementation/aaos-sdv-reference-interop-bench/tests/test_reference_bench.py
    status: bounded_contract_and_rehearsal_only
    missing_evidence:
      - generated_or_usable_vsid_binding
      - deployed_provider
      - cross_domain_transport
      - independent_autoware_observation
  - id: VC-MW-010-02
    name: Lifecycle coordination
    scenario: lifecycleCoordination
    requirement_ids: [REQ-MW-003]
    methods: [test, inspect, analyze]
    acceptance_criterion: AC-MW-010-02
    status: planned_target_runtime_case
  - id: VC-MW-010-03
    name: Health forwarding
    scenario: healthForwarding
    requirement_ids: [REQ-MW-004, REQ-MW-002]
    methods: [test, inspect, analyze]
    acceptance_criterion: AC-MW-010-03
    status: planned_target_runtime_case
  - id: VC-MW-010-04
    name: Vehicle/application startup
    scenario: vehicleStartup
    requirement_ids: [REQ-MW-001, REQ-MW-003, REQ-MW-007]
    methods: [test, inspect, analyze]
    acceptance_criterion: AC-MW-010-04
    status: planned_target_runtime_case
  - id: VC-MW-010-05
    name: Update/OTA contract preservation
    scenario: updateCoordination
    requirement_ids: [REQ-MW-005]
    methods: [test, inspect, analyze]
    acceptance_criterion: AC-MW-010-05
    status: planned_target_runtime_case
  - id: VC-MW-010-06
    name: Middleware fault detection and containment
    scenario: faultDetection
    requirement_ids: [REQ-MW-004, REQ-MW-006, REQ-MW-008]
    methods: [test, inspect, analyze]
    acceptance_criterion: AC-MW-010-06
    status: planned_target_runtime_case

