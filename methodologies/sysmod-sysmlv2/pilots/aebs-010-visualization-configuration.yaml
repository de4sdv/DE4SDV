schema: de4sdv.aebs-010-visualization-configuration.v0
id: INC-AEBS-010
name: AEBS visualization on AAOS SDV — configured test article (Phase 9)
status: draft
type: FeatureIncrement
parent_increment: INC-AEBS-010
owner: DE4SDV maintainers

purpose: >-
  Phase 9 slice of the INC-AEBS-010 chain: the configured test article for
  the AEBS visualization. The accepted MW-CONFIG-001 reference member is
  reused unchanged by qualified reference and specialized with System 2
  visualization instrumentation. SysML owns configuration semantics; this
  YAML indexes configuration IDs, binding obligations, and status only.

configuration_decision:
  id: AEBS-CONFIG-010-001
  element: AEBSAutowareAAOSSDVVisualizationTestArticle
  decision: >-
    Specialize the accepted MiddlewareAutowareAAOSSDVConfiguredMember with the
    deployed Phase 8 visualization chain instead of creating a new member
    or BoF. All platform-stack and capability selections are inherited
    unchanged.
  reused_sources:
    - model-based-product-line-engineering/feature-configurations/middleware-autoware-aaos-sdv-reference.yaml
    - model-based-product-line-engineering/product-models/middleware_autoware_aaos_sdv_reference.sysml
  no_duplicate_bof: true
  no_new_product_feature: true

runtime_bindings:
  status: planned_obligations_not_executed_pins
  sysml_owner: >-
    textual-notation-of-model/packages/features/aebs/
    aebs_visualization_variability_configuration.sysml
  bindings:
    - "AO-AEBS-010-001 aosp_manifest_revision (pinned at implementation)"
    - "AO-AEBS-010-002 autoware_container_digest (from 009B runtime lock; pinned at implementation)"
    - "AO-AEBS-010-003 autoware_source_revision f603d8759c92fb2f423f1544844e13086d79ad09 (pinned at architecture)"
    - "AO-AEBS-010-004 visualization_transport_port (new port; not the INC-MW-010 port; pinned at implementation)"
    - "AO-AEBS-010-005 stale_timeout_s (bounded bench planning target 1.0 s; pinned at implementation)"
    - "AO-AEBS-010-006 restore_consecutive_frames (bounded bench planning target 3; pinned at implementation)"
    - "AO-AEBS-010-007 gateway_service_unit_name (pinned at implementation)"
    - "AO-AEBS-010-008 display_app_package (pinned at implementation)"
    - "AO-AEBS-010-009 bench_scenario scenario-009b-moving-vehicle-target.yaml (pinned at architecture)"

implementation_artifacts:
  planned_root: implementation/aebs-aaos-sdv-visualization-bench/
  created_this_slice:
    - implementation/aebs-aaos-sdv-visualization-bench/config/test-article.yaml
  created_by_implementation_slice:
    # Materialized by the INC-AEBS-010 implementation/evidence PRs; the
    # Phase 9 configuration slice no longer treats them as deferred.
    - interface/aebs_visualization.proto
    - src/de4sdv_aebs_010_bridge/
    - aosp/vendor/de4sdv/aebs_visualization/
    - scripts/
    - evidence/010/
  deferred_to_implementation_slice:
    - runtime-lock.yaml

claim_boundary: >-
  Planned test-article configuration only. No runtime evidence, preflight
  result, rendering proof, or requirement satisfaction is claimed. No product
  feature is added to any Bill-of-Features and no member-product behavior is
  changed.

model_artifacts:
  - id: MODEL-AEBS-010-VARIABILITY-CONFIGURATION-SYSML
    path: textual-notation-of-model/packages/features/aebs/aebs_visualization_variability_configuration.sysml
    status: draft

next_increment:
  id: INC-AEBS-010-implementation
  name: AEBS visualization implementation (bridge, ingress, application, campaign tooling)
  entry_condition: >-
    This configuration slice is reviewed and accepted, and the implementation
    slice binds all runtime-binding obligations to exact executed values.
