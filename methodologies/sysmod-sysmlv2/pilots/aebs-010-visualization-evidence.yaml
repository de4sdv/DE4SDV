known_limitations:
  - id: DEF-AEBS-S2-001
    limitation: >-
      The retained v21 take predates the presentation-scale geometry
      correction (forward-situation geometry PR): obstacle cluster could
      visually contact the ego silhouette under presentation-only ego
      enlargement. Retained observations stand for the displayed generation;
      they neither prove corrected geometry nor repeatable warning timing.
  - id: DEF-AEBS-S2-002
    limitation: >-
      Raw media for the retained campaign is held externally
      (maintainer_archive per external-media.yaml); independent byte-level
      re-review requires archive access. In-tree review is limited to
      retained logs, stills, and manifests.
  - id: DEF-AEBS-S2-003
    limitation: >-
      Warning timing repeatability is unproven: one take supports the
      observed_bounded lifecycle claim, not a deterministic warning-lead
      property (see GAP-AEBS-010-007 and the 009D warning-lead work).

scope:
  in_scope:
    - source-to-screen chain correlation on the live pinned-Autoware bench
    - reducer-driven lifecycle arc in one uninterrupted take
    - read-only boundary and no-vehicle-command evidence
    - display-derived versus native decision-semantics separation
    - fail-closed staleness suppression of display-derived geometry
    - fixture-path degraded-state rendering (PF-004 publisher)
    - planned restoration behavior (no retained evidence yet)
    - ArgumentationAssuranceViewpoint
  out_of_scope:
    - AEBS braking authority, hazard control, or any safety argument
    - certification, compliance, homologation, or type approval
    - production HMI or member-product behavior change
    - inter-VM transport without the bounded adb-reverse bench route
    - signed-policy enforcement (bench guest stays permissive)
    - post-release re-approach scenarios

