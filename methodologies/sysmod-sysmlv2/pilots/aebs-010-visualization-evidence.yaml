owner: DE4SDV maintainers

purpose: >-
  Index the retained verification evidence, bounded verdicts, open gaps, and
  claim-boundary semantics for the System 2 read-only AEBS visualization test
  system. SysML owns the acceptance and closure semantics
  (aebs_visualization_verification_evidence.sysml); this file records
  status, evidence locations, and execution facts only.

engineering_question: >-
  What retained evidence demonstrates that the read-only visualization
  instrumentation observed the live pinned-Autoware chain into the AAOS guest,
  rendered the reducer-driven four-state arc, preserved the display-derived
  versus native decision-semantics separation, and degraded fail-closed — and
  which claims stay deferred or not claimed?

lifecycle_decision_supported: >-
  Index the bounded Phase 10 evidence owned by the SysML slice without
  promoting restoration, live-degradation, inter-VM, production, safety, or
  certification scope.

