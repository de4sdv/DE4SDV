# O4 definition-admission batch 1 - governed admission document.
#
# ADMITTED (engineering evidence). The admitted family is DERIVED, not
# hand-picked: every retained, ungated, non-held O4 register row whose
# reviewed treatment carries model-side definition parity (a definitions-parity
# stage, or the parity completed by this admission's own model declaration),
# whose target requires BOTH a generated Semantic Projection row and an API
# Representation Profile entry, and which is not already admitted in another
# generated layer (O2 chain / O2+ / W4 carriers) or frozen in O3.
#
# Batch-1 amendment: Scenario joined the admitted set once its definition home
# (part def Scenario, de4sdv_operational_context.sysml) landed and its parity
# completed normalized-exact - the forward obligation recorded by the W2
# batch 7 bounded pattern grounding review.
#
# Machine-locked properties (tests, fail-closed):
#   * admitted set == the register-derived family above (drift fails);
#   * every declaration anchor resolves in its named file and owns
#     documentation; the model remains the documentation authority;
#   * live generation and exact regeneration checks use current sources,
#     without a Git-commit prerequisite or a copied definition-text oracle;
#   * no frozen O3 identity, no gated/held row, and no W4 carrier identity
#     may appear as an admitted row.
#
# Boundaries: generation reads authoritative governed model documentation.
# Historical parity reviews remain historical evidence. Admission is NOT
# authority transition (O3 owns that), NOT authored-YAML retirement (O4
# closure owns that), and NOT support promotion: every generated row stays
# vocabulary-only with traversal false and no API element identity claimed.

