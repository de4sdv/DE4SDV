# O4 definition-admission batch 2 - governed admission document.
#
# ADMITTED (engineering evidence). The admitted family is derived (tests,
# fail-closed, both directions); the exception is the method-admitted rows,
# which a reviewed method pull request admits and a test pins:
#   * every retained O4 register row (not O3-complete) that no other generated
#     layer projects (O2 chain, definition batch 1, O2+);
#   * every former authored-ontology class that is not an O4 register row
#     (successor classes and the trace-obligation declaration);
#   * the owner-approved W6 successor predicates hasValidationScenario and
#     hasRegulatorySource (allocatedTo is a register row), and the retired
#     name validatesFitnessForUse (merged register row with a model retirement
#     record);
#   * the method-admitted classes (accounting method-admitted): kernel classes
#     that a reviewed method pull request admitted after the authored
#     ontology's deletion, with no register row and no authored-ontology
#     comparison; their manifest fields are their reviewed contract. ADR 0022
#     (step S2k, pull request #402) admitted the five product-line derivation
#     classes DerivationRule, DerivedVariation, ProductModelProjection,
#     ProductModelProjectionName and UnassignedBindingTime;
#     tests/test_kernel_vocabulary_projection.py pins that set.
# Rows whose register entry is gated name, per gate, the governance record that
# resolved it (approved semantic decisions, ADR 0020, the October 2026 owner
# record, the W6 transition plan). Gates resolved here unblock ADMISSION
# (definition/representation generation) only; runtime support targets keep
# their forward obligations below.
#
# Machine-locked properties (generator and tests):
#   * every model home resolves in its named file (owner block, documentation
#     selected by name and index, named vocabulary-role comment with its about
#     targets, or successor retirement record); model-owned documentation is
#     authoritative, without a copied reviewed-definition oracle;
#   * live pairs regenerate exactly from current sources, without a Git
#     source-revision prerequisite; historical evidence stays unchanged;
#   * kernel mapping kinds, ontology relations, relationship
#     domain/range/strength and serializer mechanics are reviewed contract
#     fields held by this manifest, not model witnesses (owner decision D9);
#     they were proven equal to the authored ontology before its deletion, and
#     the generated rows label them with that comparison, archived at the
#     release-2026-10-11 tag (https://github.com/de4sdv/DE4SDV/blob/
#     release-2026-10-11/docs/method-conformance/o4/closure/contract-equivalence.json);
#   * successor rows equal the model successor relation records (set equality)
#     and carry their carrier ends; retired names resolve to exactly one
#     successor record; the hasRelevantEvidenceContract closure pins each
#     specialize the kernel EvidenceContract.
#
# Boundaries: admission is NOT production activation and NOT a traversal
# proof. The PLE configuration rows (decision-9) and the method-admitted
# derivation classes carry no configurator authority: the configuration
# authority follows ADR 0022. External-content rows carry no content.
# Retired names (owner decision D4) answer no fact: the runtime refuses
# them with "retired; use <successor>"; their model retirement records are
# kept.

