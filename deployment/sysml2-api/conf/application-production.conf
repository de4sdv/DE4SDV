# Production settings layered over the upstream application.conf.
# Only restart-safety and quietness differ from upstream; API behavior is
# untouched. The schema is created by Hibernate hbm2ddl.auto=update (patched
# in the image, see Dockerfile) and is never dropped on restart. The only
# database writer is the DE4SDV validated importer, which runs server-side.
include "application"

play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}

play.server.http.address = "0.0.0.0"
play.server.http.port = 9000

# Play's AllowedHostsFilter defaults to localhost-only; the proxy forwards
# requests with the upstream host header, so allow the proxy's upstream
# hostname (and localhost for in-container checks).
play.filters.hosts.allowed = ["localhost", "sysml2-api:9000", "sysml2-api"]

db {
  default {
    jndiName = DefaultDS
    username = ${?DB_USER}
    password = ${?DB_PASSWORD}
  }
}
