; kuksa-can-provider configuration for one DE4SDV zone.
; The entrypoint substitutes @@ZONE_DBC@@, @@ZONE_CHANNEL@@ and @@KUKSA_ADDRESS@@
; so the same file serves every zone.
[general]
address = @@KUKSA_ADDRESS@@
mapping = @@ZONE_MAPPING@@

[can]
port = @@ZONE_CHANNEL@@
dbcfile = @@ZONE_DBC@@
; dbc2val publishes frames the ECU sends into the databroker (value)
dbc2val = True
; val2dbc turns actuator_target writes into frames on this zone's bus only
val2dbc = True
