# Bill-of-Features: Autoware + AAOS SDV middleware reference member
#
# The application and middleware choices derive the adapter. The adapter is not
# independently selectable and therefore does not appear in this file.

name: MiddlewareAutowareAAOSSDVReference
description: >
  Planned Autoware + AAOS SDV middleware reference member on the Android/KVM
  SDV Core platform domain with LiDAR and camera perception. Autoware retains
  its ROS 2/Linux application runtime; cross-domain deployment and transport
  remain unresolved. This configuration and its projection do not prove
  provider, generated binding, discovery, transport, adapter deployment,
  ROS 2 publication, Autoware observation, safety, compliance, or runtime
  interoperability.

evidence:
  status: planned
  artifacts: []

selections:
  PlatformStack.VehicleApplication: Autoware
  PlatformStack.Middleware: AndroidSDV
  PlatformStack.OS: Android
  PlatformStack.Hypervisor: KVM

  Capabilities.ForwardCollisionMitigation.VehicleTargetAEBS: true
  Capabilities.ForwardCollisionMitigation.PedestrianDetection: false
  Capabilities.ForwardCollisionMitigation.BicycleDetection: false
  Capabilities.AdaptiveCruiseControl: false
  Capabilities.LaneKeepAssist: false

  SensingBoundary.PerceptionSensors: [LiDAR, Camera]
