# Bill-of-Features: Apollo on AUTOSAR Adaptive on QNX with QVM
# Member product of the DE4SDV SDV product line.
#
# Mixed-criticality architecture: QVM hypervisor hosting a QNX guest
# running AUTOSAR Adaptive middleware with the Apollo ADAS stack.

name: ApolloQNXQVMVariant
description: >
  Mixed-criticality reference configuration.
  Apollo (ADAS) on AUTOSAR Adaptive on QNX with QNX QVM hypervisor.
  Vehicle-target AEBS only.

selections:
  # Platform stack — alternative groups
  PlatformStack.VehicleApplication: Apollo
  PlatformStack.Middleware: AUTOSARAdaptive
  PlatformStack.OS: QNX
  PlatformStack.Hypervisor: QVM

  # Capabilities
  Capabilities.ForwardCollisionMitigation.VehicleTargetAEBS: true
  Capabilities.ForwardCollisionMitigation.PedestrianDetection: false
  Capabilities.ForwardCollisionMitigation.BicycleDetection: false
  Capabilities.AdaptiveCruiseControl: false
  Capabilities.LaneKeepAssist: false
