# DE4SDV SDV Product Line Feature Model
#
# This is the Feature Catalogue (ISO/IEC 26580 terminology).
# It defines what features exist, their hierarchical relationships,
# and cross-tree constraints. It is the single source of truth for
# what distinguishes member products in the DE4SDV product line.
#
# Relationship semantics:
#   mandatory   — parent selected → child must be selected
#   optional    — parent selected → child may be selected
#   alternative — exactly one child from the group (XOR)
#   or_group    — at least one child from the group (BoF value is a list)
#
# Mapping:
#   id              — stable feature identifier for configuration traceability
#   binding_time    — lifecycle phase at which the feature is resolved
#   maps_to         — SysML v2 variation-part path in the 150% model
#                     (e.g. "SDVPlatformStack.vehicleApplication")
#   maps_to_variant — SysML v2 variant name within that variation part
#                     (e.g. "autoware" matches "variant part autoware")
#
# This feature model is the decision layer. The SysML v2 base model
# (sdv_platform_stack.sysml) is the shared asset superset (150% model)
# whose platform-stack structural variation points the feature selections resolve.
# Capability selections remain catalogue/configuration information until they are
# linked to corresponding variable shared assets; they are not resolved by the
# current platform-stack generator.

projection:
  package: DE4SDV_SDVPlatformStack
  owner: SDVPlatformStack
  label: platform-stack

root:
  name: SDVProductLine
  id: PL-DE4SDV
  description: Software-defined vehicle product line

  children:
    # ── Platform stack (mandatory subtree) ──────────────────
    - name: PlatformStack
      id: F-PLATFORM-STACK
      type: mandatory
      description: >
        The layered computing platform. Exactly one realization
        per layer, subject to compatibility constraints.
      children:
        - name: VehicleApplication
          id: F-PLATFORM-VEHICLE-APPLICATION
          binding_time: design
          type: alternative
          maps_to: SDVPlatformStack.vehicleApplication
          children:
            - { name: Autoware, id: F-PLATFORM-VEHICLE-APPLICATION-AUTOWARE, binding_time: design, maps_to_variant: autoware }
            - { name: Openpilot, id: F-PLATFORM-VEHICLE-APPLICATION-OPENPILOT, binding_time: design, maps_to_variant: openpilot }
            - { name: Apollo, id: F-PLATFORM-VEHICLE-APPLICATION-APOLLO, binding_time: design, maps_to_variant: apollo }

        - name: Middleware
          id: F-PLATFORM-MIDDLEWARE
          binding_time: design
          type: alternative
          maps_to: SDVPlatformStack.middleware
          children:
            - { name: EclipseSCORE, id: F-PLATFORM-MIDDLEWARE-ECLIPSE-SCORE, binding_time: design, maps_to_variant: eclipseSCORE }
            - { name: AndroidSDV, id: F-PLATFORM-MIDDLEWARE-ANDROID-SDV, binding_time: design, maps_to_variant: androidSDV }
            - { name: AUTOSARAdaptive, id: F-PLATFORM-MIDDLEWARE-AUTOSAR-ADAPTIVE, binding_time: design, maps_to_variant: autosarAdaptive }
            - { name: None, id: F-PLATFORM-MIDDLEWARE-NONE, binding_time: design, maps_to_variant: none }

        - name: OS
          id: F-PLATFORM-OS
          binding_time: design
          type: alternative
          maps_to: SDVPlatformStack.osPlatform
          children:
            - { name: Linux, id: F-PLATFORM-OS-LINUX, binding_time: design, maps_to_variant: linux }
            - { name: Android, id: F-PLATFORM-OS-ANDROID, binding_time: design, maps_to_variant: android }
            - { name: QNX, id: F-PLATFORM-OS-QNX, binding_time: design, maps_to_variant: qnx }

        - name: Hypervisor
          id: F-PLATFORM-HYPERVISOR
          binding_time: design
          type: alternative
          maps_to: SDVPlatformStack.hypervisor
          children:
            - { name: QVM, id: F-PLATFORM-HYPERVISOR-QVM, binding_time: design, maps_to_variant: qvm }
            - { name: ACRN, id: F-PLATFORM-HYPERVISOR-ACRN, binding_time: design, maps_to_variant: acrn }
            - { name: KVM, id: F-PLATFORM-HYPERVISOR-KVM, binding_time: design, maps_to_variant: kvm }
            - { name: None, id: F-PLATFORM-HYPERVISOR-NONE, binding_time: design, maps_to_variant: none }

    # ── Sensing boundary ─────────────────────────────────────
    # Motion sensors are common capabilities (mandatory, not features).
    # Perception sensors are optional features that distinguish member
    # products. The or_group expresses multi-select: a product may have
    # any non-empty combination of LiDAR, radar, and camera.
    - name: SensingBoundary
      id: F-SENSING
      type: mandatory
      description: >
        Vehicle sensing boundary — physical sensors and perception
        pipeline. Motion sensors are common; perception sensors are
        optional features.
      children:
        - name: MotionSensors
          id: C-SENSING-MOTION
          type: mandatory
          description: >
            Common capability (ISO/IEC 26580): IMU and wheel odometry
            are required across all member products. Not a feature.
        - name: PerceptionSensors
          id: F-SENSING-PERCEPTION
          type: or_group
          description: >
            At least one perception sensor must be selected. A product
            may have any combination of LiDAR, radar, and camera.
            These are capability-level selections; the SysML v2 model
            uses independent include/exclude variation parts ([0]/[1]
            multiplicity) per sensor, not a single exclusive-choice
            variation. The configurator annotates which sensors are
            enabled in the product-model projection.
          children:
            - { name: LiDAR, id: F-SENSING-PERCEPTION-LIDAR, binding_time: design, type: optional }
            - { name: Radar, id: F-SENSING-PERCEPTION-RADAR, binding_time: design, type: optional }
            - { name: Camera, id: F-SENSING-PERCEPTION-CAMERA, binding_time: design, type: optional }

    # ── Vehicle capabilities ────────────────────────────────
    # Common capabilities are required across all member products
    # and are NOT features per ISO/IEC 26580. Optional capabilities
    # that distinguish member products ARE features.
    - name: Capabilities
      id: F-CAPABILITIES
      type: mandatory
      description: Vehicle-domain capabilities (common + optional)
      children:
        - name: ForwardCollisionMitigation
          id: C-CAPABILITY-FORWARD-COLLISION-MITIGATION
          type: mandatory
          description: >
            Common capability (ISO/IEC 26580): required across
            member products, not a feature.
          children:
            - name: VehicleTargetAEBS
              id: C-CAPABILITY-AEBS-VEHICLE-TARGET
              type: mandatory
              description: >
                Vehicle-target AEBS — common baseline
                (UNECE R152 scope).

            - name: PedestrianDetection
              id: F-CAPABILITY-AEBS-PEDESTRIAN-DETECTION
              binding_time: unassigned
              type: optional
              description: >
                Pedestrian-target AEBS — optional feature candidate.
                Currently deferred in the SysML v2 model
                (DeferredProductLineScope).

            - name: BicycleDetection
              id: F-CAPABILITY-AEBS-BICYCLE-DETECTION
              binding_time: unassigned
              type: optional
              description: >
                Bicycle-target AEBS — optional feature candidate.
                Currently deferred in the SysML v2 model
                (DeferredProductLineScope).

        # Optional features — these distinguish member products
        - name: AdaptiveCruiseControl
          id: F-CAPABILITY-ADAPTIVE-CRUISE-CONTROL
          binding_time: unassigned
          type: optional
          description: ACC feature candidate — not yet modeled in SysML v2.

        - name: LaneKeepAssist
          id: F-CAPABILITY-LANE-KEEP-ASSIST
          binding_time: unassigned
          type: optional
          description: LKA feature candidate — not yet modeled in SysML v2.

# ── Cross-tree constraints ─────────────────────────────────
# These formalize the doc-only constraint defs in
# sdv_platform_stack.sysml. Each constraint is evaluated against
# the Bill-of-Features selections.
#
# Syntax:
#   requires:  if <condition> then <target> must hold
#   excludes:  if <condition> then <target> must not hold
#   <condition> and <target> use dotted paths from the feature tree root.
#   'in' checks membership in a list.
#   '==' and '!=' check equality.
constraints:
  # Platform stack compatibility rules
  - id: C001
    type: requires
    if: PlatformStack.Middleware == EclipseSCORE
    then: PlatformStack.OS in [Linux, QNX]
    rationale: >
      Eclipse S-CORE targets Linux and QNX, not Android HLOS.
      Source: MiddlewareOSCompatibility constraint def.

  - id: C002
    type: requires
    if: PlatformStack.Middleware == AndroidSDV
    then: PlatformStack.OS in [Linux, Android, QNX]
    rationale: >
      Android SDV runs on Linux, Android HLOS, or as QVM guest.
      Source: MiddlewareOSCompatibility constraint def.

  - id: C003
    type: requires
    if: PlatformStack.Middleware == AUTOSARAdaptive
    then: PlatformStack.OS in [Linux, QNX]
    rationale: >
      AUTOSAR Adaptive runs on Linux or QNX.
      Source: MiddlewareOSCompatibility constraint def.

  - id: C004
    type: excludes
    if: PlatformStack.Hypervisor == ACRN
    then: PlatformStack.OS == QNX
    rationale: >
      ACRN does not support QNX as guest.
      Source: HypervisorOSCompatibility constraint def.

  - id: C005
    type: excludes
    if: PlatformStack.Hypervisor == KVM
    then: PlatformStack.OS == QNX
    rationale: >
      KVM QNX guest support is community-only, not production.
      Source: HypervisorOSCompatibility constraint def.

  # Capability-level constraints
  - id: C006
    type: requires
    if: Capabilities.ForwardCollisionMitigation.PedestrianDetection
    then: Capabilities.ForwardCollisionMitigation.VehicleTargetAEBS
    rationale: >
      Pedestrian detection builds on the vehicle-target AEBS baseline.
