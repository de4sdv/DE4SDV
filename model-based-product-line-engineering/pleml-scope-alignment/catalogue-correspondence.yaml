# Catalogue correspondence of the PLE-S comparison oracle
# (scripts/compare_ple_scope_alignment.py).
#
# Each entry names, for one node of the operational YAML catalogue (by its
# stable id), the governed-scope element it restates. It carries no
# classification: whether that element is common, reference-only, deferred or
# excluded is read from the serialized governed-scope validation of the
# licensed run, and the oracle refuses an entry whose node is not in the
# catalogue or whose element is not in the serialization. Nodes whose
# shared-asset variant the PLE-S model binds to an admitted alternative, or
# records as the superset realization of common content, need no entry: the
# serialized graph classifies them. A null element (with a note) states that
# the governed scope has no element for the node.
#
# This file is experiment input, not an authority: it does not admit anything
# and changes nothing in the catalogue, the configurations or the configurator.

schema: de4sdv.ple-scope-alignment-catalogue-correspondence/v1
catalogue: model-based-product-line-engineering/feature-models/sdv_product_line.yaml
governed_scope: model-based-product-line-engineering/scoping/de4sdv_aebs_product_line_scope.sysml

correspondence:
  # Driving stack: the catalogue selects the application as a feature; the
  # governed scope keeps Autoware common and defers driving-stack variability.
  - node: F-PLATFORM-VEHICLE-APPLICATION
    governed: drivingStackVariability
  - node: F-PLATFORM-VEHICLE-APPLICATION-OPENPILOT
    governed: openpilot
  - node: F-PLATFORM-VEHICLE-APPLICATION-APOLLO
    governed: apollo

  # Middleware alternatives the governed scope keeps reference-only.
  - node: F-PLATFORM-MIDDLEWARE-ECLIPSE-SCORE
    governed: eclipseSCORE
  - node: F-PLATFORM-MIDDLEWARE-AUTOSAR-ADAPTIVE
    governed: autosarAdaptive

  # Operating systems: Linux restates the common Linux/ROS 2 Autoware runtime;
  # QNX is the reference-only QNX/QVM pair.
  - node: F-PLATFORM-OS-LINUX
    governed: linuxROS2AutowareRuntime
  - node: F-PLATFORM-OS-QNX
    governed: qnxQVM

  # Hypervisors the governed scope keeps reference-only.
  - node: F-PLATFORM-HYPERVISOR-QVM
    governed: qnxQVM
  - node: F-PLATFORM-HYPERVISOR-ACRN
    governed: acrn

  # Sensing: LiDAR, camera and the motion sensors are the common baseline; the
  # catalogue's perception-sensor choice, and radar, are deferred variability.
  - node: F-SENSING-PERCEPTION
    governed: sensingVariability
  - node: F-SENSING-PERCEPTION-LIDAR
    governed: currentSensingBaseline
  - node: F-SENSING-PERCEPTION-CAMERA
    governed: currentSensingBaseline
  - node: F-SENSING-PERCEPTION-RADAR
    governed: sensingVariability
  - node: C-SENSING-MOTION
    governed: currentSensingBaseline

  # Capabilities: vehicle-target AEBS is common; the pedestrian and bicycle
  # expansions are deferred AEBS capability variability; adaptive cruise
  # control and lane-keep assist have no governed-scope element at all.
  - node: C-CAPABILITY-AEBS-VEHICLE-TARGET
    governed: vehicleTargetAEBS
  - node: F-CAPABILITY-AEBS-PEDESTRIAN-DETECTION
    governed: expandedAEBSCapabilityVariability
  - node: F-CAPABILITY-AEBS-BICYCLE-DETECTION
    governed: expandedAEBSCapabilityVariability
  - node: F-CAPABILITY-ADAPTIVE-CRUISE-CONTROL
    governed: null
    note: no governed-scope element; the catalogue lists it as an unmodeled feature candidate
  - node: F-CAPABILITY-LANE-KEEP-ASSIST
    governed: null
    note: no governed-scope element; the catalogue lists it as an unmodeled feature candidate
