    concern def MethodStackConcern: method-specific concern type
    concern def ProductLineConfigurationConcern: method-specific concern type
    concern def ProductModelAssemblyConcern: method-specific concern type
    viewpoint def IncrementFramingViewpoint: method-specific viewpoint type
    viewpoint def ProductLineClassificationViewpoint: method-specific viewpoint type
    viewpoint def RegulatoryScopeViewpoint: method-specific viewpoint type
    viewpoint def ProductLineConfigurationViewpoint: method-specific viewpoint type
    viewpoint def ProductModelAssemblyViewpoint: method-specific viewpoint type
