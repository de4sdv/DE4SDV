# Kernel-internal declarations of the governed DE4SDV method kernel.
#
# Owner decision D3 (2026-10-07): the justified kernel-internal declarations
# (governed kernel declarations that are deliberately not projected
# vocabulary) are gate accounting, kept in this governance manifest, not in
# model comments. The model-projection coverage gate
# (de4sdv/semantic/model_projection_coverage.py) reads it: every governed
# declaration must be projected by a model-generated layer or listed here
# with a non-empty reason; a listed declaration must exist, stay inside the
# governed directory and must not also be projected.
#
# Transition (O4 Wave C1 to C2): the authored ontology still carries the same
# list. The coverage gate refuses any difference between the two until O4
# Wave C2 deletes the authored list; this file is then the only home.
# Authored governance data; not generated, no binding block.
schema: de4sdv.kernel-internal-declarations/v1
governed_directory: textual-notation-of-model/packages/methods/de4sdv
declarations:
  textual-notation-of-model/packages/methods/de4sdv/de4sdv_method_conformance.sysml:
    item def MethodEvaluationExclusion: scope-internal structured exclusion record (excluded element reference
      plus rationale), owned by MethodEvaluationScope; not an additional ontology class or contribution
      membership
  textual-notation-of-model/packages/methods/de4sdv/de4sdv_method_concerns_and_viewpoints.sysml:
    concern def ProductLineCapabilityClassificationConcern: method-specific concern type
