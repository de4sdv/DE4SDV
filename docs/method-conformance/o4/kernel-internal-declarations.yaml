# Kernel-internal declarations of the governed DE4SDV method kernel.
#
# Owner decision D3 (2026-10-07): the justified kernel-internal declarations
# (governed kernel declarations that are deliberately not projected
# vocabulary) are gate accounting, kept in this governance manifest, not in
# model comments. The model-projection coverage gate
# (de4sdv/semantic/model_projection_coverage.py) reads it: every governed
# declaration must be projected by a model-generated layer or listed here
# with a non-empty reason; a listed declaration must exist, stay inside the
# governed directory and must not also be projected (class pin or
# relationship-carrier pin): projected and listed are a disjoint union.
#
# Since O4 Wave C2 (authored ontology deleted) this file is the only home of
# these declarations. Wave C2 removed the six relationship-carrier pins that
# C1 carried over from the authored list (HasStakeholder, AddressesConcern,
# ProducesView, RecordsAssumption, RecordsGap, SelectedViewpoint): each is
# projected through a model-generated layer (definition batch 2 or the
# vocabulary-carrier layer), so listing it here would give it a second home.
# Authored governance data; not generated, no binding block.
schema: de4sdv.kernel-internal-declarations/v1
governed_directory: textual-notation-of-model/packages/methods/de4sdv
declarations:
  textual-notation-of-model/packages/methods/de4sdv/de4sdv_method_conformance.sysml:
    item def MethodEvaluationExclusion: scope-internal structured exclusion record (excluded element reference
      plus rationale), owned by MethodEvaluationScope; not an additional ontology class or contribution
      membership
  textual-notation-of-model/packages/methods/de4sdv/de4sdv_increment_workflow.sysml:
    metadata def MethodCheck: method-rule annotation of a workflow step parameter (check identifier, minimum,
      advisory); evaluation-policy data, not an ontology class or a result status
    part def IncrementCharter: increment charter declaration specializing IncrementTraceObligations with owner,
      expected artifacts and expected review evidence as plain attributes; declaration helper, not an additional
      ontology class or completion evidence
    action def IncrementStep: abstract increment-workflow step carrying the method phase it performs; method
      structure, not an ontology class
    action def IncrementWorkflow: increment workflow (method steps in order with their artifact flows); method
      structure, not an ontology class or an executed process
    action def FrameIncrement: increment-workflow step definition (method structure with phase and artifact
      parameters); not an ontology class
    action def FrameConcerns: increment-workflow step definition (method structure with phase and artifact
      parameters); not an ontology class
    action def SpecifyOperationalContext: increment-workflow step definition (method structure with phase and
      artifact parameters); not an ontology class
    action def ClassifyCapabilities: increment-workflow step definition (method structure with phase and
      artifact parameters); not an ontology class
    action def ElaborateNeeds: increment-workflow step definition (method structure with phase and artifact
      parameters); not an ontology class
    action def SpecifyRequirements: increment-workflow step definition (method structure with phase and artifact
      parameters); not an ontology class
    action def DefineFunctionalArchitecture: increment-workflow step definition (method structure with phase and
      artifact parameters); not an ontology class
    action def DefineLogicalArchitecture: increment-workflow step definition (method structure with phase and
      artifact parameters); not an ontology class
    action def DefinePhysicalRealization: increment-workflow step definition (method structure with phase and
      artifact parameters); not an ontology class
    action def DefineVariabilityAndConfiguration: increment-workflow step definition (method structure with
      phase and artifact parameters); not an ontology class
    action def PlanVerificationAndEvidence: increment-workflow step definition (method structure with phase and
      artifact parameters); not an ontology class
    action def PublishIncrement: increment-workflow step definition (method structure with phase and artifact
      parameters); not an ontology class
    action def DecideBaselineAndNextSlice: increment-workflow step definition (method structure with phase and artifact
      parameters); not an ontology class
  textual-notation-of-model/packages/methods/de4sdv/de4sdv_method_concerns_and_viewpoints.sysml:
    concern def ProductLineCapabilityClassificationConcern: method-specific concern type
    concern def RegulatoryScopeWithoutComplianceClaimConcern: method-specific concern type
