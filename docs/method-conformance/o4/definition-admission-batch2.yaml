# O4 definition-admission batch 2 - governed admission document.
#
# ADMITTED (engineering evidence). The admitted family is DERIVED, not
# hand-picked (tests, fail-closed, both directions):
#   * every retained O4 register row (not O3-complete) that no other generated
#     layer projects (O2 chain, definition batch 1, O2+, W4 carriers);
#   * every former authored-ontology class that is not an O4 register row
#     (successor and scoped-assurance classes);
#   * the owner-approved W6 successor predicates hasValidationScenario and
#     hasRegulatorySource (allocatedTo is a register row), and the retired
#     name validatesFitnessForUse (merged register row with a model retirement
#     record).
# Rows whose register entry is gated name, per gate, the governance record that
# resolved it (approved semantic decisions, ADR 0020, the October 2026 owner
# record, the W6 transition plan). Gates resolved here unblock ADMISSION
# (definition/representation generation) only; runtime support targets keep
# their forward obligations below.
#
# Machine-locked properties (generator and tests):
#   * every model home resolves in its named file (owner block, documentation
#     selected by name and index, named vocabulary-role comment with its about
#     targets, or successor retirement record), and documentation homes are
#     normalized-exact against reviewed_definition;
#   * kernel mapping kinds, ontology relations, relationship
#     domain/range/strength and serializer mechanics are reviewed contract
#     fields held by this manifest, not model witnesses (owner decision D9);
#     they were proven equal to the authored ontology before its deletion in
#     O4 Wave C2 and tests lock them to that evidence
#     (docs/method-conformance/o4/closure/contract-equivalence.json);
#   * successor rows equal the model successor relation records (set equality)
#     and carry their carrier ends; retired names resolve to exactly one
#     successor record; the hasRelevantEvidenceContract closure pins each
#     specialize the kernel EvidenceContract.
#
# Boundaries: admission is NOT production activation and NOT a traversal
# proof. PLE configuration rows carry no configurator authority (decision-9,
# ADR 0006). External-content rows carry no content. Retired names (owner
# decision D4) answer no fact: the runtime refuses them with "retired; use
# <successor>"; their model retirement records are kept.

schema: de4sdv.o4-definition-admission-batch2/v1
status: admitted
warning: >-
  Admission is bounded to definition/representation generation from the
  model-resident homes. No traversal proof, no runtime read by the artifact,
  no authority retirement, no external-content absorption, no configurator
  authority.

exceptions:
- identity: IncrementTraceabilityShell
  accounting: merged
  reason: >-
    Merged register row (successor IncrementTraceObligations, admitted in this
    batch). Its historical documentation stays in DE4SDV_MethodTraces; no
    projection row is generated for a merged trace shell. Since O4 Wave C2 the
    runtime refuses the name with its register disposition (owner decision D5).
- identity: derivesNeedFromConcern
  accounting: removed
  reason: >-
    Removed register row (O1 c4: retired without replacement). It has no model
    home by design. Since O4 Wave C2 the runtime refuses the name with its
    register disposition (owner decision D5; an intentional migration from the
    former preserved gap).

