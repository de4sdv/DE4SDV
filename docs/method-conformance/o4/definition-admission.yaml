excluded:
  - identity: Scenario
    reason: >-
      Bounded pattern grounding only (W2 batch 7): no model-side declaration
      exists, definition-level parity stays open, and the register's own
      treatment is the operational-context pattern - not a definition row.
  - identity: ArchitectureDecisionRecord
    reason: >-
      External-boundary row (W5). The canonical review/register require NO
      projection and NO API profile (projection_required False,
      api_profile_required False, runtime support external); content authority
      stays external. The generic O1 residual string mentioning O2 admission
      conflicts with the structured flags and is recorded for bounded review,
      not silently resolved here.
  - identity: Baseline
    reason: >-
      Same conflict and disposition as ArchitectureDecisionRecord: structured
      flags say external boundary with no projection/profile requirement.
  - identity: IncrementSize
    reason: >-
      Vocabulary-only W3 row; its target requires neither a projection row
      nor a profile entry (register flags False/False).
  - identity: recordsGap, recordsAssumption, addressesConcern, selectedViewpoint, producesView
    reason: >-
      Already admitted through the W4 vocabulary-carrier pair
      (vocabulary-carriers-projection.json / -profile.json).
  - identity: <frozen O3 13 and every gated/W7-held/merged/removed row>
    reason: >-
      Excluded by the machine-checked family rule (frozen 13; owner-decision
      gates or row blockers; not o4-target).
