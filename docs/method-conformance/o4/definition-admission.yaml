# O4 definition-admission batch 1 - governed admission document.
#
# ADMITTED (engineering evidence). The admitted family is DERIVED, not
# hand-picked: every retained, ungated, non-held O4 register row whose
# reviewed stage is a definitions-parity treatment with model-side definition
# support, whose target requires BOTH a generated Semantic Projection row and
# an API Representation Profile entry, and which is not already admitted in
# another generated layer (O2 chain / O2+ / W4 carriers) or frozen in O3.
#
# Machine-locked properties (tests, fail-closed):
#   * admitted set == the register-derived family above (drift fails);
#   * every declaration anchor resolves in its named file, and the model
#     documentation observation recomputed from the model equals
#     ``expected_documentation_observation``;
#   * a ``differs`` observation requires a recorded ``reviewed-equivalent``
#     bounded review; ``normalized-exact`` requires a null equivalence;
#   * no frozen O3 identity, no gated/held row, and no W4 carrier identity
#     may appear as an admitted row.
#
# Boundaries: generation reads the governed model documentation; the
# reviewed definition below is the parity oracle only. Admission is NOT
# authority transition (O3 owns that), NOT authored-YAML retirement (O4
# closure owns that), and NOT support promotion: every generated row stays
# vocabulary-only with traversal false and no API element identity claimed.

schema: de4sdv.o4-definition-admission/v1
status: admitted
warning: >-
  Admission is bounded to definition/representation generation from the
  reviewed model representation. Support stays vocabulary-only; no traversal,
  no runtime read, no authority retirement, no external-content absorption.

