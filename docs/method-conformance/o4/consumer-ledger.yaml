  authority
warning: 'Authored governance data (not generated). Detects every tracked file that
  references the authored ontology authority or its KernelContract machinery, case-insensitively,
  all file types, full content. Fail-closed: set drift in either direction, marker
  drift, unknown roles/statuses, or live consumption by a ''retired'' row fails the
  repository check. Do NOT set any row to ''retired'' until its consumers are migrated
  and its rows are closed; this ledger does not authorize deletion of the authored
  YAML.'
