# O2.3 Semantic Projection extension admission boundary (machine-locked reviewed migration boundary).
#
# This manifest is GOVERNANCE data: it records WHICH identities the O2.3
# additive generation stage may emit. It supplies NO engineering semantics —
# every generated semantic field is derived exclusively from the reviewed
# representation contract and the governed model representation, never from
# this file and never from any O1/K review artifact.
#
# Provenance of the admission decision: the merged O1 reviewed governance on
# main (PR #249) admitted the overall O2 set (13 identities) with its
# sequencing; O2.1 (PR #250/#252) published the seven c1 identities; O2.2
# (PR #253/#254) published the three settled c2/c3 identities. This manifest
# encodes the reviewed o2.3 sequencing phase as a deterministic boundary; it
# does not reinterpret it.
#
# Machine locks (enforced by de4sdv/semantic/projection_o23.py and its tests):
#   * `admitted` is EXACTLY the three final O2 identities (the K derivation
#     pair and bounded architecture relevance) — an extra admission is a
#     generation failure, a missing admitted identity is a generation
#     failure;
#   * `sequencing` (o2.1 + o2.2 + o2.3) is EXACTLY the 13-identity overall O2
#     admission, imported from the frozen O2.1 lock;
#   * the cumulative O2 semantic surface (o2.1 seven + o2.2 three + o2.3
#     three) is exactly thirteen distinct identities;
#   * no identity may appear in both `admitted` and `guarded`;
#   * `guarded` equals the frozen guard set (the O2.1 seven and the O2.2
#     three — never re-emitted or re-bound by the extension — plus every
#     O2.1-guarded identity);
#   * the generator emits exactly the `admitted` set and asserts that no
#     guarded identity appears in O2.3 output;
#   * the emission path iterates ONLY `admitted` — new ontology/model entries
#     cannot expand the output (there is no heuristic query, no "all c5
#     rows", no "all derivation-looking declarations" filter).
#
# Generation is not authority activation: these rows do not switch runtime
# dispatch, do not retire authored contract authority, and do not promote
# support (the K slice's retained closure run at its own earlier revision
# does not promote current support). O3 owns authority transition; O4 owns
# authored-ontology retirement.

schema: de4sdv.o2-3-admission/v1
status: reviewed O2.3 migration boundary (additive generation stage)
base_revision: b948c7fb6983f0d3b9a71063cdf787fcc7b36f3a

#: The exact three final O2 identities this stage generates.
admitted:
  - derivesRequirementFromNeed
  - derivedRequirementsOfNeed
  - hasRelevantArchitecture

#: The complete reviewed O2 admission (13 identities) and its
#: sequencing. This is the final O2 generation stage.
sequencing:
  o2.1:
    - MethodPhase
    - MethodContractObligation
    - EvaluationScopeMembership
    - EvaluationSourceKind
    - TestedScopeDeclaration
    - RetainedExecutionRecordReference
    - AcceptanceAttestationReference
  o2.2:
    - VerificationCase
    - hasSubject
    - verifiedBy
  o2.3:
    - derivesRequirementFromNeed
    - derivedRequirementsOfNeed
    - hasRelevantArchitecture

#: Identities that must NOT appear in O2.3 output, with the reviewed reason.
#: The O2.1 seven and the O2.2 three are guarded because the extension is
#: additive: they remain published in the immutable v1/v1.1 baselines and are
#: never re-emitted or re-bound. Blocked is not the same as absent; retired is
#: not the same as unsupported; rename-required is not the same as
#: application-semantic admitted; and a reviewed text equivalence is not a
#: structural admission.
guarded:
  - identity: MethodPhase
    kind: class
    reason: "already published in the immutable O2.1 baseline (semantic-projection-v1.json, bound to the permanent Stage A revision); the O2.3 extension must not re-emit or re-bind it"
  - identity: MethodContractObligation
    kind: class
    reason: "already published in the immutable O2.1 baseline (semantic-projection-v1.json, bound to the permanent Stage A revision); the O2.3 extension must not re-emit or re-bind it"
  - identity: EvaluationScopeMembership
    kind: class
    reason: "already published in the immutable O2.1 baseline (semantic-projection-v1.json, bound to the permanent Stage A revision); the O2.3 extension must not re-emit or re-bind it"
  - identity: EvaluationSourceKind
    kind: class
    reason: "already published in the immutable O2.1 baseline (semantic-projection-v1.json, bound to the permanent Stage A revision); the O2.3 extension must not re-emit or re-bind it"
  - identity: TestedScopeDeclaration
    kind: class
    reason: "already published in the immutable O2.1 baseline (semantic-projection-v1.json, bound to the permanent Stage A revision); the O2.3 extension must not re-emit or re-bind it"
  - identity: RetainedExecutionRecordReference
    kind: class
    reason: "already published in the immutable O2.1 baseline (semantic-projection-v1.json, bound to the permanent Stage A revision); the O2.3 extension must not re-emit or re-bind it"
  - identity: AcceptanceAttestationReference
    kind: class
    reason: "already published in the immutable O2.1 baseline (semantic-projection-v1.json, bound to the permanent Stage A revision); the O2.3 extension must not re-emit or re-bind it"
  - identity: VerificationCase
    kind: class
    reason: "already published in the immutable O2.2 baseline (semantic-projection-v1.1.json, bound to the permanent Stage A revision); the O2.3 extension must not re-emit or re-bind it"
  - identity: hasSubject
    kind: relationship
    reason: "already published in the immutable O2.2 baseline (semantic-projection-v1.1.json, bound to the permanent Stage A revision); the O2.3 extension must not re-emit or re-bind it"
  - identity: verifiedBy
    kind: relationship
    reason: "already published in the immutable O2.2 baseline (semantic-projection-v1.1.json, bound to the permanent Stage A revision); the O2.3 extension must not re-emit or re-bind it"
  - identity: MethodEvaluationScope
    kind: class
    reason: "documentation equivalence reviewed, but the structural exclusions-with-rationale gap remains open; O2 generates only from settled structural representation"
  - identity: DerivesFromNeed
    kind: class
    reason: "class-definition equivalence review remains separate; the accepted K relationship semantics are unaffected and no O2.3 class row may be generated"
  - identity: derivesNeedFromConcern
    kind: relationship
    reason: "retired without replacement (O1 c4); a retired identity is not absent and must not be emitted"
  - identity: realizedBy
    kind: relationship
    reason: "rename/replacement resolution required (O1 c5); rename-required is not application-semantic admitted"
  - identity: specifiesFunction
    kind: relationship
    reason: "rename/replacement resolution required (O1 c5); rename-required is not application-semantic admitted"
  - identity: hasRelevantEvidenceContract
    kind: relationship
    reason: "blocked: EvidenceContract-specific identity is not machine-resolvable; a blocked identity is not absent and must not be emitted"
  - identity: EvidenceContract
    kind: class
    reason: "blocked scope (O1 c5); EvidenceContract identity remains unresolved and is excluded from the bounded O2.3 scope"
  - identity: ArchitectureElement
    kind: class
    reason: "excluded from the bounded O2.3 scope: application-semantic umbrella with no kernel binding; its range meaning is carried by the hasRelevantArchitecture row contract, not by a class row"
  - identity: Function
    kind: class
    reason: "excluded from the bounded O2.3 scope: no settled representation admission in O1 for this generation stage"
  - identity: LogicalElement
    kind: class
    reason: "excluded from the bounded O2.3 scope: no settled representation admission in O1 for this generation stage"
  - identity: PhysicalElement
    kind: class
    reason: "excluded from the bounded O2.3 scope: no settled representation admission in O1 for this generation stage"
  - identity: Interface
    kind: class
    reason: "excluded from the bounded O2.3 scope: no settled representation admission in O1 for this generation stage"
  - identity: allocatedTo
    kind: relationship
    reason: "PLE/allocation scope not admitted for bounded generation; hasRelevantArchitecture must not collapse the canonical RFLP chain"
  - identity: deployedTo
    kind: relationship
    reason: "deployment scope not admitted for bounded generation; deployment and realization identities remain separately reviewed"
