name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Bench evidence-validation tests verify repository-history invariants
          # (retained-run ancestry / reviewed squash relations) that need the
          # real commit graph, not a depth-1 checkout.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Explain public validation scope
        run: |
          echo "Public CI runs repository and smoke checks without licensed tools or repository secrets."
          echo "Licensed Syside validation is maintainer-triggered after initial PR review."
          echo "Contributors with Syside access may validate locally with the Syside Editor VS Code extension."

      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          PyYAML==6.0.2 pytest sysand==0.1.0 -r requirements-mcp.txt

      - name: Sync pinned SysML dependencies
        run: sysand sync

      - name: Run repository checks
        run: python scripts/check_repo.py

      - name: Check documentation local links
        run: python tools/check_markdown_links.py

      - name: Run full project test suite
        run: python -m pytest tests -q

      - name: Run bench unit/contract suites (isolated per bench)
        run: python tools/run_bench_unit_tests.py

      - name: Run smoke tests
        run: python scripts/smoke_test.py
