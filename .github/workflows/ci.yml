name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# A newer push to a pull request cancels its superseded run. A push to main
# is never cancelled: each push run has its own group (its run id), so it is
# neither cancelled nor queued behind another run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Bench evidence-validation tests verify repository-history invariants
          # (retained-run ancestry / reviewed squash relations) that need the
          # real commit graph, not a depth-1 checkout.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Explain public validation scope
        run: |
          echo "Public CI runs repository and smoke checks without licensed tools or repository secrets."
          echo "Licensed Syside validation is maintainer-triggered after initial PR review."
          echo "Contributors with Syside access may validate locally with the Syside Editor VS Code extension."

      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          PyYAML==6.0.2 pytest sysand==0.1.0 -r requirements-mcp.txt

      - name: Sync pinned SysML dependencies
        run: sysand sync

      # PLEML from the production lock: the byte check against the committed
      # record of the release tag, and the release diff of the pin (fast or
      # full path).
      - name: Byte-check the pinned PLEML package
        run: python scripts/check_pleml_package.py --release-diff

      # The parity of the PLEML receipts with the YAML path (ADR 0022, plan
      # step S4), which gates every step until S7: every parity row, the
      # plan's histogram and the seven normalised projection bodies, from the
      # committed receipts and the YAML, unlicensed. It replays the receipts,
      # so it runs after the pinned package is byte-checked.
      - name: Check the PLEML parity with the YAML path
        run: python scripts/check_pleml_parity.py

      - name: Run repository checks
        run: python scripts/check_repo.py

      - name: Check documentation local links
        run: python tools/check_markdown_links.py

      - name: Run full project test suite
        run: python -m pytest tests -q

      - name: Run bench unit/contract suites (isolated per bench)
        run: python tools/run_bench_unit_tests.py

      - name: Run smoke tests
        run: python scripts/smoke_test.py
