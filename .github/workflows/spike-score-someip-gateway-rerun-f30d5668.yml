# DE4SDV throwaway spike (INC-MW-011 gateway feasibility), rerun at
# eclipse-score/inc_someip_gateway main f30d5668. Lives only on the branch
# spike/score-someip-gateway-f30d5668 and never merges. It builds the Eclipse
# S-CORE SOME/IP gateway at one pinned commit and runs the same cross-domain
# scenarios as the d9eac670 rerun (run 40651267422): an mw::com publisher on the
# host network domain, gatewayd and someipd, and a vsomeip 3.7.6 client in a
# separate network namespace. See docs/spikes/score-someip-gateway-feasibility/README.md.
#
# Pin: inc_someip_gateway main f30d5668 (2026-11-03). Since d9eac670 the
# gatewayd and someipd sources are unchanged; score_communication 0.5.0 -> 0.6.0
# (#397), score_baselibs 0.2.16 -> 0.2.17 (#398), Bazel 8.6.0 -> 8.8.2 (#399),
# the legacy message-passing gateway_ipc_binding is removed and BUILD files
# change.
#
# Variants, two runs each on separate runners:
#   main-f30d5668-r1/r2    the pin as it is.
#   pr1531-f30d5668-r1/r2  the pin plus the one-line implementation change of
#                          eclipse-score/communication PR 1531 (head 0c5f0020),
#                          applied to score_communication 0.6.0 as one more
#                          patch of the gateway's single_version_override.
#                          After patching, generic_proxy_event.cpp is
#                          byte-identical to the PR head's file; the other
#                          files the change uses are identical in 0.6.0 and
#                          the PR head. The PR's test-code changes are not
#                          applied. Only MODULE.bazel (one added patch line) is
#                          modified upstream; ci_checkout_gateway.sh proves it.
name: Spike S-CORE SOME/IP gateway rerun at f30d5668

on:
  push:
    branches: [spike/score-someip-gateway-f30d5668]
    paths-ignore:
      - docs/spikes/score-someip-gateway-feasibility/README.md
      - docs/spikes/score-someip-gateway-feasibility/tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-score-someip-gateway-rerun-${{ github.ref }}
  cancel-in-progress: false

env:
  GATEWAY_REPO: https://github.com/eclipse-score/inc_someip_gateway.git
  VSOMEIP_SHA: 4187431d2815bd351845a09d01aa85b2a3163cab
  SPIKE_DIR: docs/spikes/score-someip-gateway-feasibility
  # bazel-8.8.2-linux-x86_64 (official .sha256 of the release asset), the
  # version of the gateway's .bazelversion at f30d5668
  BAZELISK_VERIFY_SHA256: bf463ba0f5f782e8fe31071bd2b821c2f6a27f03e5bb62f0879e88cbf3656e04

jobs:
  cross-domain:
    name: Cross-domain case at ${{ matrix.pin }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - pin: main-f30d5668-r1
            variant: main
            gateway_sha: f30d5668eeceadde55200c73bc5c448477672757
            ipc_binding: mw_com
            communication_patch: ''
          - pin: main-f30d5668-r2
            variant: main
            gateway_sha: f30d5668eeceadde55200c73bc5c448477672757
            ipc_binding: mw_com
            communication_patch: ''
          - pin: pr1531-f30d5668-r1
            variant: pr1531
            gateway_sha: f30d5668eeceadde55200c73bc5c448477672757
            ipc_binding: mw_com
            communication_patch: patches/communication-pr1531-generic_proxy_event_register.patch
          - pin: pr1531-f30d5668-r2
            variant: pr1531
            gateway_sha: f30d5668eeceadde55200c73bc5c448477672757
            ipc_binding: mw_com
            communication_patch: patches/communication-pr1531-generic_proxy_event_register.patch
    env:
      GATEWAY_SHA: ${{ matrix.gateway_sha }}
      IPC_BINDING: ${{ matrix.ipc_binding }}
      SPIKE_PIN: ${{ matrix.pin }}
      SPIKE_VARIANT: ${{ matrix.variant }}
      # path relative to SPIKE_DIR; empty = no patch
      COMMUNICATION_PATCH: ${{ matrix.communication_patch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare runner
        run: bash "$SPIKE_DIR/scripts/ci_prepare_runner.sh" "$RUNNER_TEMP/facts" --disk-cache
      - name: Install client build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-filesystem-dev libboost-thread-dev libboost-system-dev tcpdump gdb
          dpkg-query -W cmake ninja-build libboost-filesystem-dev tcpdump iproute2 gdb > "$RUNNER_TEMP/facts/apt_packages.txt"
      - name: Build vsomeip 3.7.6 and the guest client
        run: bash "$SPIKE_DIR/scripts/ci_build_client.sh" "$RUNNER_TEMP/guest" "$RUNNER_TEMP/facts" "$RUNNER_TEMP/paths.json"
      - name: Restore the Bazel caches of this spike
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/spike-bazel
          key: spike-bazel-xdomain-${{ env.GATEWAY_SHA }}-${{ matrix.variant }}-${{ hashFiles('docs/spikes/score-someip-gateway-feasibility/overlay/**', 'docs/spikes/score-someip-gateway-feasibility/config/**') }}
          restore-keys: |
            spike-bazel-xdomain-${{ env.GATEWAY_SHA }}-${{ matrix.variant }}-
      - name: Check out the gateway at the pinned commit, add the spike package
        run: bash "$SPIKE_DIR/scripts/ci_checkout_gateway.sh" "$RUNNER_TEMP/gw" "$RUNNER_TEMP/facts" --overlay
      - name: Build the gateway and the spike publisher
        env:
          SPIKE_CACHE_HIT: ${{ steps.cache.outputs.cache-hit || 'false' }} (matched key ${{ steps.cache.outputs.cache-matched-key || 'none' }})
        run: bash "$SPIKE_DIR/scripts/ci_build_gateway.sh" "$RUNNER_TEMP/gw" "$RUNNER_TEMP/facts" "$RUNNER_TEMP/paths.json"
      - name: Record disk use after the build (measurement only)
        if: always()
        run: |
          {
            echo "== df after build"
            df -h / /mnt 2>/dev/null || df -h /
            echo "== du of the Bazel output base and caches"
            du -sh "$HOME/spike-bazel" /mnt/spike-bazel "$HOME/.cache/spike-bazel" 2>/dev/null || true
            echo "== memory"
            free -g
          } | tee "$RUNNER_TEMP/facts/disk_after_build.txt"
      - name: Save the Bazel caches of this spike
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/spike-bazel
          key: spike-bazel-xdomain-${{ env.GATEWAY_SHA }}-${{ matrix.variant }}-${{ hashFiles('docs/spikes/score-someip-gateway-feasibility/overlay/**', 'docs/spikes/score-someip-gateway-feasibility/config/**') }}
      - name: Create the two network domains
        run: sudo python3 "$SPIKE_DIR/scripts/xdomain.py" netns-up --out "$RUNNER_TEMP/facts"
      - name: Run the scenarios
        run: |
          mkdir -p "$RUNNER_TEMP/cores"
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/cores/core.%e.%p" | tee "$RUNNER_TEMP/facts/core_pattern.txt"
          sudo python3 "$SPIKE_DIR/scripts/xdomain.py" run --paths "$RUNNER_TEMP/paths.json" --out "$RUNNER_TEMP/results"
          sudo chown -R "$USER:$USER" "$RUNNER_TEMP/results"
      - name: Backtraces of the core dumps
        if: always()
        run: bash "$SPIKE_DIR/scripts/ci_backtraces.sh" "$RUNNER_TEMP/cores" "$RUNNER_TEMP/paths.json" "$RUNNER_TEMP/results"
      - name: Remove the network domains
        if: always()
        run: sudo python3 "$SPIKE_DIR/scripts/xdomain.py" netns-down || true
      - name: Analyse
        if: always()
        run: |
          sudo chown -R "$USER:$USER" "$RUNNER_TEMP/results" || true
          python3 "$SPIKE_DIR/scripts/analyze.py" "$RUNNER_TEMP/results" \
            --json "$RUNNER_TEMP/results/analysis.json" --markdown "$RUNNER_TEMP/results/analysis.md"
          {
            echo "### Pin $SPIKE_PIN (inc_someip_gateway $GATEWAY_SHA, IPC binding $IPC_BINDING, communication patch: ${COMMUNICATION_PATCH:-none})"
            echo
            cat "$RUNNER_TEMP/results/analysis.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-domain-evidence-${{ matrix.pin }}
          path: |
            ${{ runner.temp }}/facts
            ${{ runner.temp }}/results
            ${{ runner.temp }}/paths.json
          retention-days: 30
