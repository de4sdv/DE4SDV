name: Privileged PLEML Gate A Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/privileged-pleml-gate-a.yml"
      - ".gitmodules"
      - "external/pleml"
      - "docs/spikes/pleml-gate-a/**"
      - "scripts/export_pleml_gate_a.py"
      - "scripts/run_pleml_gate_a.py"
      - "tests/test_pleml_adapter_rule_api.py"
      - "tests/test_pleml_api_observability.py"
      - "tools/pleml_gate_a.py"

permissions:
  contents: read

jobs:
  gate-a:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sysml2
          POSTGRES_PASSWORD: mysecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sysml2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PLEML pin
        run: |
          test "$(git -C external/pleml rev-parse HEAD)" = \
            "5f8ab8560219dc24d8ec7ec90d6f0a145896ef8e"
          git submodule status --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install official Syside Automator serializer
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          test -n "$SYSIDE_LICENSE_KEY"
          python -m pip install --disable-pip-version-check \
            "syside==0.10.3" "pytest==8.4.2"

      - name: Validate and export the exact-head fixture
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          syside check \
            external/pleml/PLEML/PLEML.sysml \
            docs/spikes/pleml-gate-a/pleml_gate_a_fixture.sysml
          python scripts/export_pleml_gate_a.py \
            --output /tmp/de4sdv-pleml-gate-a-export.json

      - name: Build pinned Systems Modeling API service
        run: |
          git clone --filter=blob:none \
            https://github.com/Systems-Modeling/SysML-v2-API-Services.git \
            /tmp/sysmlv2-api-services
          git -C /tmp/sysmlv2-api-services checkout \
            0af711b14bbcea7b240bb0a3a65817ae68302092
          curl -fsSL -o /tmp/sbt-launch.jar \
            https://repo1.maven.org/maven2/org/scala-sbt/sbt-launch/1.2.8/sbt-launch-1.2.8.jar
          (cd /tmp/sysmlv2-api-services && java -Xmx4g -jar /tmp/sbt-launch.jar stage)

      - name: Start pinned Systems Modeling API service
        run: |
          /tmp/sysmlv2-api-services/target/universal/stage/bin/sysml-v2-api-services \
            -J-Xmx4g \
            -Dplay.server.http.port=9000 \
            -Dplay.evolutions.db.default.autoApply=true \
            -Dplay.http.secret.key=de4sdv-ci-pleml-gate-a \
            > /tmp/sysml-api.log 2>&1 &
          echo $! > /tmp/sysml-api.pid
          for attempt in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:9000/projects >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sysml-api.log
          exit 1

      - name: Import, query, evaluate, and project the exact API revision
        run: |
          python scripts/run_pleml_gate_a.py \
            --api-url http://127.0.0.1:9000 \
            --export /tmp/de4sdv-pleml-gate-a-export.json \
            --binding /tmp/de4sdv-pleml-gate-a-binding.json \
            --report /tmp/de4sdv-pleml-gate-a-report.json \
            --projection /tmp/de4sdv-pleml-gate-a-projection.sysml

      - name: Validate the generated projection
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          syside check \
            external/pleml/PLEML/PLEML.sysml \
            docs/spikes/pleml-gate-a/pleml_gate_a_fixture.sysml \
            /tmp/de4sdv-pleml-gate-a-projection.sysml

      - name: Run Gate A regression tests
        run: |
          python -m pytest \
            tests/test_pleml_adapter_rule_api.py \
            tests/test_pleml_api_observability.py -q

      - name: Upload exact-head Gate A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleml-gate-a-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/de4sdv-pleml-gate-a-export.json
            /tmp/de4sdv-pleml-gate-a-binding.json
            /tmp/de4sdv-pleml-gate-a-report.json
            /tmp/de4sdv-pleml-gate-a-projection.sysml
            /tmp/sysml-api.log
