# DE4SDV Public Deployment Pipeline — GitHub Actions.
#
# Manually triggered (workflow_dispatch). Deploys ONE exact Git revision to
# sysml-api.de4sdv.org by:
#
#   1. validating the requested SHA (40-hex, on origin/main);
#   2. independently verifying the privileged artifact run for that SHA
#      (exact workflow path .github/workflows/<file>, conclusion success,
#      head_sha == requested SHA);
#   3. downloading that run's validated full-model bundle;
#   4. creating a REAL exact Git checkout on the host (public clone, detached
#      at the SHA, reset/clean — no tar copies, no fake git state);
#   5. running the fail-closed deploy.py with the dedicated deployment venv
#      (/srv/de4sdv/venv), which imports the validated export into the
#      deployment's own API repository and produces a deployment-specific
#      binding (Project/Commit UUIDs are generated by the deployment
#      repository, never copied from the ephemeral CI run);
#   6. running the external public verification (mandatory, not skippable).
#
# Fail-closed rules:
#   - refuses non-main SHAs and ambiguous artifact selections;
#   - refuses to deploy if any privileged artifact is missing/stale/mismatched;
#   - stops the public proxy before the import and keeps it stopped unless
#     validation and status publication succeed;
#   - verification always runs; a failed verification marks the job failed.
#
# Prerequisites (one-time, set by the repository owner):
#   Secrets:
#     DEPLOY_SSH_KEY          private key allowed to SSH to the host (deploy user)
#     DEPLOY_SSH_HOST         e.g. sysml-api.de4sdv.org (once DNS exists) or the IP
#     DEPLOY_SSH_USER         deploy user on the host
#     DEPLOY_SSH_KNOWN_HOSTS  the host's public key line(s), obtained and
#                             verified out-of-band by the owner (see
#                             deployment/README.md "SSH host-key verification");
#                             written verbatim to ~/.ssh/known_hosts and used
#                             with StrictHostKeyChecking=yes. ssh-keyscan
#                             output is NEVER trusted dynamically.
#   Environments:
#     sysml-api-production    (required-reviewer approval gate)
#
# First-deployment sequence (ADR 0013): merge THIS PR -> obtain the resulting
# main SHA -> run Privileged Full-Model API Ingestion for that exact main SHA
# -> provision the host -> deploy that exact main SHA with its privileged
# artifact -> external verification -> publish the deployment-specific tuple.

name: Deploy Public SysML API

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact DE4SDV Git SHA to deploy (must be on main and have a green privileged full-model run)
        required: true
      artifact_run_id:
        description: Privileged Full-Model API Ingestion run ID for that SHA (optional; auto-detected when unambiguous)
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: sysml-api-production
  cancel-in-progress: false

env:
  PRIVILEGED_WORKFLOW_FILE: privileged-full-model-api-ingestion.yml
  # Single definition of the deployment SHA: the workflow input, passed at
  # job level. Every step (main-membership check, privileged-run validation,
  # artifact selection, remote checkout) reads exactly this value; nothing
  # round-trips through GITHUB_ENV.
  DEPLOY_SHA: ${{ inputs.git_sha }}
  PRVILEGED_RUN_INPUT: ${{ inputs.artifact_run_id }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sysml-api-production
    timeout-minutes: 90
    steps:
      - name: Check out deployment tooling at the exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Validate deployment ref (fail closed on PR heads)
        run: |
          set -euo pipefail
          case "$DEPLOY_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "git_sha must be a full 40-hex SHA" >&2; exit 1 ;;
          esac
          MERGED=$(git branch -r --contains "$DEPLOY_SHA" origin/main | wc -l)
          if [[ "$MERGED" -eq 0 ]]; then
            echo "Refusing: $DEPLOY_SHA is not on origin/main" >&2
            exit 1
          fi

      - name: Verify the privileged run for the exact SHA (independent metadata check)
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          RUN_ID="$PRVILEGED_RUN_INPUT"
          if [[ -z "$RUN_ID" ]]; then
            # Auto-detect: collect ALL successful runs of the privileged
            # workflow for this exact SHA and require exactly one.
            RUN_ID=$(gh api \
              "repos/$REPO/actions/workflows/$PRIVILEGED_WORKFLOW_FILE/runs?status=success&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_sha==\"$DEPLOY_SHA\")] | length as \$n | if \$n == 1 then .[0].id else \"AMBIG:\$n\" end")
            case "$RUN_ID" in
              AMBIG:*) echo "Refusing: $RUN_ID successful privileged runs for $DEPLOY_SHA; pass artifact_run_id" >&2; exit 1 ;;
              "") echo "No successful privileged full-model run found for $DEPLOY_SHA" >&2; exit 1 ;;
            esac
          fi
          # Independent metadata verification of the explicitly supplied run.
          gh api "repos/$REPO/actions/runs/$RUN_ID" > run-meta.json
          python3 - <<'PY'
          import json, os, sys
          meta = json.load(open("run-meta.json"))
          sha = os.environ["DEPLOY_SHA"]
          expected_path = f".github/workflows/{os.environ['PRIVILEGED_WORKFLOW_FILE']}"
          problems = []
          if meta.get("head_sha") != sha:
              problems.append(f"head_sha {meta.get('head_sha')} != requested {sha}")
          if meta.get("conclusion") != "success":
              problems.append(f"conclusion is {meta.get('conclusion')}, not success")
          path = (meta.get("path") or "")
          if path != expected_path:
              problems.append(f"workflow path {path!r} != {expected_path!r}")
          # GitHub returns `repository` as an OBJECT (with full_name), not a
          # string. Require the object and its exact full_name; fail closed
          # if either is missing.
          repository = meta.get("repository")
          if not isinstance(repository, dict):
              problems.append(f"repository is not an object: {repository!r}")
          else:
              full_name = repository.get("full_name")
              if not isinstance(full_name, str) or not full_name:
                  problems.append("repository.full_name is missing")
              elif full_name.lower() != os.environ["GITHUB_REPOSITORY"].lower():
                  problems.append(
                      f"repository.full_name {full_name!r} != {os.environ['GITHUB_REPOSITORY']!r}"
                  )
          if problems:
              print("Privileged run verification FAILED:", *problems, sep="\n  - ", file=sys.stderr)
              sys.exit(1)
          print("Privileged run verified:", meta["id"], "for", sha)
          PY
          echo "PRIVILEGED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Download validated full-model bundle
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          gh api "repos/$REPO/actions/runs/$PRIVILEGED_RUN_ID/artifacts" > artifacts.json
          ARTIFACT_ID=$(python3 - <<'PY'
          import json
          arts = json.load(open("artifacts.json"))["artifacts"]
          matches = [a for a in arts if a["name"].startswith("full-model-api-ingestion-") and not a["expired"]]
          assert len(matches) == 1, f"expected exactly one ingestion artifact, got: {[a['name'] for a in matches]}"
          print(matches[0]["id"])
          PY
          )
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > bundle.zip
          rm -rf /tmp/bundle && mkdir -p /tmp/bundle
          unzip -q bundle.zip -d /tmp/bundle
          ls -la /tmp/bundle
          echo "BUNDLE_DIR=/tmp/bundle" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up SSH (out-of-band verified host key; key never printed)
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          SSH_HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          SSH_USER="${{ secrets.DEPLOY_SSH_USER }}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Host-key pinning: the owner establishes the host key OUT OF BAND
          # (see deployment/README.md) and stores it in the
          # DEPLOY_SSH_KNOWN_HOSTS secret. It is written verbatim to
          # known_hosts and StrictHostKeyChecking=yes refuses any mismatch.
          # ssh-keyscan output is never trusted.
          if [[ -z "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" ]]; then
            echo "DEPLOY_SSH_KNOWN_HOSTS is not set; refusing to connect without a verified host key" >&2
            exit 1
          fi
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i /tmp/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'echo SSH_OK'

      - name: Create exact Git checkout on the host
        run: |
          set -euo pipefail
          SSH_HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          SSH_USER="${{ secrets.DEPLOY_SSH_USER }}"
          # Real exact checkout: fresh clone of the public repository, detached
          # at the requested SHA, reset+clean so no stale files can survive.
          ssh -i /tmp/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" bash -s "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          REPO_DIR=/srv/de4sdv/DE4SDV
          SHA="$1"
          if [[ -d "$REPO_DIR/.git" ]]; then
            git -C "$REPO_DIR" fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          else
            sudo rm -rf "$REPO_DIR"
            sudo mkdir -p /srv/de4sdv
            sudo chown "$(whoami)" /srv/de4sdv
            git clone https://github.com/de4sdv/DE4SDV.git "$REPO_DIR"
          fi
          git -C "$REPO_DIR" checkout --detach --force "$SHA"
          git -C "$REPO_DIR" reset --hard "$SHA"
          git -C "$REPO_DIR" clean -ffd
          HEAD=$(git -C "$REPO_DIR" rev-parse HEAD)
          if [[ "$HEAD" != "$SHA" ]]; then
            echo "checkout mismatch: HEAD=$HEAD expected=$SHA" >&2
            exit 1
          fi
          echo "exact checkout verified: $HEAD"
          REMOTE

      - name: Transfer validated bundle and run fail-closed deploy
        run: |
          set -euo pipefail
          SSH_HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          SSH_USER="${{ secrets.DEPLOY_SSH_USER }}"
          # Stage into a fresh incoming dir: no stale artifacts from previous
          # deployments can survive.
          ssh -i /tmp/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'sudo rm -rf /srv/de4sdv/artifacts/incoming && sudo mkdir -p /srv/de4sdv/artifacts/incoming /srv/de4sdv/status && sudo chown -R "$(whoami)" /srv/de4sdv/artifacts /srv/de4sdv/status'
          scp -i /tmp/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/bundle/* "$SSH_USER@$SSH_HOST:/srv/de4sdv/artifacts/incoming/"
          # deploy.py uses the dedicated deployment venv created by
          # provision-server.sh and stops the public proxy before importing.
          ssh -i /tmp/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd /srv/de4sdv/DE4SDV && sudo DEPLOY_DIR=/srv/de4sdv /srv/de4sdv/venv/bin/python deployment/scripts/deploy.py --bundle-dir /srv/de4sdv/artifacts/incoming --repo /srv/de4sdv/DE4SDV'

      - name: Post-deploy public verification (mandatory)
        run: |
          set -euo pipefail
          python3 deployment/scripts/verify_public_api.py --json /tmp/verify.json
          cat /tmp/verify.json

      - name: Remove SSH key material
        if: always()
        run: rm -f /tmp/deploy_key
