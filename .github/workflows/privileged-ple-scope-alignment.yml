name: Privileged PLE Scope Alignment

# Licensed validation and evaluation of the PLEML scope-alignment experiment
# (model-based-product-line-engineering/pleml-scope-alignment/). It runs on
# pull requests that touch the experiment's own paths and on demand; never on
# a change to the production model roots, which keep their own gates.
#
# The executor is the exact commit under evaluation: the pull-request head, or
# the dispatched `ref`. The exact-pinned PLEML library (1.1.1) comes from the
# fenced Sysand lock (model-based-product-line-engineering/libraries/pleml/)
# and is byte-checked against the committed record of its release tag before
# any step reads it. The frozen Gate A interpreter is read from the frozen
# experiment checkout at PLEML 1.1.0 (tag pleml-1.1.0-frozen), checked out
# without its PLEML submodule, relocated outside the executor checkout (#369:
# outputs and checkouts inside the executor checkout made
# executor_source_dirty true), and verified by revision. The licence reaches
# exactly two steps: the `syside check` of the reviewed roots with the pinned
# library and the model, and the runner that serializes the same set and
# evaluates every scope-alignment configuration.
# Every recording step is preceded by a refusal of a dirty checkout, and one
# follows the evaluation. After the receipt check, the unlicensed comparison
# oracle sets the operational path (the unchanged configurator) beside the
# fresh receipt.
#
# The receipts say `qualified: false`. This workflow is an experiment gate; it
# authorizes no adoption, no change of selection authority and no claim.

on:
  pull_request:
    paths:
      - "model-based-product-line-engineering/pleml-scope-alignment/**"
      - "scripts/run_ple_scope_alignment.py"
      - "de4sdv/semantic/ple_scope_alignment.py"
      - "tests/test_ple_scope_alignment_model.py"
      - "tests/test_ple_scope_alignment_evaluator.py"
      - "tests/test_ple_scope_alignment_workflow.py"
      - "scripts/compare_ple_scope_alignment.py"
      - "tests/test_ple_scope_alignment_oracle.py"
      - ".github/workflows/privileged-ple-scope-alignment.yml"
      # The PLEML pin: a re-pin gets this licensed validation (release policy).
      - "model-based-product-line-engineering/libraries/pleml/**"
      - "de4sdv/semantic/pleml_package.py"
      - "scripts/check_pleml_package.py"
      - "scripts/run_ple_qualification.py"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to evaluate after maintainer review"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: ple-scope-alignment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope-alignment:
    name: PLEML scope alignment (licensed, experiment)
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["orkunyilmaz", "de4sdv"]'), github.event.pull_request.user.login)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the unlicensed oracle tests verify the retained record
      # against the files of the record's own revision, read from Git.
      - name: Checkout the executor commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the exact revision
        id: revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          sha="$(git rev-parse HEAD)"
          case "$sha" in
            (*[!0-9a-f]*|"")
              echo "not a lowercase full commit id: $sha" >&2
              exit 1 ;;
          esac
          if [ "${#sha}" != "40" ]; then
            echo "not a 40-character commit id: $sha" >&2
            exit 1
          fi
          if [ -n "$EXPECTED_HEAD" ] && [ "$sha" != "$EXPECTED_HEAD" ]; then
            echo "checked out $sha, not the pull-request head $EXPECTED_HEAD" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "PLE scope alignment of $sha"

      - name: Check the licensed Syside secret is configured
        id: licence
        env:
          LICENCE_CONFIGURED: ${{ secrets.SYSIDE_LICENSE_KEY != '' }}
        run: |
          if [ "$LICENCE_CONFIGURED" != "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SYSIDE_LICENSE_KEY is not configured; the scope alignment needs the licensed serializer." >&2
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              exit 1
            fi
            echo "Skipping the scope alignment for $GITHUB_EVENT_NAME until the secret is configured."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Checkout the frozen experiment read-only as a separate input
        if: steps.licence.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: 69bbe093c179f2121274b9f604c7d6a10de19e77
          path: _ple-experiment
          persist-credentials: false

      # actions/checkout places a checkout only under the workspace, where it
      # is an untracked path of the executor checkout ("?? _ple-experiment/").
      - name: Relocate the frozen experiment outside the executor checkout
        if: steps.licence.outputs.available == 'true'
        run: |
          test ! -e "$RUNNER_TEMP/_ple-experiment"
          mv _ple-experiment "$RUNNER_TEMP/_ple-experiment"

      - name: Verify the frozen experiment revision
        if: steps.licence.outputs.available == 'true'
        run: |
          mkdir "$RUNNER_TEMP/ple-evidence"
          git -C "$RUNNER_TEMP/_ple-experiment" rev-parse HEAD > "$RUNNER_TEMP/ple-evidence/experiment-revision.txt"
          grep -qx 69bbe093c179f2121274b9f604c7d6a10de19e77 "$RUNNER_TEMP/ple-evidence/experiment-revision.txt"

      - name: Set up Python
        if: steps.licence.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java (Modeler CLI runtime)
        if: steps.licence.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the pinned serializer, the Modeler CLI and the SysML library dependencies
        if: steps.licence.outputs.available == 'true'
        run: |
          python -m pip install --disable-pip-version-check \
            "syside==0.10.3" "PyYAML==6.0.2" "pytest==8.4.2" "sysand==0.1.0"
          SYSIDE_VERSION="0.10.3"
          SYSIDE_FILE="syside-${SYSIDE_VERSION}-x86_64-linux-glibc.tar.xz"
          SYSIDE_URL="https://gitlab.com/api/v4/projects/sensmetry%2Fpublic%2Fsyside/packages/generic/syside-modeler-cli/${SYSIDE_VERSION}/${SYSIDE_FILE}"
          curl -fL -o "/tmp/${SYSIDE_FILE}" "${SYSIDE_URL}"
          mkdir -p "$HOME/.local"
          tar -xJf "/tmp/${SYSIDE_FILE}" --directory "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/syside" --version
          sysand sync

      # PLEML 1.1.1 from the fenced Sysand lock: the byte check against the
      # committed record of its release tag, the re-pin re-derived from the
      # Sysand index (this workflow runs on re-pin PRs) and the upstream tag's
      # commit and blobs, before any step reads it.
      - name: Install and byte-check the fenced PLEML package
        if: steps.licence.outputs.available == 'true'
        run: |
          (cd model-based-product-line-engineering/libraries/pleml && sysand sync)
          python scripts/check_pleml_package.py --release-diff --from-index --verify-tag --out "$RUNNER_TEMP/ple-evidence/pleml-package.json"

      - name: Refuse a dirty checkout before the unlicensed checks
        if: steps.licence.outputs.available == 'true'
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            printf 'the checkout is not clean:\n%s\n' "$dirty" >&2
            exit 1
          fi

      - name: Run the unlicensed scope-alignment tests with the verified frozen interpreter
        if: steps.licence.outputs.available == 'true'
        env:
          DE4SDV_PLE_INTERPRETER: ${{ runner.temp }}/_ple-experiment/tools/pleml_gate_a.py
        run: |
          python -B -m pytest -p no:cacheprovider \
            tests/test_ple_scope_alignment_model.py \
            tests/test_ple_scope_alignment_evaluator.py \
            tests/test_ple_scope_alignment_workflow.py \
            tests/test_ple_scope_alignment_oracle.py -q

      - name: Refuse a dirty checkout before the licensed validation
        if: steps.licence.outputs.available == 'true'
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            printf 'the checkout is not clean:\n%s\n' "$dirty" >&2
            exit 1
          fi

      - name: Validate the reviewed roots, the pinned PLEML library and the model (licensed)
        if: steps.licence.outputs.available == 'true'
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          set -eo pipefail
          syside check \
            textual-notation-of-model \
            model-based-product-line-engineering/product-models \
            model-based-product-line-engineering/scoping \
            model-based-product-line-engineering/libraries/pleml/.sysand/lib/mbse4u-pleml_1.1.1/PLEML.sysml \
            model-based-product-line-engineering/pleml-scope-alignment/aebs_product_line_scope_alignment.sysml \
            2>&1 | tee "$RUNNER_TEMP/ple-evidence/syside-check.txt"

      - name: Refuse a dirty checkout before the evaluation
        if: steps.licence.outputs.available == 'true'
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            printf 'the checkout is not clean:\n%s\n' "$dirty" >&2
            exit 1
          fi

      - name: Serialize the exact head with the pinned PLEML library and evaluate the scope alignment (licensed)
        if: steps.licence.outputs.available == 'true'
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
          HEAD_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          python scripts/run_ple_scope_alignment.py \
            --licensed \
            --expected-executor "$HEAD_SHA" \
            --experiment "$RUNNER_TEMP/_ple-experiment" \
            --out "$RUNNER_TEMP/ple-evidence/scope-alignment"

      - name: Refuse a dirty checkout after the evaluation
        if: steps.licence.outputs.available == 'true'
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            printf 'the checkout is not clean:\n%s\n' "$dirty" >&2
            exit 1
          fi

      - name: Check the receipt against the expected outcomes
        if: steps.licence.outputs.available == 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ple-evidence/scope-alignment/receipt.json').read_text())
          if not receipt['expectation']['matches']:
              raise SystemExit('expected outcome table not reproduced: ' + '; '.join(receipt['expectation']['mismatches']))
          if receipt['executor_source_dirty']:
              raise SystemExit('the executor checkout was dirty while recording')
          if receipt['qualified'] or receipt['adoption_authorized'] or receipt['authority_activation_authorized']:
              raise SystemExit('the experiment was silently promoted')
          if not receipt['fresh_serialization'] or receipt['mode'] != 'licensed-serialization':
              raise SystemExit('the evidence is not a fresh licensed serialization')
          checks = receipt['alignment']['checks']
          if not checks['frozen_resolver_agrees']:
              raise SystemExit('the frozen resolver disagrees with the bound outcomes')
          if not (checks['feature_binding_metadata_observed'] and checks['configuration_binding_metadata_observed']):
              raise SystemExit('the FeatureBinding or FeatureConfigurationBinding metadata was not observed on the serialized dependencies')
          lines = ['## PLE scope alignment (experiment; qualified: false)', '',
                   '| configuration | role | outcome | selected | derived |', '|---|---|---|---|---|']
          for item in receipt['alignment']['configurations']:
              outcome = item['status'] + (' (' + item['violated_bound'] + ' bound)' if item['violated_bound'] else '')
              derived = ', '.join(d['variation'] + '=' + d['variant'] for d in item['derived_asset_variants']) or '-'
              lines.append('| ' + item['configuration'] + ' | ' + item['role'] + ' | ' + outcome + ' | '
                           + (', '.join(item['selected_alternatives']) or '-') + ' | ' + derived + ' |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY

      - name: Refuse a dirty checkout before the comparison oracle
        if: steps.licence.outputs.available == 'true'
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            printf 'the checkout is not clean:\n%s\n' "$dirty" >&2
            exit 1
          fi

      # The oracle is unlicensed: it runs the unchanged configurator on the
      # committed configurations and on probes it generates in a temporary
      # directory beside its output (under RUNNER_TEMP), and sets the results
      # beside the fresh receipt of this exact head. A defect or an
      # unclassified row fails the job.
      - name: Compare the operational path with the fresh scope alignment (unlicensed oracle)
        if: steps.licence.outputs.available == 'true'
        env:
          HEAD_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          python scripts/compare_ple_scope_alignment.py \
            --receipt "$RUNNER_TEMP/ple-evidence/scope-alignment/receipt.json" \
            --governed-scope "$RUNNER_TEMP/ple-evidence/scope-alignment/governed-scope-validation.json" \
            --evidence fresh \
            --run-id "$GITHUB_RUN_ID" \
            --artifact "ple-scope-alignment-$HEAD_SHA-$GITHUB_RUN_ID" \
            --out "$RUNNER_TEMP/ple-evidence/comparison"
          cat "$RUNNER_TEMP/ple-evidence/comparison/comparison.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse a dirty checkout after the comparison oracle
        if: steps.licence.outputs.available == 'true'
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            printf 'the checkout is not clean:\n%s\n' "$dirty" >&2
            exit 1
          fi

      - name: Retain the evidence including failed execution
        if: always() && steps.licence.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ple-scope-alignment-${{ steps.revision.outputs.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ple-evidence/
          if-no-files-found: warn
          retention-days: 30
