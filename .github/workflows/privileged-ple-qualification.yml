name: Privileged PLE Qualification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact reviewed permanent main-history executor SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SELECTED_REVISION: ${{ inputs.ref }}
      GH_TOKEN: ${{ github.token }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sysml2
          POSTGRES_PASSWORD: mysecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sysml2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout reviewed current executor
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact permanent executor and historical artifact origin
        id: origin
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          revision = os.environ['SELECTED_REVISION']
          if re.fullmatch(r'[0-9a-f]{40}', revision) is None:
              raise SystemExit('refused: exact permanent executor SHA required')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != revision:
              raise SystemExit('refused: executor checkout mismatch')
          subprocess.run(['git', 'merge-base', '--is-ancestor', revision, 'origin/main'], check=True)
          repository = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repository + path]))
          run = api('/actions/runs/33543909037')
          frozen = '6a99626b4af7cd01108f27dac88bf5b55bba207a'
          if (run.get('id') != 33543909037
                  or run['head_sha'] != frozen or run['status'] != 'completed'
                  or run['conclusion'] != 'success' or run['event'] != 'pull_request'
                  or run['path'] != '.github/workflows/privileged-pleml-gate-a.yml'
                  or run['repository']['full_name'] != repository):
              raise SystemExit('refused: historical origin mismatch')
          inventory = api('/actions/runs/33543909037/artifacts?per_page=100')
          if inventory['total_count'] != len(inventory['artifacts']):
              raise SystemExit('refused: incomplete historical artifact inventory')
          matches = [item for item in inventory['artifacts']
                     if item['name'] == 'pleml-gate-a-' + frozen and not item['expired']]
          if (len(matches) != 1 or matches[0]['id'] != 9814891861
                  or matches[0].get('workflow_run', {}).get('id') != 33543909037
                  or matches[0].get('workflow_run', {}).get('head_sha') != frozen):
              raise SystemExit('refused: exact live historical artifact 9814891861 required')
          Path('ple-evidence').mkdir()
          Path('ple-evidence/provider-origin.json').write_text(json.dumps({
              'executor_revision': revision, 'historical_run': run['id'],
              'historical_revision': frozen, 'historical_artifact': matches[0],
              'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH')}, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('artifact_id=' + str(matches[0]['id']) + '\n')
          PY

      - name: Checkout frozen experiment read-only as a separate input
        uses: actions/checkout@v4
        with:
          ref: 6a99626b4af7cd01108f27dac88bf5b55bba207a
          path: _ple-experiment
          submodules: recursive
          persist-credentials: false

      - name: Download the verified historical baseline
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.origin.outputs.artifact_id }}
          path: _ple-baseline
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 33543909037

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install existing pinned serializer and test dependencies
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          test -n "$SYSIDE_LICENSE_KEY"
          python -m pip install --disable-pip-version-check \
            "syside==0.10.3" "PyYAML==6.0.2" "pytest==8.4.2"

      - name: Resolve current executor library lock without modifying frozen inputs
        run: |
          curl -fsSL https://sysand.com/install.sh | bash
          "$HOME/.local/bin/sysand" sync
          "$HOME/.local/bin/sysand" --version > ple-evidence/sysand-version.txt

      - name: Exercise qualification guards and historical replay
        run: |
          python -m pytest tests/test_ple_qualification.py -q
          python scripts/run_ple_qualification.py \
            --experiment _ple-experiment \
            --historical-export _ple-baseline/de4sdv-pleml-gate-a-export.json \
            --out ple-evidence/historical-replay.json

      - name: Execute missing scoped PLE probes
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
          DE4SDV_PLE_ORACLE: ${{ github.workspace }}/_ple-experiment
        run: |
          python -m pytest tests/test_ple_scoped_execution.py -q
          set +e
          python scripts/run_ple_scoped_execution.py \
            --experiment _ple-experiment \
            --expected-executor "$SELECTED_REVISION" \
            --licensed --native-xor \
            --out "$RUNNER_TEMP/ple-scoped-execution"
          code=$?
          set -e
          mkdir -p ple-evidence/scoped
          cp -R "$RUNNER_TEMP/ple-scoped-execution/." ple-evidence/scoped/
          printf '%s\n' "$code" > ple-evidence/scoped/cli-exit.txt
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('ple-evidence/scoped/receipt.json').read_text())
          if receipt['execution_error'] or not receipt['fresh_serialization']:
              raise SystemExit('scoped licensed serialization failed; diagnostics retained')
          if receipt['native_xor'].get('attempted') is not True:
              raise SystemExit('scoped native evaluation was not attempted; diagnostics retained')
          if receipt['qualified'] or receipt['native_xor']['requirement_status'] != 'failed':
              raise SystemExit('scoped requirement was silently promoted')
          if Path('ple-evidence/scoped/cli-exit.txt').read_text().strip() != '2':
              raise SystemExit('native requirement must retain failed/unsupported exit 2')
          PY

      - name: Build existing pinned ephemeral Systems Modeling API
        run: |
          git clone --filter=blob:none \
            https://github.com/Systems-Modeling/SysML-v2-API-Services.git /tmp/sysmlv2-api-services
          git -C /tmp/sysmlv2-api-services checkout 0af711b14bbcea7b240bb0a3a65817ae68302092
          curl -fsSL -o /tmp/sbt-launch.jar \
            https://repo1.maven.org/maven2/org/scala-sbt/sbt-launch/1.2.8/sbt-launch-1.2.8.jar
          (cd /tmp/sysmlv2-api-services && java -Xmx4g -jar /tmp/sbt-launch.jar stage)

      - name: Start isolated API and verify readiness
        run: |
          /tmp/sysmlv2-api-services/target/universal/stage/bin/sysml-v2-api-services \
            -J-Xmx4g -Dplay.server.http.port=9000 \
            -Dplay.evolutions.db.default.autoApply=true \
            -Dplay.http.secret.key=de4sdv-ci-ple-qualification \
            > ple-evidence/sysml-api.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          deadline = time.monotonic() + 300
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:9000/projects', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit('ephemeral API failed readiness')
          PY

      - name: Fresh current-toolchain serialization and real API readback
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          python scripts/run_ple_qualification.py \
            --experiment _ple-experiment \
            --historical-export _ple-baseline/de4sdv-pleml-gate-a-export.json \
            --expected-executor "$SELECTED_REVISION" \
            --api-url http://127.0.0.1:9000 \
            --out ple-evidence/current/receipt.json

      - name: Retain actual observations including failed execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ple-qualification-${{ inputs.ref }}-${{ github.run_id }}
          path: ple-evidence/
          if-no-files-found: error
          retention-days: 30
