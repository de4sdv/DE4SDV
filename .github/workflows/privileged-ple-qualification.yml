name: Privileged PLE Qualification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact reviewed permanent main-history executor SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SELECTED_REVISION: ${{ inputs.ref }}
      GH_TOKEN: ${{ github.token }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sysml2
          POSTGRES_PASSWORD: mysecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sysml2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout reviewed current executor
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact permanent executor and retained historical baseline
        id: origin
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          revision = os.environ['SELECTED_REVISION']
          if re.fullmatch(r'[0-9a-f]{40}', revision) is None:
              raise SystemExit('refused: exact permanent executor SHA required')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != revision:
              raise SystemExit('refused: executor checkout mismatch')
          subprocess.run(['git', 'merge-base', '--is-ancestor', revision, 'origin/main'], check=True)
          repository = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repository + path]))
          run = api('/actions/runs/33543909037')
          frozen = '6a99626b4af7cd01108f27dac88bf5b55bba207a'
          if (run.get('id') != 33543909037
                  or run['head_sha'] != frozen or run['status'] != 'completed'
                  or run['conclusion'] != 'success' or run['event'] != 'pull_request'
                  or run['path'] != '.github/workflows/privileged-pleml-gate-a.yml'
                  or run['repository']['full_name'] != repository):
              raise SystemExit('refused: historical origin mismatch')
          import hashlib, lzma
          base = Path('docs/product-line-engineering/gate-a-baseline')
          manifest = json.loads((base / 'manifest.json').read_text())
          if (manifest.get('schema') != 'de4sdv.retained-ple-baseline/v1'
                  or manifest.get('historical_run') != 33543909037
                  or manifest.get('historical_artifact_id') != 9814891861
                  or manifest.get('frozen_revision') != frozen
                  or manifest.get('file') != 'de4sdv-pleml-gate-a-export.json.xz'
                  or manifest.get('compressed_sha256') != '8df340d8a645521b542a44a0adce3ec628e23fb0b21f819dd459bb30dee30f8a'
                  or manifest.get('export_sha256') != 'cf129d6884dc38555a0a725ad516d06fa6cf1ff2d11d6cda0bb1d5bc1ae51b7d'):
              raise SystemExit('refused: retained historical baseline manifest mismatch')
          compressed = (base / manifest['file']).read_bytes()
          if hashlib.sha256(compressed).hexdigest() != manifest['compressed_sha256']:
              raise SystemExit('refused: retained historical baseline digest mismatch')
          export = lzma.decompress(compressed)
          if (hashlib.sha256(export).hexdigest() != manifest['export_sha256']
                  or len(export) != manifest['export_size']
                  or json.loads(export).get('git_commit') != frozen):
              raise SystemExit('refused: retained historical export identity mismatch')
          # Inputs and evidence live outside the checkout: the qualification
          # receipts record its `git status --porcelain`.
          temp = Path(os.environ['RUNNER_TEMP'])
          baseline = temp / '_ple-baseline'
          baseline.mkdir()
          (baseline / 'de4sdv-pleml-gate-a-export.json').write_bytes(export)
          evidence = temp / 'ple-evidence'
          evidence.mkdir()
          (evidence / 'provider-origin.json').write_text(json.dumps({
              'executor_revision': revision, 'historical_run': run['id'],
              'historical_revision': frozen,
              'historical_artifact': {'id': manifest['historical_artifact_id'],
                                      'name': manifest['historical_artifact_name'],
                                      'provider_expired_at': manifest['historical_artifact_expired_at'],
                                      'retained_copy': str(base / manifest['file']),
                                      'compressed_sha256': manifest['compressed_sha256'],
                                      'export_sha256': manifest['export_sha256']},
              'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH')}, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('artifact_id=' + str(manifest['historical_artifact_id']) + '\n')
          PY

      - name: Checkout frozen experiment read-only as a separate input
        uses: actions/checkout@v4
        with:
          ref: 6a99626b4af7cd01108f27dac88bf5b55bba207a
          path: _ple-experiment
          submodules: recursive
          persist-credentials: false

      # actions/checkout places a checkout only under the workspace, where it
      # is an untracked path of the executor checkout ("?? _ple-experiment/").
      - name: Relocate the frozen experiment outside the executor checkout
        run: |
          test ! -e "$RUNNER_TEMP/_ple-experiment"
          mv _ple-experiment "$RUNNER_TEMP/_ple-experiment"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install existing pinned serializer and test dependencies
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          test -n "$SYSIDE_LICENSE_KEY"
          python -m pip install --disable-pip-version-check \
            "syside==0.10.3" "PyYAML==6.0.2" "pytest==8.4.2"

      - name: Resolve current executor library lock without modifying frozen inputs
        run: |
          curl -fsSL https://sysand.com/install.sh | bash
          "$HOME/.local/bin/sysand" sync
          "$HOME/.local/bin/sysand" --version > "$RUNNER_TEMP/ple-evidence/sysand-version.txt"

      # The qualification scripts record executor_source_dirty from this
      # checkout's `git status --porcelain`. These guards run the same check
      # before each script that records it, so a dirty checkout fails the run
      # here instead of producing receipts that say so.
      - name: Refuse a dirty checkout before the historical replay
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            printf 'the checkout is not clean:\n%s\n' "$dirty" >&2
            exit 1
          fi

      - name: Exercise qualification guards and historical replay
        run: |
          python -m pytest tests/test_ple_qualification.py -q
          python scripts/run_ple_qualification.py \
            --experiment "$RUNNER_TEMP/_ple-experiment" \
            --historical-export "$RUNNER_TEMP/_ple-baseline/de4sdv-pleml-gate-a-export.json" \
            --out "$RUNNER_TEMP/ple-evidence/historical-replay.json"

      - name: Refuse a dirty checkout before the scoped probes
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            printf 'the checkout is not clean:\n%s\n' "$dirty" >&2
            exit 1
          fi

      - name: Execute missing scoped PLE probes
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
          DE4SDV_PLE_ORACLE: ${{ runner.temp }}/_ple-experiment
        run: |
          python -m pytest tests/test_ple_scoped_execution.py -q
          set +e
          python scripts/run_ple_scoped_execution.py \
            --experiment "$RUNNER_TEMP/_ple-experiment" \
            --expected-executor "$SELECTED_REVISION" \
            --licensed --native-xor \
            --out "$RUNNER_TEMP/ple-scoped-execution"
          code=$?
          set -e
          mkdir -p "$RUNNER_TEMP/ple-evidence/scoped"
          cp -R "$RUNNER_TEMP/ple-scoped-execution/." "$RUNNER_TEMP/ple-evidence/scoped/"
          printf '%s\n' "$code" > "$RUNNER_TEMP/ple-evidence/scoped/cli-exit.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          scoped = Path(os.environ['RUNNER_TEMP']) / 'ple-evidence/scoped'
          receipt = json.loads((scoped / 'receipt.json').read_text())
          if receipt['execution_error'] or not receipt['fresh_serialization']:
              raise SystemExit('scoped licensed serialization failed; diagnostics retained')
          if receipt['native_xor'].get('attempted') is not True:
              raise SystemExit('scoped native evaluation was not attempted; diagnostics retained')
          if receipt['qualified'] or receipt['native_xor']['requirement_status'] != 'failed':
              raise SystemExit('scoped requirement was silently promoted')
          if (scoped / 'cli-exit.txt').read_text().strip() != '2':
              raise SystemExit('native requirement must retain failed/unsupported exit 2')
          PY

      - name: Build existing pinned ephemeral Systems Modeling API
        run: |
          git clone --filter=blob:none \
            https://github.com/Systems-Modeling/SysML-v2-API-Services.git /tmp/sysmlv2-api-services
          git -C /tmp/sysmlv2-api-services checkout 0af711b14bbcea7b240bb0a3a65817ae68302092
          curl -fsSL -o /tmp/sbt-launch.jar \
            https://repo1.maven.org/maven2/org/scala-sbt/sbt-launch/1.2.8/sbt-launch-1.2.8.jar
          (cd /tmp/sysmlv2-api-services && java -Xmx4g -jar /tmp/sbt-launch.jar stage)

      - name: Start isolated API and verify readiness
        # Outside the checkout: the service writes logs/application.log
        # relative to its working directory (#369), and the fresh serialization
        # records executor_source_dirty after it.
        working-directory: /tmp/sysmlv2-api-services
        run: |
          /tmp/sysmlv2-api-services/target/universal/stage/bin/sysml-v2-api-services \
            -J-Xmx4g -Dplay.server.http.port=9000 \
            -Dplay.evolutions.db.default.autoApply=true \
            -Dplay.http.secret.key=de4sdv-ci-ple-qualification \
            > "$RUNNER_TEMP/ple-evidence/sysml-api.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          deadline = time.monotonic() + 300
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:9000/projects', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit('ephemeral API failed readiness')
          PY

      - name: Refuse a dirty checkout before the fresh serialization
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            printf 'the checkout is not clean:\n%s\n' "$dirty" >&2
            exit 1
          fi

      - name: Fresh current-toolchain serialization and real API readback
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          python scripts/run_ple_qualification.py \
            --experiment "$RUNNER_TEMP/_ple-experiment" \
            --historical-export "$RUNNER_TEMP/_ple-baseline/de4sdv-pleml-gate-a-export.json" \
            --expected-executor "$SELECTED_REVISION" \
            --api-url http://127.0.0.1:9000 \
            --out "$RUNNER_TEMP/ple-evidence/current/receipt.json"

      - name: Retain actual observations including failed execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ple-qualification-${{ inputs.ref }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ple-evidence/
          if-no-files-found: error
          retention-days: 30
