name: deploy-viewer

# Publishes the static HTML model viewer to the native GitHub Pages URL on
# every push to main and on manual runs (workflow_dispatch).
#
# The published site shows committed content only (no local working tree):
# the generator runs with --public --no-prs and builds the pushed branch
# alone. Pages refuses a site whose uncompressed artifact is over 10 GiB, and
# one sub-site per branch and pull request head took the mirror past that
# limit on 2026-11-18, so no other revision is built here; the local server
# (python -m tools.sysml_html_viewer.serve) opens any branch or pull request.
# The production custom hostname is owned by the Caddy deployment; Pages
# remains the browse-only engineering mirror and emergency GET fallback.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate the viewer (committed content of the pushed branch)
        run: |
          python -m tools.sysml_html_viewer.generate \
            --repo . --out site --public --no-prs

      - name: Install gate dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 sysand==0.1.0

      # The repository gates read the pinned SysML dependencies, PLEML among
      # them since the switch (ADR 0022): sync the lock first, as the public
      # CI does.
      - name: Sync pinned SysML dependencies
        run: sysand sync

      - name: Repository gates
        run: |
          python scripts/check_repo.py
          python scripts/smoke_test.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
