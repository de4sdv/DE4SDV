name: Privileged Full-Model API Ingestion

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Exact full 40-character commit SHA to ingest (optional; when set it
          must equal the checked-out revision — exact-revision evidence
          refuses moving refs)
        required: false
        type: string
      reuse_ingestion_run:
        description: >-
          Reuse mode (optional): id of an earlier successful dispatch run of
          this workflow at the same ref. When set, ingest-and-validate is
          skipped and model-authority-evidence runs on that run's ingestion
          and database-snapshot artifacts (requires ref; preconditions are
          verified through the API before anything is downloaded)
        required: false
        type: string
        default: ""
  schedule:
    # One nightly full-model ingestion of main. The artifact feeds the
    # gated public API deployment and keeps a daily semantic health signal.
    - cron: "30 2 * * *"

permissions:
  contents: read

# The ingestion job builds a JVM service from source and runs the full
# Syside export + API import chain (~35-60 min serialized). It runs on main
# nightly and on demand via workflow_dispatch — never per-PR. A PR only
# needs fast validation (CI + Privileged Syside Validation); its changes
# get full ingestion coverage through the next nightly run or an explicit
# dispatch before a production deployment, which re-verifies the exact
# merged main SHA anyway (the deploy workflow refuses any other pairing).
concurrency:
  group: privileged-full-model-api-ingestion
  cancel-in-progress: false

jobs:
  ingest-and-validate:
    # Skipped in reuse mode (reuse_ingestion_run set): the model-authority job
    # then consumes the artifacts of the named earlier run instead.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      !github.event.inputs.reuse_ingestion_run
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sysml2
          POSTGRES_PASSWORD: mysecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sysml2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Validate exact-revision checkout
        run: |
          SHA="$(git rev-parse HEAD)"
          REQUESTED="${{ github.event.inputs.ref }}"
          echo "checked-out revision: $SHA"
          echo "event revision: ${{ github.sha }}"
          case "$SHA" in
            (*[!0-9a-f]*|"") echo "not a lowercase full SHA: $SHA" >&2; exit 1 ;;
          esac
          if [ "${#SHA}" != "40" ]; then
            echo "checked-out revision is not a full 40-character SHA" >&2
            exit 1
          fi
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$SHA" ]; then
            echo "requested revision $REQUESTED does not match checked-out $SHA" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Sysand and pinned model dependencies
        run: |
          curl -fsSL https://sysand.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sysand" sync

      - name: Install official Syside Automator serializer
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          test -n "$SYSIDE_LICENSE_KEY"
          python -m pip install --disable-pip-version-check \
            "syside==0.10.3" "PyYAML==6.0.2" "pytest==8.4.2" \
            -r requirements-mcp.txt

      - name: Export reviewed baseline with Syside
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          python scripts/export_sysml_api_baseline.py \
            --git-commit "$(git rev-parse HEAD)" \
            --output /tmp/de4sdv-full-model-export.json

      - name: Build pinned Systems Modeling API service
        run: |
          git clone --filter=blob:none https://github.com/Systems-Modeling/SysML-v2-API-Services.git /tmp/sysmlv2-api-services
          git -C /tmp/sysmlv2-api-services checkout 0af711b14bbcea7b240bb0a3a65817ae68302092
          curl -fsSL -o /tmp/sbt-launch.jar \
            https://repo1.maven.org/maven2/org/scala-sbt/sbt-launch/1.2.8/sbt-launch-1.2.8.jar
          (cd /tmp/sysmlv2-api-services && java -Xmx4g -jar /tmp/sbt-launch.jar stage)

      - name: Start pinned Systems Modeling API service
        run: |
          /tmp/sysmlv2-api-services/target/universal/stage/bin/sysml-v2-api-services \
            -J-Xmx4g \
            -Dplay.server.http.port=9000 \
            -Dplay.evolutions.db.default.autoApply=true \
            -Dplay.http.secret.key=de4sdv-ci-full-model-ingestion \
            > /tmp/sysml-api.log 2>&1 &
          echo $! > /tmp/sysml-api.pid
          for attempt in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:9000/projects >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sysml-api.log
          exit 1

      - name: Import and validate exact API revision
        run: |
          python scripts/import_sysml_api_baseline.py \
            --api-url http://127.0.0.1:9000 \
            --export /tmp/de4sdv-full-model-export.json \
            --binding /tmp/de4sdv-full-model-binding.json \
            --report /tmp/de4sdv-full-model-semantic-validation.json

      - name: Build candidate model-authority bundle
        # O4 Wave C2: the model authority is the only semantic authority. The
        # candidate bundle needs no API; the three batteries below run under
        # it (explicit --allow-candidate-bundle, evidence only) and the
        # model-authority-evidence job closes it. Bundle construction refuses
        # a non-empty routing residual.
        run: |
          mkdir -p /tmp/o4
          python scripts/run_model_authority_bundle.py bundle \
            --source-revision "$(git rev-parse HEAD)" \
            --out /tmp/o4
          python - <<'PY' > /tmp/o4/candidate-bundle-id
          import json
          print(json.load(open("/tmp/o4/de4sdv-model-authority-candidate-bundle.json"))["bundle_id"])
          PY
          cat /tmp/o4/candidate-bundle-id

      - name: Exercise three production semantic concerns
        run: |
          python scripts/validate_full_model_semantic_queries.py \
            --api-url http://127.0.0.1:9000 \
            --binding /tmp/de4sdv-full-model-binding.json \
            --semantic-report /tmp/de4sdv-full-model-semantic-validation.json \
            --semantic-authority model \
            --model-authority-bundle /tmp/o4/de4sdv-model-authority-candidate-bundle.json \
            --model-authority-bundle-id "$(cat /tmp/o4/candidate-bundle-id)" \
            --allow-candidate-bundle \
            --output /tmp/de4sdv-full-model-semantic-query-coverage.json

      - name: Validate governed product-line scope through API identity
        run: |
          python scripts/validate_product_line_scope_api.py \
            --api-url http://127.0.0.1:9000 \
            --binding /tmp/de4sdv-full-model-binding.json \
            --export /tmp/de4sdv-full-model-export.json \
            --semantic-authority model \
            --model-authority-bundle /tmp/o4/de4sdv-model-authority-candidate-bundle.json \
            --model-authority-bundle-id "$(cat /tmp/o4/candidate-bundle-id)" \
            --allow-candidate-bundle \
            --output /tmp/de4sdv-product-line-scope-validation.json

      - name: Exercise read-only semantic MCP tools
        run: |
          python scripts/validate_semantic_mcp.py \
            --api-url http://127.0.0.1:9000 \
            --binding /tmp/de4sdv-full-model-binding.json \
            --expected-git-revision "$(git rev-parse HEAD)" \
            --semantic-authority model \
            --model-authority-bundle /tmp/o4/de4sdv-model-authority-candidate-bundle.json \
            --model-authority-bundle-id "$(cat /tmp/o4/candidate-bundle-id)" \
            --allow-candidate-bundle \
            --output /tmp/de4sdv-semantic-mcp-validation.json

      - name: Probe O4 definition closure against fresh full-model binding
        # Read-only observation, not selection or activation. Exit 0 means a
        # report was produced; inspect closure.closed and its prerequisite.
        # Use the full-model import/read-back binding, never an O3 bundle or
        # either isolated serialization transaction's candidate binding.
        run: |
          mkdir -p /tmp/o4
          python scripts/probe_definition_migration.py \
            --root "$(pwd)" \
            --binding /tmp/de4sdv-full-model-binding.json \
            --export /tmp/de4sdv-full-model-export.json \
            --expected-git-revision "$(git rev-parse HEAD)" \
            > /tmp/o4/de4sdv-o4-definition-migration-probe.json \
            2> /tmp/o4/de4sdv-o4-definition-migration-probe.stderr.log

      - name: Produce isolated committed-candidate export (transaction 1)
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          # Fail in seconds, not after a 60-minute run, if the license secret
          # is missing from this step's environment.
          test -n "$SYSIDE_LICENSE_KEY"
          python scripts/prepare_candidate_export.py \
            --repository "$GITHUB_WORKSPACE" \
            --git-commit "$(git rev-parse HEAD)" \
            --worktree /tmp/de4sdv-candidate-checkout \
            --output /tmp/de4sdv-candidate-export.json \
            --identity /tmp/de4sdv-candidate-export-identity.json \
            --transaction-label candidate-1 \
            --baseline-export /tmp/de4sdv-full-model-export.json

      - name: Produce second independent serialization transaction (MC-14)
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          test -n "$SYSIDE_LICENSE_KEY"
          python scripts/prepare_candidate_export.py \
            --repository "$GITHUB_WORKSPACE" \
            --git-commit "$(git rev-parse HEAD)" \
            --worktree /tmp/de4sdv-candidate-checkout \
            --output /tmp/de4sdv-candidate-export-2.json \
            --identity /tmp/de4sdv-candidate-export-identity-2.json \
            --transaction-label candidate-2 \
            --reuse-checkout \
            --sync-deps=false

      - name: Import candidate transaction 1 into a distinct API project
        run: |
          python scripts/import_sysml_api_baseline.py \
            --api-url http://127.0.0.1:9000 \
            --export /tmp/de4sdv-candidate-export.json \
            --binding /tmp/de4sdv-candidate-binding.json \
            --report /tmp/de4sdv-candidate-semantic-validation.json \
            --candidate

      - name: Import candidate transaction 2 into a second distinct API project
        run: |
          python scripts/import_sysml_api_baseline.py \
            --api-url http://127.0.0.1:9000 \
            --export /tmp/de4sdv-candidate-export-2.json \
            --binding /tmp/de4sdv-candidate-binding-2.json \
            --report /tmp/de4sdv-candidate-semantic-validation-2.json \
            --candidate

      - name: MC-14 correspondence across the two independent transactions
        run: |
          python scripts/verify_reimport_correspondence.py \
            --api-url http://127.0.0.1:9000 \
            --binding-a /tmp/de4sdv-candidate-binding.json \
            --binding-b /tmp/de4sdv-candidate-binding-2.json \
            --label-a transaction-1 --label-b transaction-2 \
            --output /tmp/de4sdv-reimport-correspondence.json

      - name: Verify pilot read-back against candidate transaction 1
        run: |
          python scripts/verify_pilot_readback.py \
            --api-url http://127.0.0.1:9000 \
            --binding /tmp/de4sdv-candidate-binding.json \
            --export /tmp/de4sdv-candidate-export.json \
            --output /tmp/de4sdv-pilot-readback.json
      - name: Run production-ingestion tests
        run: |
          python -m pytest \
            tests/test_sysml_full_ingestion.py \
            tests/test_sysml_api_semantic.py \
            tests/test_semantic_mcp.py -q

      - name: Snapshot API database for the model-authority job
        # O4 Wave B: the model-authority steps run in a SEPARATE job (see
        # model-authority-evidence below) so this job keeps its own 360-minute
        # budget. The snapshot carries the exact API state those steps read
        # back; the second job re-verifies its corpus identity against the
        # export before using it. Not a deployment input; short retention.
        # Off the ingestion critical path: only a dispatch runs the model job
        # that consumes it (scheduled runs skip it), and continue-on-error
        # keeps a dump/upload failure from failing ingest-and-validate, whose
        # success the deploy and core-evidence workflows require. A missing
        # snapshot fails the model-authority job explicitly instead.
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/o4-db
          started="$(date +%s)"
          docker exec "${{ job.services.postgres.id }}" \
            pg_dump -U postgres -d sysml2 -Fc -Z 6 > /tmp/o4-db/sysml2.dump
          sha256sum /tmp/o4-db/sysml2.dump | tee /tmp/o4-db/sysml2.dump.sha256
          echo "snapshot bytes: $(stat -c %s /tmp/o4-db/sysml2.dump)"
          echo "snapshot seconds: $(( $(date +%s) - started ))"
          ls -la /tmp/o4-db

      - name: Upload API database snapshot for the model-authority job
        # Deliberately NOT named full-model-api-ingestion-*: the deploy and
        # core-evidence workflows select exactly one artifact by that prefix.
        # Same condition and continue-on-error as the snapshot step (above).
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: model-authority-api-db-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            /tmp/o4-db/sysml2.dump
            /tmp/o4-db/sysml2.dump.sha256

      - name: Trim API service log for upload
        # The raw API-service log reaches multi-GB per run; reviewers only ever
        # need the tail (where failures surface). Upload a bounded tail so
        # artifact downloads stay small and never blow up review workstations.
        if: always()
        run: |
          if [ -f /tmp/sysml-api.log ]; then
            tail -c 100000000 /tmp/sysml-api.log > /tmp/sysml-api.tail.log
          fi

      - name: Upload exact-head ingestion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-model-api-ingestion-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/de4sdv-full-model-binding.json
            /tmp/de4sdv-full-model-semantic-validation.json
            /tmp/de4sdv-full-model-semantic-query-coverage.json
            /tmp/o4/de4sdv-model-authority-candidate-bundle.json
            /tmp/o4/candidate-bundle-id
            /tmp/o4/de4sdv-o4-definition-migration-probe.json
            /tmp/o4/de4sdv-o4-definition-migration-probe.stderr.log
            /tmp/de4sdv-product-line-scope-validation.json
            /tmp/de4sdv-semantic-mcp-validation.json
            /tmp/de4sdv-full-model-export.json
            /tmp/de4sdv-candidate-export.json
            /tmp/de4sdv-candidate-export-identity.json
            /tmp/de4sdv-candidate-export-2.json
            /tmp/de4sdv-candidate-export-identity-2.json
            /tmp/de4sdv-candidate-binding.json
            /tmp/de4sdv-candidate-binding-2.json
            /tmp/de4sdv-candidate-semantic-validation.json
            /tmp/de4sdv-candidate-semantic-validation-2.json
            /tmp/de4sdv-reimport-correspondence.json
            /tmp/de4sdv-pilot-readback.json
            /tmp/sysml-api.tail.log

  # O4 model-authority evidence (owner decisions 2026-10-07: 4, 6; Wave C2:
  # the model authority is the only authority, there is no O3/legacy runtime
  # to compare against).
  #
  # Separate job, not more steps in ingest-and-validate: that job runs the
  # export, the full import, two candidate transactions and the batteries
  # within its 360-minute cap. This job restores the API database snapshot of
  # the same run (no re-export, no Syside licence): restore + API build/start
  # ~20 min, read-back ~10, population delta ~10, bundle/coverage ~10, model
  # runtime answers (one runtime over the migrated identity set), close ~1.
  # The restored corpus is re-verified against the export (decision-13
  # read-back step) before any claim. The three batteries ran in
  # ingest-and-validate under the same candidate bundle; close checks that
  # their outputs name this revision and this mab id.
  #
  # Verdicts: the read-back, answers and close steps exit non-zero when
  # their gate fails (reports are still written and uploaded); the
  # requirement-population delta is measured evidence only (a difference
  # from the recorded 27/28 is reported, never adjusted, and does not fail
  # the job). continue-on-error keeps this job from turning the ingestion
  # run red: the deploy and core-evidence workflows consume ingest-and-
  # validate and require a successful run. Activation consumes ONLY a
  # successful model-authority-evidence job whose eligibility artifact says
  # activation_eligible=true, plus the owner's decision naming the mab id
  # (docs/method-conformance/o4/model-authority-activation.md).
  #
  # Reuse mode (reuse_ingestion_run input): ingest-and-validate is skipped and
  # this job consumes the artifacts of that earlier dispatch run at the same
  # ref, after verifying through the API that the run, its ingest job and both
  # artifacts are eligible. actions: read is needed only for that cross-run
  # verification and download, so only this job gets it.
  model-authority-evidence:
    needs: ingest-and-validate
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      (needs.ingest-and-validate.result == 'success' ||
      (github.event.inputs.reuse_ingestion_run != '' && needs.ingest-and-validate.result == 'skipped'))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sysml2
          POSTGRES_PASSWORD: mysecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sysml2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Validate exact-revision checkout
        run: |
          SHA="$(git rev-parse HEAD)"
          REQUESTED="${{ github.event.inputs.ref }}"
          echo "checked-out revision: $SHA"
          case "$SHA" in
            (*[!0-9a-f]*|"") echo "not a lowercase full SHA: $SHA" >&2; exit 1 ;;
          esac
          if [ "${#SHA}" != "40" ]; then
            echo "checked-out revision is not a full 40-character SHA" >&2
            exit 1
          fi
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$SHA" ]; then
            echo "requested revision $REQUESTED does not match checked-out $SHA" >&2
            exit 1
          fi

      - name: Materialize workflow-revision CI helpers
        # The reuse-precondition and restore-proof helpers are workflow wiring:
        # they come from this workflow's own revision (github.sha), not from
        # the evidence checkout. A reuse dispatch checks out an older ref that
        # may predate them (run 37677500924 was at ff0311b). fetch-depth: 0
        # makes github.sha available in the checkout. The model-evidence
        # scripts themselves still run from the checked-out ref.
        run: |
          mkdir -p /tmp/de4sdv-ci
          for helper in verify_reuse_ingestion_run.py verify_restored_api_corpus.py; do
            git show "${{ github.sha }}:scripts/$helper" > "/tmp/de4sdv-ci/$helper"
          done
          sha256sum /tmp/de4sdv-ci/*.py

      - name: Verify the reused ingestion run (reuse mode)
        # Every precondition read through the GitHub API before anything is
        # downloaded: same workflow, workflow_dispatch, completed, head_sha ==
        # ref, ingest-and-validate concluded success, and both artifacts exist
        # once, unexpired, from ref. Artifact names come from the ref input,
        # never from github.sha (a reuse dispatch runs on a newer main). Writes
        # the provenance record uploaded with the evidence. Stdlib only.
        if: github.event.inputs.reuse_ingestion_run != ''
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 /tmp/de4sdv-ci/verify_reuse_ingestion_run.py \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.event.inputs.reuse_ingestion_run }}" \
            --ref "${{ github.event.inputs.ref }}" \
            --current-run-id "${{ github.run_id }}" \
            --output /tmp/o4/de4sdv-o4-ingestion-source.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Sysand and pinned model dependencies
        run: |
          curl -fsSL https://sysand.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sysand" sync
          python -m pip install --disable-pip-version-check \
            "PyYAML==6.0.2" "pytest==8.4.2" -r requirements-mcp.txt

      - name: Download same-run ingestion evidence
        # Restores the exact /tmp paths the closure attestation hashes.
        if: github.event.inputs.reuse_ingestion_run == ''
        uses: actions/download-artifact@v4
        with:
          name: full-model-api-ingestion-${{ github.sha }}
          path: /tmp

      - name: Download same-run API database snapshot
        # The snapshot steps of ingest-and-validate are continue-on-error, so
        # the artifact can be missing; the next step turns that into one
        # explicit failure instead of a download error.
        if: github.event.inputs.reuse_ingestion_run == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: model-authority-api-db-${{ github.sha }}
          path: /tmp/o4-db

      - name: Download reused-run ingestion evidence (reuse mode)
        # The exact artifact object verified above (by id), same /tmp layout.
        if: github.event.inputs.reuse_ingestion_run != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.reuse.outputs.ingestion_artifact_id }}
          run-id: ${{ github.event.inputs.reuse_ingestion_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: /tmp

      - name: Download reused-run API database snapshot (reuse mode)
        if: github.event.inputs.reuse_ingestion_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.reuse.outputs.snapshot_artifact_id }}
          run-id: ${{ github.event.inputs.reuse_ingestion_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: /tmp/o4-db

      - name: Require the same-run API database snapshot
        run: |
          for path in /tmp/o4-db/sysml2.dump /tmp/o4-db/sysml2.dump.sha256; do
            if [ ! -s "$path" ]; then
              echo "::error::same-run API database snapshot missing ($path): the artifact model-authority-api-db-${{ github.event.inputs.reuse_ingestion_run != '' && github.event.inputs.ref || github.sha }} was not produced or not uploaded by ingest-and-validate (its snapshot steps are continue-on-error). No model-authority evidence is produced; re-dispatch the ingestion at this SHA."
              exit 1
            fi
          done
          echo "snapshot bytes: $(stat -c %s /tmp/o4-db/sysml2.dump)"

      - name: Verify inputs are bound to the checked-out revision
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          (cd /tmp/o4-db && sha256sum -c sysml2.dump.sha256)
          python - "$SHA" <<'PY'
          import json, sys
          sha = sys.argv[1]
          for path, key in (("/tmp/de4sdv-full-model-export.json", "git_commit"),
                            ("/tmp/de4sdv-full-model-binding.json", "git_commit"),
                            ("/tmp/o4/de4sdv-model-authority-candidate-bundle.json", "git_revision")):
              value = json.load(open(path, encoding="utf-8")).get(key)
              if value != sha:
                  raise SystemExit(f"{path} {key}={value!r} != checked-out {sha}")
          print("same-run inputs bound to", sha)
          PY

      - name: Restore API database snapshot
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            pg_restore -U postgres -d sysml2 --no-owner --exit-on-error < /tmp/o4-db/sysml2.dump

      - name: Build pinned Systems Modeling API service
        # Unlike ingest-and-validate (empty database, create-drop intended),
        # this job serves a pg_restore'd database: the pinned build's
        # hibernate.hbm2ddl.auto=create-drop would recreate the schema at
        # startup and wipe it (run 37677500924 served 0 elements). Patch it to
        # update before staging, exactly as deployment/sysml2-api/Dockerfile
        # does for production; fail closed if upstream content differs.
        run: |
          git clone --filter=blob:none https://github.com/Systems-Modeling/SysML-v2-API-Services.git /tmp/sysmlv2-api-services
          git -C /tmp/sysmlv2-api-services checkout 0af711b14bbcea7b240bb0a3a65817ae68302092
          # >>> schema-preservation patch
          CONF=/tmp/sysmlv2-api-services/conf/META-INF/persistence.xml
          if ! grep -q 'hibernate.hbm2ddl.auto" value="create-drop"' "$CONF"; then
            echo "::error::schema-preservation patch: expected hibernate.hbm2ddl.auto=create-drop not found in $CONF; refusing to start the API on the restored database with an unknown schema policy"
            exit 1
          fi
          sed -i 's/hibernate.hbm2ddl.auto" value="create-drop"/hibernate.hbm2ddl.auto" value="update"/' "$CONF"
          if grep -q 'create-drop' "$CONF" || ! grep -q 'hibernate.hbm2ddl.auto" value="update"' "$CONF"; then
            echo "::error::schema-preservation patch: create-drop still present (or update missing) in $CONF after the edit; the restored database would be wiped"
            exit 1
          fi
          grep -n 'hibernate.hbm2ddl.auto' "$CONF"
          # <<< schema-preservation patch
          curl -fsSL -o /tmp/sbt-launch.jar \
            https://repo1.maven.org/maven2/org/scala-sbt/sbt-launch/1.2.8/sbt-launch-1.2.8.jar
          (cd /tmp/sysmlv2-api-services && java -Xmx4g -jar /tmp/sbt-launch.jar stage)

      - name: Start pinned Systems Modeling API service on the restored database
        run: |
          /tmp/sysmlv2-api-services/target/universal/stage/bin/sysml-v2-api-services \
            -J-Xmx4g \
            -Dplay.server.http.port=9000 \
            -Dplay.evolutions.db.default.autoApply=true \
            -Dplay.http.secret.key=de4sdv-ci-full-model-ingestion \
            > /tmp/sysml-api.log 2>&1 &
          for attempt in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:9000/projects >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sysml-api.log
          exit 1

      - name: Prove the restored API serves the export corpus
        # Fail fast, before any evidence step: the binding's project/commit
        # exist and the element count (and id set) read through the API equal
        # the export's, and the semantic report's element_count. A refusal
        # names the cause (e.g. schema wiped at startup) and skips every
        # evidence step below; the proof report and API log are still uploaded.
        id: restore-proof
        env:
          # The helper comes from /tmp/de4sdv-ci; its de4sdv read path (the
          # shared SysMLRepository) comes from the evidence checkout.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/o4
          python /tmp/de4sdv-ci/verify_restored_api_corpus.py \
            --api-url http://127.0.0.1:9000 \
            --binding /tmp/de4sdv-full-model-binding.json \
            --export /tmp/de4sdv-full-model-export.json \
            --semantic-report /tmp/de4sdv-full-model-semantic-validation.json \
            --output /tmp/o4/de4sdv-o4-restored-corpus-proof.json

      - name: Decision-13 read-back of the implied verification anchors (restored same-run API snapshot)
        # Owner decision 4 (2026-10-07): a failure BLOCKS activation. Also the
        # restored-database identity check (live element set == export,
        # element count == semantic report, binding project/commit). Exit 2
        # = read-back failed (report written; close derives the gate from it).
        run: |
          mkdir -p /tmp/o4
          python scripts/readback_verification_anchors.py \
            --api-url http://127.0.0.1:9000 \
            --binding /tmp/de4sdv-full-model-binding.json \
            --export /tmp/de4sdv-full-model-export.json \
            --semantic-report /tmp/de4sdv-full-model-semantic-validation.json \
            --api-source restored-same-run-snapshot \
            --git-revision "$(git rev-parse HEAD)" \
            --output /tmp/o4/de4sdv-o4-verification-anchor-readback.json

      - name: Measure the Wave A Requirement-population delta
        # Owner decision 6: measured evidence, not an activation gate. Exit 2
        # (measured, differs from the recorded 27/28) is reported in the
        # artifact and tolerated; any other non-zero exit fails the step.
        if: ${{ !cancelled() && steps.restore-proof.outcome == 'success' }}
        run: |
          set +e
          python scripts/measure_requirement_population_delta.py \
            --api-url http://127.0.0.1:9000 \
            --binding /tmp/de4sdv-full-model-binding.json \
            --export /tmp/de4sdv-full-model-export.json \
            --semantic-authority model \
            --model-authority-bundle /tmp/o4/de4sdv-model-authority-candidate-bundle.json \
            --model-authority-bundle-id "$(cat /tmp/o4/candidate-bundle-id)" \
            --allow-candidate-bundle \
            --git-revision "$(git rev-parse HEAD)" \
            --output /tmp/o4/de4sdv-o4-requirement-population-delta.json
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::warning::requirement-population delta differs from the recorded expectation; see the artifact"
            exit 0
          fi
          exit "$rc"

      - name: Rebuild the candidate model-authority bundle (must equal the batteries' bundle)
        if: ${{ !cancelled() && steps.restore-proof.outcome == 'success' }}
        run: |
          set -euo pipefail
          expected="$(cat /tmp/o4/candidate-bundle-id)"
          python scripts/run_model_authority_bundle.py bundle \
            --source-revision "$(git rev-parse HEAD)" \
            --out /tmp/o4
          rebuilt="$(python -c 'import json;print(json.load(open("/tmp/o4/de4sdv-model-authority-candidate-bundle.json"))["bundle_id"])')"
          if [ "$rebuilt" != "$expected" ]; then
            echo "::error::rebuilt candidate bundle $rebuilt differs from the ingest job's $expected (the batteries ran under the latter)"
            exit 1
          fi

      - name: Model-projection coverage report against the candidate bundle
        if: ${{ !cancelled() && steps.restore-proof.outcome == 'success' }}
        run: |
          python scripts/check_model_projection_coverage.py \
            --json /tmp/o4/de4sdv-o4-model-projection-coverage.json \
            --bundle /tmp/o4/de4sdv-model-authority-candidate-bundle.json

      - name: Model runtime answers over the migrated identity set (EvidenceContract discriminator, K pair)
        if: ${{ !cancelled() && steps.restore-proof.outcome == 'success' }}
        run: |
          python scripts/run_model_authority_bundle.py compare \
            --model /tmp/o4/de4sdv-model-authority-candidate-bundle.json \
            --out /tmp/o4 \
            --api-url http://127.0.0.1:9000 \
            --binding /tmp/de4sdv-full-model-binding.json \
            --export /tmp/de4sdv-full-model-export.json \
            --git-revision "$(git rev-parse HEAD)"

      - name: Close the model-authority bundle (activation eligibility)
        # Every gate is derived from its artifact and sha256-bound to it.
        # Exit 2 = closed but not activation-eligible.
        if: ${{ !cancelled() && steps.restore-proof.outcome == 'success' }}
        run: |
          python scripts/run_model_authority_bundle.py close \
            --model /tmp/o4/de4sdv-model-authority-candidate-bundle.json \
            --binding /tmp/de4sdv-full-model-binding.json \
            --git-revision "$(git rev-parse HEAD)" \
            --definition-probe /tmp/o4/de4sdv-o4-definition-migration-probe.json \
            --coverage /tmp/o4/de4sdv-o4-model-projection-coverage.json \
            --answers /tmp/o4/de4sdv-model-authority-answers.json \
            --readback /tmp/o4/de4sdv-o4-verification-anchor-readback.json \
            --full-model-semantic-queries /tmp/de4sdv-full-model-semantic-query-coverage.json \
            --product-line-scope /tmp/de4sdv-product-line-scope-validation.json \
            --semantic-mcp /tmp/de4sdv-semantic-mcp-validation.json \
            --out /tmp/o4

      - name: Trim API service log for upload
        if: always()
        run: |
          if [ -f /tmp/sysml-api.log ]; then
            tail -c 50000000 /tmp/sysml-api.log > /tmp/o4/sysml-api.tail.log
          fi

      - name: Upload model-authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-authority-evidence-${{ github.event.inputs.reuse_ingestion_run != '' && github.event.inputs.ref || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/o4/de4sdv-o4-ingestion-source.json
            /tmp/o4/de4sdv-o4-restored-corpus-proof.json
            /tmp/o4/de4sdv-o4-verification-anchor-readback.json
            /tmp/o4/de4sdv-o4-requirement-population-delta.json
            /tmp/o4/de4sdv-model-authority-candidate-bundle.json
            /tmp/o4/de4sdv-o4-model-projection-coverage.json
            /tmp/o4/de4sdv-model-authority-answers.json
            /tmp/o4/de4sdv-model-authority-bundle.json
            /tmp/o4/de4sdv-model-authority-closure-attestation.json
            /tmp/o4/de4sdv-model-authority-activation-eligibility.json
            /tmp/o4/sysml-api.tail.log
