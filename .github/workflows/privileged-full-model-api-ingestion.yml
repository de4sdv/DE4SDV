name: Privileged Full-Model API Ingestion

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Exact full 40-character commit SHA to ingest (optional; when set it
          must equal the tip of the ref the run is dispatched from, the
          revision the run and its artifact are named after — exact-revision
          evidence refuses moving refs)
        required: false
        type: string

permissions:
  contents: read

# The ingestion job builds a JVM service from source and runs the full
# Syside export + API import chain, the batteries and the release evidence
# (2.5 to 5 hours per run). It runs on demand only, via workflow_dispatch,
# once per release SHA: never per-PR and never on a schedule. A PR only
# needs fast validation (CI + Privileged Syside Validation); its changes get
# full ingestion coverage when a release dispatches the exact merged main
# SHA, and the deploy workflow refuses any other pairing.
concurrency:
  group: privileged-full-model-api-ingestion
  cancel-in-progress: false

# Release evidence (owner decision 2026-10-11: the model-authority bundle,
# closure and activation ceremony is retired). This run is the release's only
# privileged evidence: the licensed export, the CI import rehearsal with its
# three batteries, and the mechanical release checks over the export
# (scripts/check_release_evidence.py). The deploy then needs only the
# sysml-api-production approval (deployment/README.md, "Release").
jobs:
  ingest-and-validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sysml2
          POSTGRES_PASSWORD: mysecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sysml2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Validate exact-revision checkout
        run: |
          SHA="$(git rev-parse HEAD)"
          REQUESTED="${{ github.event.inputs.ref }}"
          echo "checked-out revision: $SHA"
          echo "event revision: ${{ github.sha }}"
          case "$SHA" in
            (*[!0-9a-f]*|"") echo "not a lowercase full SHA: $SHA" >&2; exit 1 ;;
          esac
          if [ "${#SHA}" != "40" ]; then
            echo "checked-out revision is not a full 40-character SHA" >&2
            exit 1
          fi
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$SHA" ]; then
            echo "requested revision $REQUESTED does not match checked-out $SHA" >&2
            exit 1
          fi
          # The run's head_sha and the artifact name are the dispatch
          # revision, and the deploy pairs them with its git_sha. Ingesting
          # any other commit would publish evidence under the wrong name.
          if [ "$SHA" != "${{ github.sha }}" ]; then
            echo "checked-out $SHA is not the dispatch revision ${{ github.sha }}; dispatch from a ref whose tip is the revision to ingest" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      # The deploy host's client version (deploy-public-sysml-api.yml), never
      # the newest release: the release archive is checked by its SHA-256 first.
      - name: Install Sysand and pinned model dependencies
        run: |
          SYSAND_VERSION=0.2.1
          SYSAND_ASSET=sysand-linux-x86_64-gnu.tar.gz
          SYSAND_SHA256=8b743d8270071a1141f6b1c0a07815407db5517e5b4a0bb4f38a9c39b2112bd8
          curl -fsSL -o "$RUNNER_TEMP/$SYSAND_ASSET" \
            "https://github.com/sensmetry/sysand/releases/download/v$SYSAND_VERSION/$SYSAND_ASSET"
          echo "$SYSAND_SHA256  $RUNNER_TEMP/$SYSAND_ASSET" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/_sysand" "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$SYSAND_ASSET" -C "$RUNNER_TEMP/_sysand"
          install -m 755 "$RUNNER_TEMP/_sysand/sysand" "$HOME/.local/bin/sysand"
          test "$("$HOME/.local/bin/sysand" --version)" = "sysand $SYSAND_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sysand" sync

      - name: Install official Syside Automator serializer
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          test -n "$SYSIDE_LICENSE_KEY"
          python -m pip install --disable-pip-version-check \
            "syside==0.10.3" "PyYAML==6.0.2" "pytest==8.4.2" \
            -r requirements-mcp.txt

      - name: Export reviewed baseline with Syside
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          python scripts/export_sysml_api_baseline.py \
            --git-commit "$(git rev-parse HEAD)" \
            --output /tmp/de4sdv-full-model-export.json

      # CI import rehearsal (the API build, start and import below, and the
      # three batteries that read the imported API): kept for two releases
      # after the release-ceremony retirement (owner decision 2026-10-11),
      # then dropped. The deploy repeats the same import with the same
      # full-payload read-back; after the drop the batteries move to the
      # export like scripts/check_release_evidence.py.
      - name: Build pinned Systems Modeling API service
        run: |
          git clone --filter=blob:none https://github.com/Systems-Modeling/SysML-v2-API-Services.git /tmp/sysmlv2-api-services
          git -C /tmp/sysmlv2-api-services checkout 0af711b14bbcea7b240bb0a3a65817ae68302092
          curl -fsSL -o /tmp/sbt-launch.jar \
            https://repo1.maven.org/maven2/org/scala-sbt/sbt-launch/1.2.8/sbt-launch-1.2.8.jar
          (cd /tmp/sysmlv2-api-services && java -Xmx4g -jar /tmp/sbt-launch.jar stage)

      - name: Start pinned Systems Modeling API service
        # Outside the checkout: the service writes logs/application.log
        # relative to its working directory, and the runtime's startup check
        # in the batteries and the release evidence refuses a checkout with
        # untracked files.
        working-directory: /tmp/sysmlv2-api-services
        run: |
          /tmp/sysmlv2-api-services/target/universal/stage/bin/sysml-v2-api-services \
            -J-Xmx4g \
            -Dplay.server.http.port=9000 \
            -Dplay.evolutions.db.default.autoApply=true \
            -Dplay.http.secret.key=de4sdv-ci-full-model-ingestion \
            > /tmp/sysml-api.log 2>&1 &
          echo $! > /tmp/sysml-api.pid
          for attempt in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:9000/projects >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sysml-api.log
          exit 1

      # The runtime's startup check (the batteries, the release evidence)
      # refuses a checkout with changed or untracked paths. These guards run
      # the same check before each long phase, so a dirty checkout fails the
      # run in minutes instead of hours.
      - name: Refuse a dirty checkout before the import
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            printf 'the checkout is not clean:\n%s\n' "$dirty" >&2
            exit 1
          fi

      - name: Import and validate exact API revision
        run: |
          python scripts/import_sysml_api_baseline.py \
            --api-url http://127.0.0.1:9000 \
            --export /tmp/de4sdv-full-model-export.json \
            --binding /tmp/de4sdv-full-model-binding.json \
            --report /tmp/de4sdv-full-model-semantic-validation.json

      - name: Exercise three production semantic concerns
        run: |
          python scripts/validate_full_model_semantic_queries.py \
            --api-url http://127.0.0.1:9000 \
            --binding /tmp/de4sdv-full-model-binding.json \
            --semantic-report /tmp/de4sdv-full-model-semantic-validation.json \
            --output /tmp/de4sdv-full-model-semantic-query-coverage.json

      - name: Validate governed product-line scope through API identity
        run: |
          python scripts/validate_product_line_scope_api.py \
            --api-url http://127.0.0.1:9000 \
            --binding /tmp/de4sdv-full-model-binding.json \
            --export /tmp/de4sdv-full-model-export.json \
            --output /tmp/de4sdv-product-line-scope-validation.json

      - name: Exercise read-only semantic MCP tools
        run: |
          python scripts/validate_semantic_mcp.py \
            --api-url http://127.0.0.1:9000 \
            --binding /tmp/de4sdv-full-model-binding.json \
            --expected-git-revision "$(git rev-parse HEAD)" \
            --output /tmp/de4sdv-semantic-mcp-validation.json

      - name: Produce isolated committed-candidate export (transaction 1)
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          # Fail in seconds, not after a 60-minute run, if the license secret
          # is missing from this step's environment.
          test -n "$SYSIDE_LICENSE_KEY"
          python scripts/prepare_candidate_export.py \
            --repository "$GITHUB_WORKSPACE" \
            --git-commit "$(git rev-parse HEAD)" \
            --worktree /tmp/de4sdv-candidate-checkout \
            --output /tmp/de4sdv-candidate-export.json \
            --identity /tmp/de4sdv-candidate-export-identity.json \
            --transaction-label candidate-1 \
            --baseline-export /tmp/de4sdv-full-model-export.json

      - name: Produce second independent serialization transaction (MC-14)
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          test -n "$SYSIDE_LICENSE_KEY"
          python scripts/prepare_candidate_export.py \
            --repository "$GITHUB_WORKSPACE" \
            --git-commit "$(git rev-parse HEAD)" \
            --worktree /tmp/de4sdv-candidate-checkout \
            --output /tmp/de4sdv-candidate-export-2.json \
            --identity /tmp/de4sdv-candidate-export-identity-2.json \
            --transaction-label candidate-2 \
            --reuse-checkout \
            --sync-deps=false

      - name: Refuse a dirty checkout before the candidate imports
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            printf 'the checkout is not clean:\n%s\n' "$dirty" >&2
            exit 1
          fi

      - name: Import candidate transaction 1 into a distinct API project
        run: |
          python scripts/import_sysml_api_baseline.py \
            --api-url http://127.0.0.1:9000 \
            --export /tmp/de4sdv-candidate-export.json \
            --binding /tmp/de4sdv-candidate-binding.json \
            --report /tmp/de4sdv-candidate-semantic-validation.json \
            --candidate

      - name: Import candidate transaction 2 into a second distinct API project
        run: |
          python scripts/import_sysml_api_baseline.py \
            --api-url http://127.0.0.1:9000 \
            --export /tmp/de4sdv-candidate-export-2.json \
            --binding /tmp/de4sdv-candidate-binding-2.json \
            --report /tmp/de4sdv-candidate-semantic-validation-2.json \
            --candidate

      - name: MC-14 correspondence across the two independent transactions
        run: |
          python scripts/verify_reimport_correspondence.py \
            --api-url http://127.0.0.1:9000 \
            --binding-a /tmp/de4sdv-candidate-binding.json \
            --binding-b /tmp/de4sdv-candidate-binding-2.json \
            --label-a transaction-1 --label-b transaction-2 \
            --output /tmp/de4sdv-reimport-correspondence.json

      - name: Verify pilot read-back against candidate transaction 1
        run: |
          python scripts/verify_pilot_readback.py \
            --api-url http://127.0.0.1:9000 \
            --binding /tmp/de4sdv-candidate-binding.json \
            --export /tmp/de4sdv-candidate-export.json \
            --output /tmp/de4sdv-pilot-readback.json
      - name: Release evidence over the export
        # The mechanical release checks (revision, export digest, served
        # model, binding and kernel bindings, the runtime answers over the
        # export, coverage, battery identities). They replace the per-release
        # acceptance package and the deployed-API closure. Runs before the
        # tests below, which may write into the checkout: the startup check
        # inside it requires a clean tree.
        run: |
          python scripts/check_release_evidence.py \
            --export /tmp/de4sdv-full-model-export.json \
            --binding /tmp/de4sdv-full-model-binding.json \
            --semantic-report /tmp/de4sdv-full-model-semantic-validation.json \
            --query-coverage /tmp/de4sdv-full-model-semantic-query-coverage.json \
            --scope-validation /tmp/de4sdv-product-line-scope-validation.json \
            --mcp-validation /tmp/de4sdv-semantic-mcp-validation.json \
            --output /tmp/de4sdv-release-evidence.json

      - name: Run production-ingestion tests
        run: |
          python -m pytest \
            tests/test_sysml_full_ingestion.py \
            tests/test_sysml_api_semantic.py \
            tests/test_semantic_mcp.py -q

      - name: Trim API service log for upload
        # The raw API-service log reaches multi-GB per run; reviewers only ever
        # need the tail (where failures surface). Upload a bounded tail so
        # artifact downloads stay small and never blow up review workstations.
        if: always()
        run: |
          if [ -f /tmp/sysml-api.log ]; then
            tail -c 100000000 /tmp/sysml-api.log > /tmp/sysml-api.tail.log
          fi

      - name: Upload exact-head ingestion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-model-api-ingestion-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/de4sdv-full-model-binding.json
            /tmp/de4sdv-full-model-semantic-validation.json
            /tmp/de4sdv-full-model-semantic-query-coverage.json
            /tmp/de4sdv-release-evidence.json
            /tmp/de4sdv-product-line-scope-validation.json
            /tmp/de4sdv-semantic-mcp-validation.json
            /tmp/de4sdv-full-model-export.json
            /tmp/de4sdv-candidate-export.json
            /tmp/de4sdv-candidate-export-identity.json
            /tmp/de4sdv-candidate-export-2.json
            /tmp/de4sdv-candidate-export-identity-2.json
            /tmp/de4sdv-candidate-binding.json
            /tmp/de4sdv-candidate-binding-2.json
            /tmp/de4sdv-candidate-semantic-validation.json
            /tmp/de4sdv-candidate-semantic-validation-2.json
            /tmp/de4sdv-reimport-correspondence.json
            /tmp/de4sdv-pilot-readback.json
            /tmp/sysml-api.tail.log
