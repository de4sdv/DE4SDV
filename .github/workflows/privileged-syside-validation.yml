name: Privileged Syside Validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to validate after maintainer review"
        required: true
        default: "main"
      model_paths:
        description: "Space-separated model files or directories to validate together"
        required: true
        default: "textual-notation-of-model model-based-product-line-engineering/product-models"
  pull_request:
    paths:
      - "textual-notation-of-model/**/*.sysml"
      - "model-based-product-line-engineering/product-models/**/*.sysml"
      - "model-based-product-line-engineering/feature-models/**/*.yaml"
      - "model-based-product-line-engineering/feature-configurations/**/*.yaml"
      - "tools/configure_variant.py"
      - "scripts/render_grid_csv.py"
      - "scripts/check_svg_view_materialization.py"
      - "scripts/check_committed_view_artifacts.py"
      - "scripts/generate_view_index.py"
      - "textual-notation-of-model/packages/features/middleware/VIEWS.md"
      - "textual-notation-of-model/packages/features/middleware/diagrams/**"
      - ".project.json"
      - "sysand-lock.toml"
      - "textual-notation-of-model/**/.project.json"
      - "textual-notation-of-model/**/.meta.json"
      - ".github/workflows/privileged-syside-validation.yml"
  push:
    branches: [ main ]
    paths:
      - "textual-notation-of-model/**/*.sysml"
      - "model-based-product-line-engineering/product-models/**/*.sysml"
      - "model-based-product-line-engineering/feature-models/**/*.yaml"
      - "model-based-product-line-engineering/feature-configurations/**/*.yaml"
      - "tools/configure_variant.py"
      - "scripts/render_grid_csv.py"
      - "scripts/check_svg_view_materialization.py"
      - "scripts/check_committed_view_artifacts.py"
      - "scripts/generate_view_index.py"
      - "textual-notation-of-model/packages/features/middleware/VIEWS.md"
      - "textual-notation-of-model/packages/features/middleware/diagrams/**"
      - ".project.json"
      - "sysand-lock.toml"
      - "textual-notation-of-model/**/.project.json"
      - "textual-notation-of-model/**/.meta.json"
      - ".github/workflows/privileged-syside-validation.yml"

permissions:
  contents: read

jobs:
  syside-validation:
    name: Licensed SysML validation
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["orkunyilmaz", "de4sdv"]'), github.event.pull_request.user.login)
      )
    runs-on: ubuntu-latest
    env:
      MODEL_PATHS: ${{ inputs.model_paths || 'textual-notation-of-model model-based-product-line-engineering/product-models' }}
    steps:
      - name: Checkout reviewed ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Check licensed Syside secret
        id: syside-secret
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          if [ -z "${SYSIDE_LICENSE_KEY}" ]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "SYSIDE_LICENSE_KEY is not configured as a repository secret." >&2
            echo "Add it under Settings -> Secrets and variables -> Actions before running privileged validation." >&2
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              exit 1
            fi
            echo "Skipping licensed validation for ${GITHUB_EVENT_NAME} until the secret is configured."
            exit 0
          fi
          echo "available=true" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        if: steps.syside-secret.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java (Modeler CLI runtime)
        if: steps.syside-secret.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Syside Modeler CLI
        if: steps.syside-secret.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          SYSIDE_VERSION="0.10.3"
          SYSIDE_FILE="syside-${SYSIDE_VERSION}-x86_64-linux-glibc.tar.xz"
          SYSIDE_URL="https://gitlab.com/api/v4/projects/sensmetry%2Fpublic%2Fsyside/packages/generic/syside-modeler-cli/${SYSIDE_VERSION}/${SYSIDE_FILE}"
          curl -fL -o /tmp/${SYSIDE_FILE} "${SYSIDE_URL}"
          mkdir -p ~/.local
          tar -xJf /tmp/${SYSIDE_FILE} --directory ~/.local
          echo "~/.local/bin" >> "${GITHUB_PATH}"
          syside --version

      - name: Resolve pinned SysML library dependencies
        if: steps.syside-secret.outputs.available == 'true'
        run: |
          python -m pip install sysand==0.1.0
          sysand sync

      - name: Validate model path input
        if: steps.syside-secret.outputs.available == 'true'
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          model_paths = os.environ["MODEL_PATHS"].split()
          if not model_paths:
              print("At least one model path is required.", file=sys.stderr)
              sys.exit(1)
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for model_path in model_paths:
              if model_path.startswith("-") or not re.fullmatch(
                  r"[A-Za-z0-9._/-]+", model_path
              ):
                  print(f"Unsafe model path: {model_path}", file=sys.stderr)
                  sys.exit(1)
              candidate = Path(model_path)
              if candidate.is_absolute() or ".." in candidate.parts:
                  print(f"Unsafe model path: {model_path}", file=sys.stderr)
                  sys.exit(1)
              try:
                  resolved = (workspace / candidate).resolve(strict=True)
              except OSError as exc:
                  print(f"Invalid model path {model_path}: {exc}", file=sys.stderr)
                  sys.exit(1)
              if not resolved.is_relative_to(workspace):
                  print(f"Model path escapes checkout: {model_path}", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Run Syside validation
        if: steps.syside-secret.outputs.available == 'true'
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          echo "Running licensed Syside validation for: ${MODEL_PATHS}"
          read -r -a model_paths <<< "${MODEL_PATHS}"
          syside check "${model_paths[@]}"

      - name: Generate view diagrams (Labs)
        if: steps.syside-secret.outputs.available == 'true'
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          echo "Generating diagrams for views under: ${MODEL_PATHS}"
          read -r -a model_paths <<< "${MODEL_PATHS}"
          SYSIDE_VIEWS_SOURCE=".sysand/lib/sensmetry-syside-views_0.10.3/SysideViews.sysml"
          test -f "${SYSIDE_VIEWS_SOURCE}"
          syside viz view "${model_paths[@]}" \
            --include "${SYSIDE_VIEWS_SOURCE}" \
            --format svg \
            --output-dir diagrams \
            --exclude "textual-notation-of-model/snapshots/**"

      - name: Check critical view materialization
        if: steps.syside-secret.outputs.available == 'true'
        run: |
          python scripts/check_svg_view_materialization.py \
            diagrams/diagram-aebsSimulationPhysicalContextExchangeView.svg \
            --view-name aebsSimulationPhysicalContextExchangeView \
            --require-label "candidateVehicleSystem1 : AEBSystem1CandidateDeployment" \
            --require-label "simulationEvidenceSystem2 : AEBSystem2SimulationAssets" \
            --min-flow-count 21 \
            --max-flow-count 21
          python scripts/check_svg_view_materialization.py \
            diagrams/diagram-mwFunctionalInterfaceView.svg \
            --view-name mwFunctionalInterfaceView \
            --require-label VehicleSignalAccessInbound \
            --require-label VehicleSignalAccessRequest
          python scripts/check_svg_view_materialization.py \
            diagrams/diagram-mwPhysicalStructureView.svg \
            --view-name mwPhysicalStructureView \
            --require-label "adapter : AutowareToAAOSSDVAdapterPhysical" \
            --require-label "aaosSdvBoundary : SDVCoreBoundary"

      - name: Export grid views and render review SVGs (Labs)
        if: steps.syside-secret.outputs.available == 'true'
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          read -r -a model_paths <<< "${MODEL_PATHS}"
          SYSIDE_VIEWS_SOURCE=".sysand/lib/sensmetry-syside-views_0.10.3/SysideViews.sysml"
          test -f "${SYSIDE_VIEWS_SOURCE}"
          export PYTHONHOME="${pythonLocation}"
          export PYTHONPATH="${pythonLocation}/lib/python3.12:${pythonLocation}/lib/python3.12/lib-dynload"
          syside table export "${model_paths[@]}" \
            --include "${SYSIDE_VIEWS_SOURCE}" \
            --output-dir grid-csv
          python scripts/render_grid_csv.py grid-csv diagrams
          for csv in grid-csv/*.csv; do
            view="${csv##*/}"
            view="${view%.csv}"
            view="${view#matrix-}"
            view="${view#table-}"
            rm -f "diagrams/diagram-${view}.svg"
          done

      - name: Check committed view index and diagrams
        if: steps.syside-secret.outputs.available == 'true'
        run: |
          python scripts/generate_view_index.py \
            textual-notation-of-model/packages/features/middleware
          git diff --exit-code -- \
            textual-notation-of-model/packages/features/middleware/VIEWS.md
          python scripts/check_committed_view_artifacts.py \
            textual-notation-of-model/packages/features/middleware \
            diagrams

      - name: Upload generated diagrams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syside-diagrams
          path: |
            diagrams/
            grid-csv/
          if-no-files-found: warn
