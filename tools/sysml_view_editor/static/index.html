<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DE4SDV SysML v2 View Editor</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #475569;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --flow: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; }
  header .view-name { color: var(--muted); font-size: 12px; }
  header .view-spec { color: var(--flow); font-size: 11px; }
  .btn {
    background: var(--accent); color: #0c4a6e; border: none; border-radius: 6px;
    padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .status { font-size: 12px; color: var(--muted); margin-left: auto; }
  .status.warn { color: #fbbf24; }
  main { padding: 12px; }
  #canvas-wrap {
    background: #0b1220; border: 1px solid var(--border); border-radius: 8px;
    overflow: auto; min-height: 420px;
  }
  svg { display: block; }
  #warnings {
    margin-top: 10px; font-size: 12px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; min-height: 20px; white-space: pre-wrap;
  }
  #warnings:empty { display: none; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 8px; }
  #docs {
    margin-top: 10px; font-size: 12.5px; line-height: 1.5;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px;
  }
  #docs .doc-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  #docs .doc-id { font-weight: 600; color: var(--accent); }
  #docs .doc-kind { color: var(--muted); }
  #docs .doc-kind .tag { color: var(--flow); }
  #docs .doc-body { margin-top: 6px; color: var(--text); white-space: pre-wrap; }
  #docs .doc-body.empty { color: var(--muted); font-style: italic; }
  .role-group.selected .role-box { stroke: var(--flow); stroke-width: 2.5; }
  .port-circle.selected { fill: var(--flow); }
  .flow-path.selected { stroke: var(--accent); stroke-width: 3; }
  .flow-path, .port-circle { cursor: pointer; }
  .role-box { cursor: grab; }
  .role-box:hover, .role-box.dragging { stroke: var(--accent); }
  .role-box.dragging { stroke-width: 2.5; cursor: grabbing; }
  .resize-handle { fill: var(--accent); stroke: #075985; stroke-width: 1; cursor: nwse-resize; opacity: 0.8; }
  .resize-handle:hover { opacity: 1; }
  .role-name { fill: var(--text); font-weight: bold; font-size: 13px; pointer-events: none; }
  .role-host { fill: var(--muted); font-size: 10px; pointer-events: none; }
  .port-circle { fill: var(--accent); stroke: #0ea5e9; }
  .port-label { fill: #cbd5e1; font-size: 10px; pointer-events: none; }
  .flow-path { fill: none; stroke: #d97706; stroke-width: 2; }
  .flow-label-bg { fill: var(--bg); stroke: var(--flow); stroke-width: 1; rx: 3; pointer-events: none; }
  .flow-label { fill: var(--flow); font-size: 11px; text-anchor: middle; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>DE4SDV SysML v2 View Editor</h1>
  <span class="view-name" id="view-name"></span>
  <span class="view-spec" id="view-spec"></span>
  <span class="status" id="semantic-status"></span>
  <button class="btn" id="save-btn">Save layout</button>
  <button class="btn secondary" id="reset-btn">Reset layout</button>
  <button class="btn secondary" id="export-btn">Export SVG</button>
</header>
<main>
  <div id="canvas-wrap"></div>
  <div id="warnings"></div>
  <div id="docs"></div>
  <p class="legend">Drag role boxes to arrange. Layout is presentation-only —
    semantics come from the authoritative SysML source. Save writes the sidecar.
    Click a role, port, or flow for its source `doc` description.</p>
</main>
<script>
"use strict";

const ROLE_W = 200, ROLE_H = 120, PORT_R = 8, GAP_X = 220, PAD = 40;

let graph = null;
let layout = null;
let placed = {};       // resolved positions: role id -> {x,y,w,h}, port id -> {x,y}
let dragging = null;   // {id, dx, dy} while dragging
let selected = null;   // {kind: "role"|"port"|"flow", id: string}
let movedDuringDrag = false;  // suppress click-to-select after a real drag

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res.json();
}

function chainOrder(roles, flows) {
  // Topological order of roles following flow direction (mirrors render.py).
  const indegree = {}; const outgoing = {};
  for (const r of roles) { indegree[r.id] = 0; outgoing[r.id] = []; }
  for (const f of flows) {
    const src = resolveEndpoint(f.source).role;
    const tgt = resolveEndpoint(f.target).role;
    if (src === tgt) continue;
    outgoing[src].push(tgt);
    indegree[tgt] += 1;
  }
  const ready = Object.keys(indegree).filter(id => indegree[id] === 0).sort();
  const ordered = [];
  while (ready.length) {
    const id = ready.shift();
    ordered.push(id);
    outgoing[id].sort().forEach(n => { indegree[n] -= 1; if (indegree[n] === 0) ready.push(n); });
  }
  const remaining = roles.map(r => r.id).filter(id => !ordered.includes(id)).sort();
  return ordered.concat(remaining);
}

function resolveEndpoint(path) {
  const parts = path.split(".");
  if (parts.length === 4) return { role: parts.slice(0, 2).join("."), port: parts.slice(0, 3).join(".") };
  if (parts.length === 3) return { role: parts[0], port: parts.slice(0, 2).join(".") };
  throw new Error(`unsupported endpoint: ${path}`);
}

function derivePorts(roleNodes) {
  // Ports are derived presentation geometry. Recompute them from the CURRENT
  // role rectangles so moves/resizes cannot detach endpoints or flow paths.
  const nodes = {};
  for (const role of graph.roles) {
    const n = roleNodes[role.id];
    nodes[role.id] = { x: n.x, y: n.y, w: n.w, h: n.h };
  }

  const portIndex = {};
  for (const f of graph.flows) {
    for (const [endpoint, kind] of [[f.source, "out"], [f.target, "in"]]) {
      const { role, port } = resolveEndpoint(endpoint);
      const n = portIndex[port] = (portIndex[port] || 0) + 1;
      const base = nodes[role];
      nodes[port] = {
        x: kind === "out" ? base.x + base.w : base.x,
        y: base.y + 20 + (n - 1) * 28,
      };
    }
  }
  return nodes;
}

function computePlacement() {
  // Initialize role geometry once from deterministic defaults + sidecar.
  // Ports are derived only AFTER overrides have been applied.
  const roles = {};
  const ordered = chainOrder(graph.roles, graph.flows);
  ordered.forEach((rid, col) => {
    const role = graph.roles.find(r => r.id === rid);
    const lines = role && role.doc ? wrapDoc(role.doc, ROLE_W) : [];
    const h = lines.length ? ROLE_H + lines.length * DOC_LINE_H + 6 : ROLE_H;
    roles[rid] = { x: PAD + col * (ROLE_W + GAP_X), y: PAD, w: ROLE_W, h };
  });

  for (const [rid, entry] of Object.entries(layout.nodes || {})) {
    if (roles[rid] && typeof entry.x === "number" && typeof entry.y === "number") {
      roles[rid].x = entry.x;
      roles[rid].y = entry.y;
      roles[rid].w = entry.width || ROLE_W;
      roles[rid].h = entry.height || roles[rid].h;
    }
  }
  return derivePorts(roles);
}

const DOC_LINE_H = 13, DOC_TOP = 52, DOC_MAX_LINES = 4, DOC_CAP_CHAR = 5.5;
function wrapDoc(doc, boxWidth) {
  const cap = Math.max(10, Math.floor((boxWidth - 20) / DOC_CAP_CHAR));
  const lines = [];
  for (const word of doc.split(/\s+/)) {
    if (!word) continue;
    if (lines.length && lines[lines.length - 1].length + 1 + word.length <= cap) {
      lines[lines.length - 1] += " " + word;
    } else {
      lines.push(word);
    }
  }
  if (lines.length > DOC_MAX_LINES) {
    lines.length = DOC_MAX_LINES;
    lines[lines.length - 1] = lines[lines.length - 1].slice(0, cap - 1) + "…";
  }
  return lines;
}

function roleCenter(roleId) {
  const n = placed[roleId];
  return { cx: n.x + n.w / 2, cy: n.y + n.h / 2 };
}

function render() {
  // `placed` is the live presentation state. Re-derive ports from its current
  // role rectangles; never reload the saved sidecar during interaction.
  placed = derivePorts(placed);
  const canvas = document.getElementById("canvas-wrap");

  // Compute bounds.
  let xMin = Infinity, yMin = Infinity, xMax = -Infinity, yMax = -Infinity;
  for (const n of Object.values(placed)) {
    xMin = Math.min(xMin, n.x); yMin = Math.min(yMin, n.y);
    xMax = Math.max(xMax, n.x + (n.w || 0)); yMax = Math.max(yMax, n.y + (n.h || 0));
  }
  xMin -= 140; xMax += 140; yMin -= 70; yMax += 40;

  const W = Math.max(400, xMax - xMin), H = Math.max(200, yMax - yMin);
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `${xMin} ${yMin} ${W} ${H}`);

  // Title.
  const title = document.createElementNS(svgNS, "text");
  title.setAttribute("x", xMin + 10); title.setAttribute("y", yMin + 24);
  title.setAttribute("font-size", "16"); title.setAttribute("font-weight", "bold");
  title.setAttribute("fill", "#e2e8f0");
  title.textContent = graph.view;
  svg.appendChild(title);

  // Flows (under nodes).
  for (const f of graph.flows) {
    const src = placed[resolveEndpoint(f.source).port];
    const tgt = placed[resolveEndpoint(f.target).port];
    const path = document.createElementNS(svgNS, "path");
    const x1 = src.x, y1 = src.y, x2 = tgt.x, y2 = tgt.y, mx = (x1 + x2) / 2;
    path.setAttribute("d", `M ${x1} ${y1} L ${mx} ${y1} L ${mx} ${y2} L ${x2} ${y2}`);
    path.setAttribute("class", "flow-path");
    path.setAttribute("data-flow", `flow-${f.index}`);
    const flowTitle = document.createElementNS(svgNS, "title");
    flowTitle.textContent = f.doc || `${f.payload} from ${f.source} to ${f.target}`;
    path.appendChild(flowTitle);
    path.addEventListener("click", (ev) => { ev.stopPropagation(); selectElement("flow", `flow-${f.index}`); });
    svg.appendChild(path);

    // Payload label with background.
    const textW = 8 + 7 * f.payload.length;
    const bg = document.createElementNS(svgNS, "rect");
    bg.setAttribute("x", mx - textW / 2); bg.setAttribute("y", Math.min(y1, y2) - 11);
    bg.setAttribute("width", textW); bg.setAttribute("height", 16);
    bg.setAttribute("class", "flow-label-bg");
    svg.appendChild(bg);
    const label = document.createElementNS(svgNS, "text");
    label.setAttribute("x", mx); label.setAttribute("y", Math.min(y1, y2));
    label.setAttribute("class", "flow-label");
    label.textContent = f.payload;
    svg.appendChild(label);
  }

  // Roles.
  for (const role of graph.roles) {
    const n = placed[role.id];
    const g = document.createElementNS(svgNS, "g");
    g.setAttribute("data-role", role.id);
    g.classList.add("role-group");
    g.addEventListener("click", (ev) => {
      if (movedDuringDrag) return;  // it was a drag, not a selection click
      ev.stopPropagation();
      selectElement("role", role.id);
    });

    const rect = document.createElementNS(svgNS, "rect");
    rect.setAttribute("x", n.x); rect.setAttribute("y", n.y);
    rect.setAttribute("width", n.w); rect.setAttribute("height", n.h);
    rect.setAttribute("rx", "8");
    rect.setAttribute("class", "role-box");
    if (dragging?.id === role.id && dragging.kind === "move") rect.classList.add("dragging");
    const roleTitle = document.createElementNS(svgNS, "title");
    roleTitle.textContent = role.doc || `${role.name} (${role.type || "(unresolved)"})`;
    rect.appendChild(roleTitle);
    g.appendChild(rect);

    const name = document.createElementNS(svgNS, "text");
    name.setAttribute("x", n.x + 12); name.setAttribute("y", n.y + 24);
    name.setAttribute("class", "role-name");
    name.textContent = role.name;
    g.appendChild(name);

    const host = document.createElementNS(svgNS, "text");
    host.setAttribute("x", n.x + 12); host.setAttribute("y", n.y + 42);
    host.setAttribute("class", "role-host");
    host.textContent = role.host;
    g.appendChild(host);

    // Doc compartment: separator + wrapped doc text inside the box, clipped
    // to the role rectangle so manual resize never overflows visually.
    if (role.doc) {
      const clip = document.createElementNS(svgNS, "clipPath");
      clip.setAttribute("id", `clip-${CSS.escape(role.id)}`);
      const clipRect = document.createElementNS(svgNS, "rect");
      clipRect.setAttribute("x", n.x); clipRect.setAttribute("y", n.y);
      clipRect.setAttribute("width", n.w); clipRect.setAttribute("height", n.h);
      clip.appendChild(clipRect);
      svg.appendChild(clip);
      g.setAttribute("clip-path", `url(#clip-${CSS.escape(role.id)})`);

      const sep = document.createElementNS(svgNS, "line");
      sep.setAttribute("x1", n.x + 8); sep.setAttribute("y1", n.y + 47);
      sep.setAttribute("x2", n.x + n.w - 8); sep.setAttribute("y2", n.y + 47);
      sep.setAttribute("stroke", "#475569"); sep.setAttribute("stroke-width", "1");
      sep.classList.add("role-doc");
      g.appendChild(sep);
      const lines = wrapDoc(role.doc, n.w);
      lines.forEach((line, i) => {
        const t = document.createElementNS(svgNS, "text");
        t.setAttribute("x", n.x + 12); t.setAttribute("y", n.y + DOC_TOP + i * DOC_LINE_H);
        t.setAttribute("font-size", "9"); t.setAttribute("fill", "#cbd5e1");
        t.classList.add("role-doc");
        t.textContent = line;
        g.appendChild(t);
      });
    }

    // Resize handle in the bottom-right corner.
    const handle = document.createElementNS(svgNS, "rect");
    handle.setAttribute("x", n.x + n.w - 14);
    handle.setAttribute("y", n.y + n.h - 14);
    handle.setAttribute("width", "14");
    handle.setAttribute("height", "14");
    handle.setAttribute("class", "resize-handle");
    handle.setAttribute("data-resize", role.id);
    const handleTitle = document.createElementNS(svgNS, "title");
    handleTitle.textContent = `Resize ${role.name}`;
    handle.appendChild(handleTitle);
    g.appendChild(handle);

    svg.appendChild(g);
  }

  // Ports.
  for (const port of graph.ports) {
    const n = placed[port.id];
    const side = graph.flows.some(f => resolveEndpoint(f.source).port === port.id) ? "out" : "in";
    const cx = side === "out" ? n.x : n.x;
    const circle = document.createElementNS(svgNS, "circle");
    circle.setAttribute("cx", cx); circle.setAttribute("cy", n.y);
    circle.setAttribute("r", PORT_R);
    circle.setAttribute("class", "port-circle");
    circle.setAttribute("data-port", port.id);
    const portTitle = document.createElementNS(svgNS, "title");
    portTitle.textContent = port.doc || `${port.name}: ${port.payload}`;
    circle.appendChild(portTitle);
    circle.addEventListener("click", (ev) => {
      if (movedDuringDrag) return;
      ev.stopPropagation();
      selectElement("port", port.id);
    });
    svg.appendChild(circle);

    const label = document.createElementNS(svgNS, "text");
    const lx = side === "out" ? cx + PORT_R + 6 : cx - PORT_R - 6;
    label.setAttribute("x", lx); label.setAttribute("y", side === "out" ? n.y - (PORT_R + 6) : n.y + PORT_R + 14);
    label.setAttribute("text-anchor", side === "out" ? "start" : "end");
    label.setAttribute("class", "port-label");
    label.textContent = port.name;
    svg.appendChild(label);
  }

  canvas.replaceChildren(svg);
  if (selected) selectElement(selected.kind, selected.id);
  updateWarnings();
}

function updateWarnings() {
  const el = document.getElementById("warnings");
  const warnings = [];
  const nodeIds = new Set(graph.roles.map(r => r.id));
  graph.ports.forEach(p => nodeIds.add(p.id));
  const edgeIds = new Set(graph.flows.map(f => `flow-${f.index}`));
  for (const id of nodeIds) if (!(id in (layout.nodes || {}))) warnings.push(`unplaced: ${id}`);
  for (const id of edgeIds) if (!(id in (layout.edges || {}))) warnings.push(`unplaced: ${id}`);
  for (const id of Object.keys(layout.nodes || {})) if (!nodeIds.has(id)) warnings.push(`orphan: ${id}`);
  for (const id of Object.keys(layout.edges || {})) if (!edgeIds.has(id)) warnings.push(`orphan: ${id}`);
  el.textContent = warnings.length ? warnings.join("\n") : "";
  document.getElementById("semantic-status").textContent =
    `${graph.roles.length} roles · ${graph.ports.length} ports · ${graph.flows.length} flows · hash ${graph.semantic_hash}`;
}

function showDocs(kind, id) {
  selected = kind && id ? { kind, id } : null;
  const el = document.getElementById("docs");
  if (!selected) {
    el.innerHTML = "";
    return;
  }
  const doc = findDoc(kind, id);
  el.innerHTML = `
    <div class="doc-title">${doc.kind} — source doc</div>
    <div><span class="doc-id">${escapeHtml(doc.id)}</span> <span class="doc-kind">${doc.meta}</span></div>
    <div class="doc-body ${doc.body ? "" : "empty"}">${escapeHtml(doc.body || "No doc comment in the SysML source for this element.")}</div>`;
}

function findDoc(kind, id) {
  if (kind === "role") {
    const r = graph.roles.find(x => x.id === id);
    return { kind: "Role", id: r.id, meta: `type ${r.type || "(unresolved)"}`, body: r.doc || "" };
  }
  if (kind === "port") {
    const p = graph.ports.find(x => x.id === id);
    return { kind: "Port", id: p.id, meta: `payload ${p.payload}`, body: p.doc || "" };
  }
  const f = graph.flows.find(x => x.id === id || `flow-${x.index}` === id);
  return {
    kind: "Flow", id: `${f.source} → ${f.target}`,
    meta: `payload ${f.payload}`, body: f.doc || "",
  };
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function selectElement(kind, id) {
  // Preserve selection across renders; draw order redraws highlight classes.
  showDocs(kind, id);
  const svg = document.querySelector("#canvas-wrap svg");
  if (!svg) return;
  svg.querySelectorAll(".selected").forEach(n => n.classList.remove("selected"));
  if (!selected) return;
  if (selected.kind === "role") {
    svg.querySelectorAll(`[data-role="${CSS.escape(selected.id)}"]`).forEach(n => n.classList.add("selected"));
  } else if (selected.kind === "port") {
    svg.querySelectorAll(`[data-port="${CSS.escape(selected.id)}"]`).forEach(n => n.classList.add("selected"));
  } else {
    svg.querySelectorAll(`[data-flow="${CSS.escape(selected.id)}"]`).forEach(n => n.classList.add("selected"));
  }
}

function serializeLayout() {
  const nodes = {};
  for (const [id, n] of Object.entries(placed)) {
    if (graph.roles.some(r => r.id === id)) {
      nodes[id] = { x: Math.round(n.x), y: Math.round(n.y), width: n.w, height: n.h };
    }
  }
  return {
    schema_version: 1,
    view: graph.view,
    semantic_hash: graph.semantic_hash,
    nodes,
    edges: layout.edges || {},
  };
}

async function saveLayout() {
  const res = await fetch("/layout.json", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(serializeLayout()),
  });
  const data = await res.json();
  const status = document.getElementById("semantic-status");
  if (res.ok) {
    status.textContent = "saved ✓";
    layout = { ...layout, ...serializeLayout() };
    updateWarnings();
  } else {
    status.textContent = `save failed: ${data.error || "unknown"}`;
    status.className = "status warn";
  }
}

function resetLayout() {
  layout = { schema_version: 1, view: graph.view, semantic_hash: graph.semantic_hash, nodes: {}, edges: {} };
  placed = computePlacement();
  render();
}

function exportSvg() {
  const svg = document.querySelector("#canvas-wrap svg");
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  const blob = new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${graph.view || "view"}.svg`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function setupDrag() {
  const canvas = document.getElementById("canvas-wrap");

  canvas.addEventListener("mousedown", (ev) => {
    const resizeEl = ev.target.closest("[data-resize]");
    const roleEl = ev.target.closest("[data-role]");
    const portEl = ev.target.closest("[data-port]");
    const flowEl = ev.target.closest("[data-flow]");
    // Click on empty canvas clears the selection.
    if (!resizeEl && !roleEl && !portEl && !flowEl) {
      selectElement(null, null);
    }
    if (!resizeEl && !roleEl) return;
    ev.preventDefault();

    // Freeze the viewport-to-SVG scale for the gesture. The SVG bounds may
    // change while the whole connected diagram is re-rendered.
    const svg = canvas.querySelector("svg");
    const rect = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    const scaleX = vb.width / rect.width;
    const scaleY = vb.height / rect.height;

    if (resizeEl) {
      const roleId = resizeEl.getAttribute("data-resize");
      const n = placed[roleId];
      dragging = {
        id: roleId,
        kind: "resize",
        startClientX: ev.clientX,
        startClientY: ev.clientY,
        scaleX,
        scaleY,
        baseW: n.w,
        baseH: n.h,
      };
      render();
      return;
    }

    const roleId = roleEl.getAttribute("data-role");
    const n = placed[roleId];
    dragging = {
      id: roleId,
      kind: "move",
      startClientX: ev.clientX,
      startClientY: ev.clientY,
      scaleX,
      scaleY,
      baseX: n.x,
      baseY: n.y,
    };
    render();
  });

  // Window-level listeners survive replacement of the SVG subtree during a
  // gesture. Every update redraws roles, derived ports, flows, and labels from
  // the same live presentation state.
  window.addEventListener("mousemove", (ev) => {
    if (!dragging) return;
    const dx = (ev.clientX - dragging.startClientX) * dragging.scaleX;
    const dy = (ev.clientY - dragging.startClientY) * dragging.scaleY;
    const n = placed[dragging.id];

    if (dragging.kind === "move") {
      n.x = Math.max(0, Math.round(dragging.baseX + dx));
      n.y = Math.max(0, Math.round(dragging.baseY + dy));
    } else {
      n.w = Math.max(120, Math.round(dragging.baseW + dx));
      n.h = Math.max(60, Math.round(dragging.baseH + dy));
    }
    movedDuringDrag = true;
    render();
  });

  const commit = () => {
    if (!dragging) return;
    dragging = null;
    render();
    // Let any trailing click event see the flag before we clear it.
    setTimeout(() => { movedDuringDrag = false; }, 0);
  };
  window.addEventListener("mouseup", commit);
  window.addEventListener("blur", commit);
}

async function init() {
  try {
    graph = await getJSON("/graph.json");
    layout = await getJSON("/layout.json");
    document.getElementById("view-name").textContent = graph.view;
    const vs = graph.view_spec || {};
    const specParts = [];
    if (vs.viewpoint) specParts.push(`viewpoint ${vs.viewpoint}`);
    if (vs.viewpoint_type) specParts.push(`(${vs.viewpoint_type})`);
    if (vs.concern) specParts.push(`frame ${vs.concern}`);
    if (vs.render) specParts.push(`render ${vs.render}`);
    document.getElementById("view-spec").textContent = specParts.length ? specParts.join(" · ") : "";
    if (vs.deployment_source !== "view") {
      const docPanel = document.getElementById("docs");
      const reason = vs.unresolved_exposes && vs.unresolved_exposes.length
        ? `view exposes ${vs.unresolved_exposes.join(", ")} — none resolve to a deployment part usage`
        : "no view block found in the model";
      docPanel.innerHTML = `
        <div class="doc-title">View-source warning</div>
        <div class="doc-body">Diagram content sourced from ${vs.deployment_source || "default"} deployment
        (${reason}). The declared view could not select the rendered content.</div>`;
    }
    document.getElementById("semantic-status").textContent =
      `${graph.roles.length} roles · ${graph.ports.length} ports · ${graph.flows.length} flows`;
    placed = computePlacement();
    render();
    setupDrag();
    document.getElementById("save-btn").addEventListener("click", saveLayout);
    document.getElementById("reset-btn").addEventListener("click", resetLayout);
    document.getElementById("export-btn").addEventListener("click", exportSvg);
    // Show the deployment-level context by default so a reviewer sees the
    // campaign narrative without having to click anything. Skip when the
    // diagram was NOT sourced from the declared view (warning already shown).
    if (graph.deployment_doc && graph.view_spec?.deployment_source === "view") {
      document.getElementById("docs").innerHTML = `
        <div class="doc-title">Deployment — source doc</div>
        <div class="doc-body">${escapeHtml(graph.deployment_doc)}</div>`;
    }
  } catch (err) {
    document.getElementById("warnings").textContent = `Failed to load: ${err.message}`;
  }
}

init();
</script>
